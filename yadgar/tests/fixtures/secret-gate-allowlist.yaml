# Secret-gate allowlist fixture for tests (v5.13.0)
#
# This file is the CI-test fixture.  User production allowlist lives at:
#   ~/.yadgar/secret-gate-allowlist.yaml  (set via YADGAR_SECRET_GATE_ALLOWLIST_PATH)
#
# Schema version: 1
# Reference: docs/PLAN_V5_13_0_SECRET_GATE_CONTEXT_AWARENESS.md
#
# Format:
#   allowlist:
#     - tags: ["<tag>"]         # required; all listed tags must be present at call site
#       patterns: ["<prefix>*"] # required; glob-prefix patterns to bypass
#       reason: "<string>"      # required; human-readable justification
#
# False-positive cases from v5.10.2 ship (commits cdafe04, 36047f3):
allowlist:
  # Test fixtures with fake GitHub tokens — shortened to bypass gate in v5.10.2
  - tags: ["test-fixture"]
    patterns: ["ghp_*", "gho_*", "ghs_*", "ghu_*", "ghr_*"]
    reason: "test fixtures may contain fake GitHub tokens (not real credentials)"

  # Plan documents discussing secret patterns by name
  - tags: ["plan-document"]
    patterns: ["ghp_*", "sk-ant-*", "sk-*", "AKIA*", "glpat-*"]
    reason: "plan docs discuss secret patterns as examples; not actual leaks"

  # CHANGELOG/MIGRATION_NOTES references to pattern strings
  - tags: ["changelog"]
    patterns: ["ghp_{", "sk-ant-{", "sk-{", "AKIA"]
    reason: "changelog entries reference pattern format strings, not credentials"
