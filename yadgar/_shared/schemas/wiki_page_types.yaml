# Wiki page-type schema registry (Stage 3 externalization, 2026-07-10).
# Single source of truth for PAGE_TYPES — loaded at import by
# yadgar/_shared/wiki_meta.py via importlib.resources (packaged resource, no
# $HOME copy: ships tested with each version). Zero schema literals in code.
#
# Per page type:
#   required: section headings (## / ###, case-insensitive) wiki_lint warns on
#             when absent (ADVISORY — wiki_add never rejects on page_type mismatch).
#   optional: recognised extra sections — documented shape, never linted against.
#   metadata: free-form descriptors of page-level metadata conventions.
#
# WIKI_SCHEMA_VERSION is stamped on new pages at write time. Existing pages
# that predate this field are treated as schema_version=0 / untyped.
schema_version: 1
page_types:
  function:
    required: [Purpose, Signature, Behaviour]
  module:
    required: [Purpose, Exports, Design]
  service:
    required: [Purpose, Interface, Dependencies]
  architecture:
    required: [Overview, Components]
  decision:
    required: [Context, Decision, Consequences]
  analysis:
    required: [Summary, Findings]
  adr:
    # Car 0: Architecture Decision Record page type. Lets wiki_lint format-check
    # ADR pages and makes the CANONICAL_PAGE_TYPES allowlist assertion unambiguous.
    required: [Context, Decision, Consequences]
  adr_superseded:
    # Car G (0047 §7 D23): the ``adr`` page is RETYPED to ``adr_superseded``
    # when a successor ADR supersedes it. Lint shape mirrors ``adr`` (the
    # required sections never change — only the page_type field flips). The
    # retype is the SOLE sanctioned writer (D26: locked mutability blocks
    # agent/tool edits but not server-side lifecycle transitions); wiki_lint
    # format-checks the result.
    required: [Context, Decision, Consequences]
  agent_prompt:
    # PRE-ADR-0209 type. Split into agent_pattern + agent_discipline below;
    # migration 028 re-types the live corpus. Retained so pages on an install
    # that has not yet migrated still lint against the shape they were written
    # with. Do NOT write new pages with this type.
    required: [Purpose, Prompt]
    optional: [Preconditions, Failure modes, Verification, Composes]
    metadata:
      composes_with: >-
        [[slug]] links under the ## Composes section — discipline pages
        (agent-discipline-*) this prompt composes with; resolved by
        agent_dispatch_prelude at assembly time (Stage 3 composition).
      applies_to: >-
        Task shapes this prompt applies to (free text; surfaced in the
        agent-prompt-toc purpose column).
  agent_pattern:
    # ADR-0209: dispatch-pattern pages (agent-prompt-<pattern>). Same document
    # shape as the pre-split agent_prompt type — the split is about GOVERNANCE
    # (ADR-0208 gives disciplines an asymmetric removal guard), not layout.
    required: [Purpose, Prompt]
    optional: [Preconditions, Failure modes, Verification, Composes]
    metadata:
      composes_with: >-
        [[slug]] links under the ## Composes section — discipline pages
        (agent-discipline-*) this prompt composes with; resolved by
        agent_dispatch_prelude at assembly time (Stage 3 composition).
      applies_to: >-
        Task shapes this prompt applies to (free text; surfaced in the
        agent-prompt-toc purpose column).
  agent_discipline:
    # ADR-0209: cross-cutting rule pages (agent-discipline-<name>) PLUS the
    # prelude contract, which stays inside this type per ADR-0198's refusal of
    # a singleton special case — it is flagged, not promoted.
    required: [Purpose, Prompt]
    optional: [Preconditions, Failure modes, Verification, Composes]
    metadata:
      always_applied: >-
        TRUE only for the prelude contract (agent-prompt-contract), which
        prefixes every dispatch and whose `covers:` list decides which
        disciplines are dropped from an assembled prelude. ADR-0208 exempts it
        from auto-apply on a clean three-way merge for that reason.
      composes_with: >-
        Discipline pages are composed INTO a prelude by agent_dispatch_prelude;
        they carry no ## Composes list of their own.
  task_list:
    required: [Meta]
    optional: [Tasks]
    metadata:
      shape: >-
        One "## Meta" page-level section plus one "## task:<id>" section per
        task (id zero-padded to 4 digits). Per-task fields are "- key: value"
        bullets; multi-line values indent continuation lines 2 spaces so an
        embedded ## / ``` cannot be mis-parsed as a section boundary. Lint is
        ADVISORY and covers only the fixed "## Meta" section — dynamic
        "## task:<id>" headings cannot be validated by a fixed required list.
      status_enum: >-
        Task status is one of {pending, in_progress, completed} — the harness
        value stored verbatim. "blocked" is NOT a status; it is derived from a
        non-empty blockedBy array.
  wiki_rollup:
    # Car H (0047 §7 D29): per-subsystem ADR rollup pages, DERIVED/LOCKED —
    # regenerated by ``admin_exec.rollup._regenerate_subsystem_rollup`` on
    # every ``adr_add`` post-commit (§10 Q1 on-write trigger). Mutability
    # resolver at ``yadgar/_shared/wiki/policy.py::MUTABILITY_BY_TYPE`` sets
    # this type's mutability to ``"derived"``; the storage chokepoint rejects
    # non-sanctioned writes. The page carries one ADR per subsystem — the
    # "what governs vacuum?" answer (§8 line 628) becomes a one-page read.
    required: [Overview, Decisions]
    metadata:
      derived_from: >-
        Rendered from ``adr`` rows where ``subsystem = <slug_suffix>``. The
        slug carries the subsystem as the last path segment so the regen
        writer is keyed by ``(project_id, subsystem)``.
      recall_disposition: exclude
      opt_in_tag: rollup
