# Canonical agent-prompt starter materials (v5.88 seed consolidation).
# Edited here, loaded by yadgar.server.tools.agent_prompts.STARTER_PROMPTS.
# Each entry: pattern (slug), purpose (one-line TOC desc), content (prompt body).
# content uses a |- block scalar (strip final newline) — bodies have NO trailing newline.

# contract: the genesis prelude contract (NOT a dispatch-pattern starter — excluded from
# STARTER_PROMPTS; seeded separately by _seed_contract_page in agent_prompts.py).
# Runtime source of truth is the WIKI PAGE agent-prompt-contract; this block is the
# packaged genesis/schema copy used for first seed, seed-on-miss, and last-resort fallback.
contract:
  pattern: contract
  purpose: Yadgar subagent protocol contract (prelude injected before every dispatch).
  # covers: discipline slugs whose rules the contract text already carries — the
  # prelude composition (Stage 3) dedups these (never re-included alongside the
  # contract even when a pattern page lists them under ## Composes).
  covers:
  - agent-discipline-recall-first
  content: |-
    Before substantive work:
    1. `recall("…relevant topic…")` — surface hot memories, anchors, prior findings.
    2. Observed state always wins over recalled state (update if contradicted).
    3. For most agents: do NOT call `memorize()` directly — emit findings in report instead.
       Exception: long_running agents may call memorize with provenance_agent set.
    4. Executing work from a docs/plans/ plan? `wiki_read agent-prompt-plan-executing-build` —
       its plan lifecycle (ADR-0081/0082) and discipline rules bind this dispatch.
    5. Dispatching a sub-agent yourself? Honor its pattern's DISPATCH: model tier; set model explicitly.

    REQUIRED: your final message MUST end with this section (even if empty):
    This footer IS memorized verbatim — one memory per bullet. Write each bullet as a standalone, context-complete memory (durable fact, not status); note candidates as you go and finalize at the end.

    ## Yadgar findings
    - <fact/anchor/insight> or "none"

# prompts: the generic (any-project) starter dispatch patterns.
# v5.124.0 consolidation (34→18 live map; generic subset here). Selection criterion:
# GENERIC by content (no yadgar arch/paths/harness/identity) AND satisfies the seed
# schema (opens with a DISPATCH: line, survives _unwrap_purpose_prompt).
# The 5 merged canonicals (rca-diagnose, plan-audit, scope-and-plan, build-car,
# perf-measure-live) each carry a ## Modes section documenting absorbed variants as args;
# only the 3 generic ones (rca-diagnose, plan-audit, scope-and-plan, build-car) are seeded —
# perf-measure-live is yadgar-harness-specific (live-wiki only).
# EXCLUDED as yadgar-session-specific (live-wiki only): perf-measure-live,
# perf-anomaly-metrics, profile-latency-standalone, relocate-tool-group-to-backend-forward,
# viz-frontend-fix, cleanup (yadgar release-audit), integrate-train-and-pr (yadgar/codeberg
# release harness), deep-investigation-build-vs-buy, debug-flaky-ci-via-local-repro,
# drift-axis-remediation-sweep.
# RETIRED/merged (no longer seeded): crash-rca (→ rca-diagnose mode=prod-crash),
# plan-corpus-status-sweep (→ drift-audit mode=plan-corpus), build-cache-car-tdd (deprecated),
# and the plan/perf variants folded into scope-and-plan.
prompts:
- pattern: pr-review
  purpose: Review any PR against its base by its real effect — universal core checks + conditional stack lenses (code/infra/migration/API), evidence-gated, read-only.
  content: |-
    DISPATCH: model=opus (fallback=sonnet for small/mechanical PRs) — review depth scales with blast radius — canonical: model-tier-dispatch

    ## Purpose
    Review ANY pull request against its base branch by its REAL effect, not just the visible
    diff. Adapt the depth and the lenses to what the PR actually touches. READ-ONLY.

    ## Safety (hard, non-negotiable)
    A review MUTATES NOTHING. Allowed: `git diff/show/log -p`, read files, run the repo's
    existing tests/lint/type/build, render/dry-run (`kubectl kustomize`, `helm template`,
    `--dry-run=client`). FORBIDDEN: any apply/deploy/push/merge, `kubectl apply/delete`,
    `helm install/upgrade`, `flux reconcile`, `argocd sync`, `terraform apply/import/state`
    (never run terraform at all unless the repo already sanctions `plan`), `digger ...`, DB
    writes. If a check would mutate, don't run it.

    ## Method
    1. ELIGIBILITY: closed/draft/superseded → say so, stop.
    2. MAP THE CHANGE SURFACE from `git diff <base>...<head>` (three-dot / merge-base):
       app code · tests · public API/contract · DB migration · infra/IaC
       (k8s/helm/kustomize/terraform) · config/secrets · CI/build · deps · docs. This selects
       which LENSES apply. Scale effort to blast radius.
    3. CONTEXT: read the PR body + root and directory-scoped CLAUDE.md / conventions / OWNERS.
       Observed code ALWAYS wins over the PR description.
    4. LOOK BEYOND THE VISIBLE DIFF where an edit has amplified effect: rendered manifests
       (kustomize/helm), generated code, a config value that changes runtime behavior, a
       migration that reshapes the schema, a shared helper now called differently.
    5. CORE CHECKS (every PR) + 6. TRIGGERED LENSES (only for touched surfaces) — below.
    7. RUN THE REPO'S OWN CHECKS (never author new infra): tests/lint/types/build/schema/
       policy it already ships; report pass/fail. Surface pre-existing failures separately.
    8. VERIFY each finding against the actual code/rendered output BEFORE flagging.

    ## Core checks (every PR)
    Correctness (bugs, off-by-one, null, wrong operator, unhandled error) · Security
    (injection, secrets in the diff, authz gaps) · Tests (fails-before/passes-after, or
    untested?) · Completeness (a caller/companion resource/flag/doc/enum-case not updated;
    what the diff implies but doesn't do) · PR-desc vs diff (undisclosed / scope-creep
    changes) · Compat (breaking public API/schema/CLI/config key? versioned?) · Conventions
    (quote the CLAUDE.md/project rule violated).

    ## Triggered lenses (apply only if that surface is touched)
    - INFRA/IaC: render BASE vs PR and DIFF the output (the real change surface); trace every
      base/patch/HelmRelease/valuesFrom/secretRef. Ownership conflict: a resource managed by
      TWO controllers (Flux vs Argo vs raw vs Terraform) = drift/flap. Missing
      limits/probes/PDB/NetworkPolicy, `:latest` tags, privileged/hostPath, RBAC over-grant.
      State the live-cluster impact.
    - DB MIGRATION: reversible? locking/blocking on a big table? backfill safe? data-loss?
      forward/backward-compatible with the running app during rollout?
    - PUBLIC API/CONTRACT: breaking for consumers? versioned/deprecated cleanly?
    - CONCURRENCY/ASYNC: races, deadlocks, unclosed resources, event-loop-bound primitives.
    - DEPENDENCIES: new dep justified + not a lighter option? lockfile updated? supply-chain?
    - FRONTEND: a11y, XSS/injection, bundle-size cliff.

    ## Severity + confidence
    Tag every finding; score confidence 0-100; surface only >=80.
      BLOCKER  — breaks prod / data-loss / security / ownership conflict / secret leak
      CONCERN  — fragile: missing guard/test, drift risk, unpinned dep, perf cliff
      NIT      — style/naming (only when a thorough review is requested)
      QUESTION — need author intent before judging
    0-25 likely false-positive/pre-existing · 26-50 minor · 51-75 valid-low · 76-90 important
    · 91-100 critical. Drop <80.

    ## Do NOT flag (false-positive guards)
    Pre-existing issues not in this diff · lint/type/compiler-catchable (assume CI) · pedantic
    nits · findings on lines the PR didn't touch · intentional-and-explained changes ·
    anything you did NOT verify · the author's rationale on faith (verify it). If unsure, ask
    (QUESTION) rather than assert a BLOCKER.

    ## Output
    1. Findings by severity: `<file>:<line>: <severity>: <problem>. <impact>. <fix>.` Cite the
       rule when one applies; permalink (SHA + #Lstart-Lend) for a remote PR.
    2. `## PR-desc vs diff` — matches / diverges.
    3. `## Checks` — tests/lint/render/policy pass/fail (pre-existing failures noted separately).
    4. `## Verdict` — REQUEST-CHANGES (any blocker) · COMMENT (only concerns/questions) ·
       APPROVE (clean) + a concise, ready-to-paste review comment.
    Terse by default; security, data-loss, ownership, and breaking-change findings get a full
    paragraph (cause + reference). No praise, no restating the code.
- pattern: debug-investigate
  purpose: Root-cause a bug and ship a minimal fix with a regression test.
  content: |-
    DISPATCH: model=opus (fallback=sonnet for shallow bugs) — canonical: model-tier-dispatch

    Reproduce the bug first — confirm failure before touching code.
    Isolate via bisection, logging, or binary-search; identify the true root cause, not the symptom.
    If a `code_graph` memory block exists for this repo, its hotspots/fan-in data can help localize which module the bug likely lives in before you bisect blind.
    Apply the minimal fix — surgical edit, no opportunistic cleanups.
    Add a regression test that fails before the fix and passes after.
    Run the full suite; loop until green.

    ## Composes
    - [[agent-discipline-adr-consult]]
- pattern: explore-codebase
  purpose: Map where code lives / how a subsystem works (READ-ONLY).
  content: |-
    DISPATCH: model=sonnet (haiku for pure listing) — canonical: model-tier-dispatch

    READ-ONLY investigation — make zero edits.
    If the repo has code_graph enabled, check the per-dir `code_graph` memory block (auto-injected digest: layers/hotspots/entry-points/endpoints) or run `yadgar code-graph query <repo> <cypher>` FIRST — real indexed structure beats cold grep on a large/unfamiliar tree. Fall back to grep/glob when it doesn't have the answer, or the repo has no digest.
    Locate where X lives or how Y works; start broad (grep/glob) then narrow.
    Return a file:line table with one row per relevant symbol or entry-point.
    Quote function signatures exactly as they appear in source.
    Do NOT propose or apply fixes; report the map, not opinions.
- pattern: implement-tdd
  purpose: Implement a feature test-first with a 5-phase hardening pipeline (RED-VERIFY → adversarial critic → green → mutation+fuzz → gates) — risk-tiered so trivial diffs skip the expensive phases.
  content: |-
    DISPATCH: model=sonnet (fallback=opus) — mechanical when the spec is crisp; opus for gnarly logic. Background; worktree if parallel writers. — canonical: model-tier-dispatch

    Build application/library code test-first with a hardening pipeline. Phases are RISK-TIERED: run the FULL pipeline (all 5) for load-bearing app/lib logic; for trivial/mechanical diffs (config, infra .nix/.yaml, one-liners, version bumps, docs, codemods) run phases 1+3+5 ONLY.

    Contract: recall-first; observed-state-wins; end your report with `## Yadgar findings`.

    PHASE 1 — TESTS FIRST + RED-VERIFY
    - Write tests before implementation, one per acceptance criterion in the spec.
    - Run them. Confirm they FAIL — and fail for the RIGHT reason: an assertion failure or NotImplementedError, NOT ImportError / SyntaxError / collection error. A test that ERRORS instead of failing has not been shown to test anything. Fix until the failure is a genuine assertion miss.

    PHASE 2 — ADVERSARIAL TEST-CRITIC (load-bearing code only; skip for trivial)
    - Review the tests adversarially (assume they are weak) against this rubric:
      - Real assertions — not assertTrue(True), not tautological, not asserting a mock return you just set.
      - Tests BEHAVIOR/contract, not implementation detail.
      - Every acceptance criterion AND every non-trivial branch has a test.
      - Edge + error cases present (empty, boundary, malformed, exception paths).
      - No over-mocking that stubs out the unit under test.
    - Fix gaps. Loop MAX 2 rounds; still weak → STOP + report (do not spin).

    PHASE 3 — IMPLEMENT → GREEN
    - Minimal code to pass. Red → green.

    PHASE 4 — POST-GREEN HARDEN (load-bearing code only; skip for trivial)
    - Mutation testing (mutmut) on the CHANGED module(s) ONLY, time-boxed (~10 min). Exhaustive per module (NOT sampled). A surviving mutant = a bug your tests miss → add a test that kills it. Loop MAX 2. A genuinely-equivalent mutant may be allowlisted with a one-line justification comment.
    - Property/fuzz (hypothesis) for pure functions + parsers: invariant-driven (never-raises / idempotent / round-trip / conserves-invariant), max_examples >= 200 (>= 500 for critical paths). A fuzz failure → fix the code, PIN the discovered case with @example so it cannot re-flake, and keep it as a regression test.

    PHASE 5 — GATES + COMMIT
    - Run available checks (lint, types, complexity, observe-coverage, e2e). Fix root cause; surface pre-existing failures separately. Same fix fails 2× → stop + report.
    - No --no-verify / hook bypass. No Co-Authored-By. Then commit.

    CAPS: every fix-loop bounded (critic 2, mutation 2, fuzz 2) → escalate, never infinite-loop.
    TIER RULE: does the diff carry non-trivial branching/logic in app/lib code? yes → full 5 phases; no → phases 1+3+5.
- pattern: plan-executing-build
  purpose: 'Standing preamble for plan-executing build dispatches: ADR-0081/0082 plan lifecycle + full incident-tested discipline set'
  # v5.122.0: seeded so the prelude contract's rule 4 pointer (wiki_read
  # agent-prompt-plan-executing-build) resolves on FRESH installs. Content is a
  # verbatim copy of the live wiki page (Stage 2 rewrite: cross-cutting rules
  # extracted to the composed discipline pages). Seeder is create-if-absent —
  # existing deployments keep their live page untouched. This is a DISCIPLINE
  # PREAMBLE, not a task pattern (contract rule 4 depends on the slug).
  content: |-
    DISPATCH: model=opus for multi-seam cars, sonnet for mechanical cars — plan states which — canonical: model-tier-dispatch

    ## Purpose
    Standing preamble block for ANY dispatch that executes a docs/plans/ plan (feature build, fix train car, closeout). Encodes ADR-0081/0082 plan-lifecycle + the battle-tested discipline set.

    ## Prompt block (prepend to build dispatches)
    PLAN LIFECYCLE: per [[agent-discipline-plan-lifecycle]] — archive-first commit when the branch COMPLETES the plan (move not copy); Status-header update on partial scope (car N of M, final car archives); plan-file conflict on rebase = STOP and re-read.

    DISCIPLINE (incident-tested; full rules in the composed disciplines):
    - Isolated worktree off origin/master; branch + version state per [[agent-discipline-branch-state]] (git fetch first; version pre-claim; 5-site sync incl yadgar/__init__.py::BACKEND_VERSION — manual site).
    - Test/monitor/push hygiene per [[agent-discipline-process-hygiene]]. Per-file -n0; no full sweeps; no make targets.
    - Commit gates per [[agent-discipline-commit-hygiene]].
    - DB access: backend pipelines only (ADR-0078) — a new core-side DB read is STOP-AND-ASK.
    - Ship: push, PR via codeberg API (base master, no template exists), VERIFY body via GET after create. Leave worktree for main thread.
    - End report with ## Yadgar findings.

    ## Composes
    - [[agent-discipline-plan-lifecycle]]
    - [[agent-discipline-branch-state]]
    - [[agent-discipline-process-hygiene]]
    - [[agent-discipline-commit-hygiene]]
    - [[agent-discipline-adr-consult]]

# ── v5.124.0 consolidation: merged canonicals + retained generic patterns ──────
# The 3 generic merged canonicals (rca-diagnose, plan-audit, scope-and-plan, build-car)
# carry a ## Modes section documenting absorbed variants as dispatch args. Bodies are
# verbatim copies of the live wiki page (unwrapped form, starting at the DISPATCH line).
- pattern: rca-diagnose
  purpose: 'Root-cause a bug/regression/crash with evidence — diagnose ONLY, no fix. mode=regression (default) | prod-crash (off-prod controlled repro + mechanism-exclusion).'
  content: |-
    DISPATCH: model=opus (fallback=sonnet) — RCA needs reasoning over divergent evidence; sonnet only for shallow single-seam bugs — canonical: model-tier-dispatch

    ## Yadgar subagent contract
    Before substantive work: recall("<bug topic>") — surface anchors/prior findings. Observed state ALWAYS wins over recalled. Do NOT memorize directly; emit findings in report. END your final message with `## Yadgar findings` (one standalone durable fact per bullet, or "none").

    ## Standing hard rules (context resets — honor anyway)
    - NO terraform/tofu/tfp any mechanism. NO tf-local-plan container exec. Never directly query SurrealDB (MCP/HTTP only). Never run install_hooks against real HOME.
    - DIAGNOSE ONLY for this task: do NOT edit code, do NOT commit. Report root cause + proposed fix; main thread decides.
    - Default terse. Verify before claiming.

    ## Task — ROOT CAUSE ONLY (no fix)
    <one-paragraph symptom + shipped-version context>

    ### Hard evidence already gathered (verify if cheap, don't re-derive)
    <bullet list of the observed facts + what's already ruled out (queue-lag / DLQ / etc.)>
    If a `code_graph` memory block / `yadgar code-graph query` is available for this repo, check it — fan-in/hotspot data can shortcut which module to trace first.

    ### Your job
    1. Trace the exact code path (find entry point + the write/effect site + guards that could skip or throw before it). file:line the site where the expected effect WOULD happen.
    2. Reproduce with stderr VISIBLE — re-run the real command WITHOUT swallowing output; capture stdout+stderr+exit code. Compare state before/after via the authoritative read path.
    3. Isolate the branch: run the fallback/no-flag path too, to localize the regression to a specific branch vs the whole feature.
    4. Determine ROOT CAUSE (exception pre-effect / guard skipping the write / input-shape mismatch caller-vs-callee / …) backed by exact file:line + the observed error or code branch.

    ### Deliverable
    - Root cause with file:line + captured stderr/exit code.
    - Proposed minimal fix (what + where) AND any health-signal fix if the failure was masked (swallowed stderr / blanket exit 0).
    - Standalone hotfix vs fold into current train — recommend.
    - Do NOT implement. Report only. End with `## Yadgar findings`.

    ## Modes
    - `mode=regression` (DEFAULT): the steps above — trace, stderr-visible repro, branch-isolation, file:line root cause. For a bug/regression whose repro you can run directly.
    - `mode=prod-crash`: root-cause a production crash / hang / restart-loop OFF PROD — do NOT keep crashing the live system to study it. Adds:
      - Reproduce from the symptom first: the exact failure mode (crash-loop? hang? self-restart?) and WHAT changed when it started (which config/version flipped). The mechanism is usually the INTERACTION of a recent change with a PRE-EXISTING fragility, not the change alone.
      - Capture real evidence: a restarting process gets its logs wiped — build a minimal LOCAL repro (script/test exercising the real code path) that triggers the failure deterministically; capture the actual traceback / exit code / signal. CRITICAL distinction: a Python crash (traceback / SIGSEGV) vs an EXTERNAL kill (a healthcheck returning a designed error → orchestrator SIGKILLs) — totally different fixes. A clean exit-0 with no traceback points at an external killer, not a code crash.
      - Mechanism exclusion: enumerate candidate mechanisms; for EACH, PROVE or EXCLUDE it against the code (cite file:line) — do not stop at the first plausible one. A theory that matches the symptom but is excluded by the code is WRONG (e.g. "thread-safety race" excluded because all clients are sync; "timeout leak" excluded because the configured timeout exceeds the operation; "saturation" excluded because the grace never trips at prod knobs).
      - State the single proximate trigger + the load-bearing ROOT flaw (often a latent fragility the change EXPOSED, not created). Flag any step modeled with a STUB vs proven against the real system — don't overclaim.
      - Name WHY the original tests missed it (e.g. a synthetic stand-in that never exercised the real dependency/load pattern), and call `advisor` on the root-cause hypothesis before committing to it.

    ## Composes
    - [[agent-discipline-adr-consult]]
- pattern: plan-audit
  purpose: 'Adversarially audit an implementation plan BEFORE building — verify load-bearing claims against actual code, try to break it, verdict build/build-with-changes/don''t-build. writeback=false (default, report only) | true (append ## AUDIT + set AUDITED status in the plan file).'
  content: |-
    DISPATCH: model=fable (fallback=opus) — adversarial audit is peak $/insight leverage; opus if the audit must re-grep the tree to verify paths — canonical: model-tier-dispatch

    You are an INDEPENDENT skeptic. The plan may be wrong; its prose is not evidence. Your job: verify every LOAD-BEARING claim against the actual code (cite file:line), try to BREAK the design, and gate the build.

    Read the plan fully + its risk list. For each foundation claim the design rests on, VERIFY against source — trace the real code path, do NOT trust the plan's framing (it has been wrong before: an "all-remote" claim turned out runtime-conditional on an env var; a feared "1-connection singleton" was actually default-100). Mark each claim VERIFIED / CRACKED / UNCERTAIN with file:line. Verify cited LOC figures with wc -l / grep — do not trust the plan's numbers.

    Hunt specifically for:
    - A fix that introduces a NEW failure mode worse than the status quo — especially trading a LOUD, monitored failure for a SILENT one the existing safety net can't catch. That is a hard gate, not a footnote.
    - Shared mutable state the plan missed (grep: module-level dicts, lru_caches, breakers, counters) and over-scoped (things that are actually single-thread-only).
    - Concurrency hazards: loop-affine primitives touched off-loop, cancellation that leaks resources (a wedged uncancellable worker), a downstream bottleneck the change amplifies into a storm.
    - Version math: if an in-flight train (open PR) bumps versions, this plan must sequence AFTER it — flag hardcoded version numbers that collide.
    - Test adequacy: would the mandated test ACTUALLY fail before + pass after, and catch the SUBTLE failure mode (not just the obvious one)? Or is it mock theater that passes while prod breaks?

    Verdict: a per-claim table (claim → VERIFIED / STALE / WRONG / CRACKED + evidence at file:line), a RANKED must-fix-before-build list, and a bottom line — BUILD AS-IS / BUILD WITH CHANGES (list) / DO-NOT-BUILD (foundation crack). Be brutal: a passed audit you don't believe is worse than none.

    ## Recall hint
    Recall the plan's domain + any prior RCA/audit on the same subsystem before starting.

    ## Modes
    - `writeback=false` (DEFAULT): report-only. Return the verdict table + must-fix list + bottom line in your final message. Do NOT edit the plan file.
    - `writeback=true`: audit a DRAFT plan IN PLACE. Append a `## AUDIT (<date>)` section to the plan file: the verification table + corrections + a Status line (`AUDITED — ready` / `AUDITED — needs rework`) + explicit user-decision items. Preserve the original plan content (do NOT rewrite it). NO code changes. Contract: recall the plan topic first; observed state ALWAYS wins over plan text; do NOT memorize(). Report (≤6 bullets): Status verdict; STALE/WRONG count; biggest blocker; sequencing/dependency notes; user-decision items. Then `## Yadgar findings`.
- pattern: scope-and-plan
  purpose: 'Investigate current code/state then WRITE a design plan doc (no implementation). Modes: commit=false|true, advisor=N, measure_first=false|true, domain=generic|perf-lever.'
  content: |-
    DISPATCH: model=opus (needs code exploration THEN design synthesis; fable only if a curated single-fresh-read brief already exists — this shape usually does not) — canonical: model-tier-dispatch

    ## Yadgar subagent contract
    recall("<topic + subsystems>") first. Observed code/state ALWAYS wins over recalled/coordinator claims — verify against real code, cite file:line. Do NOT memorize directly; emit findings in report. END with `## Yadgar findings`.

    ## Standing hard rules (context resets)
    - NO terraform. Never query SurrealDB directly (MCP/HTTP only). Do NOT run install_hooks against real HOME.
    - INVESTIGATE + PLAN ONLY — no implementation, no code edits except writing ONE plan doc.
    - Default terse.

    ## Task: scope + write a design PLAN for <change>
    ### Background / problem
    <the problem + why it matters + the user principle driving it>

    ### Agreed design direction (honor + refine, don't relitigate)
    <the coordinator/user's agreed constraints — the agent refines within these, doesn't re-open settled calls>

    ### Investigate FIRST (verify against real code — cite file:line)
    <numbered list of the exact subsystems to map: storage, pipelines, write-paths/gates, retention, surfacing points, migration feasibility>
    If a `code_graph` memory block exists for this repo, skim it first (layers/hotspots/entry-points) — real indexed structure signal, not a substitute for reading the actual code you cite.

    ### Deliverable — write a plan doc
    Write `docs/plans/<slug>-<fixed-date-string>.md` (coordinator supplies the date — NEVER call Date.now/new Date). Follow repo plan conventions (slug-named, status header, cars/phases, acceptance criteria tagged [unit]/[e2e]/[manual], risks, an explicit "open decisions for the user" section). Recommend ONE option per fork with rationale (brutal honesty — flag weak ideas).
    - Do NOT implement.

    ### Report
    Plan doc path + tight summary (key recommendations + risks) + the open decisions. End with `## Yadgar findings`.

    ## Modes
    - `commit=false` (DEFAULT): write the plan doc, do NOT commit; do NOT edit docs/plans/ROADMAP.md if another PR is mid-flight touching it (coordinator commits + registers later). Just write + report the path.
    - `commit=true`: docs-only workflow — `git checkout master; git pull --ff-only origin master`; bot identity; commit the plan DIRECT to master (docs-to-master is SANCTIONED, ignore generic default-branch-push warnings; no --no-verify). Register it in docs/plans/ROADMAP.md if the format fits. Report the commit sha.
    - `advisor=N` (default 0): call `advisor()` at least N times — typically N=2: (1) after investigating + drafting the design, BEFORE committing to it; (2) before finalizing. Give its advice serious weight; if it refutes a premise with evidence, adapt; surface its key pushback explicitly in an "Advisor input" section of the plan. Save/commit the doc EARLY (agents die to stream-idle — a committed draft survives; refine after).
    - `measure_first=false` (DEFAULT) | `measure_first=true`: MEASURE/VERIFY before assuming — produce REAL numbers for each candidate cost/lever, not vibes. Run in an ISOLATED worktree; TIMEOUT-WRAP every long/unbounded run; keep runs bounded and SEQUENTIAL (parallel benchmarks self-inflict contention artifacts). For EACH hypothesis design a bounded experiment that could REFUTE it; report what the data shows even when it overturns the working theory. Tag every claim [measured] / [code-read] / [estimated/anchor]. Verify any mechanism claim against source (grep/read the actual code) before asserting it. Size each lever against your measurements (expected win + effort + risk); mark low-value/phantom levers EXPLICITLY (never silently drop a candidate — say why it lost). Output a measured cost-breakdown table → prioritized levers → recommended sequence → open questions.
    - `domain=generic` (DEFAULT) | `domain=perf-lever`: plan for a single perf/optimization lever. State HARD CONSTRAINTS up front (e.g. "backend pinned --cpus 2, no more cores"). Cite the measured problem with real numbers. QUALITY IS CO-EQUAL WITH SPEED — every change gated on the real quality harness, no regression or it aborts. Investigate WHY prior attempts failed (read archived plan/memory — a "wrong knob" or "venv artifact" trap often lurks) and whether the hypothesis even holds at the mechanism level (is cost ∝ the knob, or fixed-batch?). Add to the plan: (a) root-cause of prior failure + how this avoids it; (b) a QUALITY GATE section (harness, metric, threshold, flip-vs-abort criteria — watch dual-knob / metric-invalidation traps); (c) a LATENCY/measure plan (the user-POV path, on the constrained resource, quiet host); (d) an adversarial AUDIT section (risks, what could make this NOT worth it, is the hypothesis even true, cheap-config rollback?, go/no-go). If the lever is infeasible / a no-op / a likely quality-loss, SAY SO with evidence and propose alternatives.

    ## Composes
    - [[agent-discipline-adr-consult]]
- pattern: build-car
  purpose: 'Build one train car TDD in an isolated worktree — targeted-then-final test discipline. plan_spec=<docs/plans path> for spec-driven (implement the AUDITED plan exactly); else goal-driven.'
  content: |-
    DISPATCH: model=opus for multi-seam/parser/logic cars; sonnet for mechanical single-file cars — canonical: model-tier-dispatch

    ## Yadgar contract
    recall("<car topic + subsystems>") first. Observed code ALWAYS wins over plan/recall — verify every cited path/line before editing. Do NOT memorize directly; report findings. END with `## Yadgar findings`.
    Also check for a `code_graph` memory block for this repo (`block_get(name="code_graph", directory=<repo>)`) if present — a per-dir digest of layers/hotspots/endpoints, useful before cold-grepping the target subsystem.

    ## WORK LOCATION
    `cd <worktree-path>` — branch <car/branch> off master <sha>. Verify `git branch --show-current` = the car branch and clean status. ALL edits + commits here (never the main worktree). Worktree isolation lets cars build in parallel without collision.

    ## Standing hard rules (context resets — honor verbatim)
    - NO terraform. Never query SurrealDB directly. NEVER run install_hooks against real HOME (patch HOME to tmp in tests).
    - NEVER --no-verify/--no-gpg-sign/SKIP= any hook. NO Co-Authored-By. NO version bump (the integration step bumps the train version — flag if your car touches backend/** so integration bumps backend too). Commit early+often (a transient API death wipes uncommitted work). venv on PATH for commits: `PATH="<repo>/.venv/bin:$PATH" git commit` (import-linter is language:system; "lint-imports not found" = a PATH issue, NOT a violation).
    - ruff-format py3.14 rewrites `except (A,B):` tuples → AST hooks reject; use a single base or a named `_ERR=(A,B)` constant.

    ## TDD + TEST-RUN DISCIPLINE (critical for wall-clock)
    - Red → green: write the failing test FIRST, confirm red, implement to green. Refactor with tests green.
    - Between iterations, run ONLY the targeted tests for the change you just made (fast — seconds).
    - Run the FULL relevant suite + `make e2e` ONCE at the very end, before reporting — NOT after every fix. Re-running the whole suite + e2e each iteration wastes wall-clock for zero added safety (the final full pass is the authoritative gate).
    - The final broad pass MUST cover ALL call-sites of anything whose SIGNATURE or a shared PATH you changed — grep repo-wide and include every dir that references it (signature/path changes break assert-sites in untouched dirs — a repeated real failure).
    - Full-round-trip / deploy-gated criteria that can't be unit-tested are documented as [manual], not faked.
    - Loop until clean; surface pre-existing flakes, don't silence them. Same fix fails 2× → STOP + report.
    - Do NOT push. Do NOT open a PR (the train integrates + bumps + PRs once). Do NOT touch plan archival (the main thread archives at integration).

    ## TASK
    <the specific car spec — what to build, the exact fix, acceptance criteria>

    ## Report
    Commit hashes, what changed (files/functions), test evidence (targeted red→green + the ONE final full-suite result), backend-bump-needed flag, anything integration must know. End with `## Yadgar findings`.

    ## Modes
    - goal-driven (DEFAULT): the TASK block above is the spec — build to the stated acceptance criteria.
    - `plan_spec=<docs/plans/<car>.md>`: spec-driven. Read that plan file IN FULL — the reworked body above any `## AUDIT` section is the AUDITED-ready spec; implement exactly that (write the plan's failing acceptance tests FIRST). Observed state ALWAYS wins over plan text — if the tree contradicts the plan, follow the tree + note the drift. Plan lifecycle per [[agent-discipline-plan-lifecycle]] on partial vs completing scope (the main thread handles archival at integration).

    ## Composes
    - [[agent-discipline-adr-consult]]
- pattern: drift-audit
  purpose: 'Detect drift/garbage/gaps between a source-of-truth and the artifacts that should mirror it — find divergence on purpose. mode=plan-corpus classifies plan-corpus files shipped vs remaining.'
  content: |-
    DISPATCH: model=sonnet (fallback=opus if drift classification is judgment-heavy; haiku for mode=plan-corpus) — canonical: model-tier-dispatch

    Name the SOURCE OF TRUTH (the authoritative definition — e.g. the code: the Settings fields, the tool/function registry, the DB schema, the AST) and the DERIVED artifact(s) that must mirror it (a doc, FIELD_META, a capability registry, wiki pages, generated files).

    Enumerate BOTH sides COMPLETELY (do not sample) and diff by identity (name/key). Bucket every discrepancy:
    - PHANTOM — in the derived artifact but NOT in the source (documented-but-nonexistent, dead registry rows, orphans). Silently misleads — highest priority.
    - MISSING — in the source but absent from the derived artifact (undocumented knob, uncovered capability, un-described field).
    - STALE — in both, but the derived value disagrees with the source (wrong default, outdated description, drifted type/enum).
    - MALFORMED — structurally broken entries (corrupt / duplicated / double-wrapped / unparseable).

    Rules: the source of truth ALWAYS wins. NEVER invent a value to fill a MISSING gap — flag it, do not fabricate. Quantify every bucket: total-in-source / total-in-derived / phantom / missing / stale / malformed (a clean audit = all non-source buckets zero).

    Report a diff table: identity | bucket | source value (file:line) | derived value. Propose fixes but DO NOT apply unless asked. End by naming any OTHER derived artifact that mirrors the same source but was NOT checked — the next audit target.

    Prefer an INVARIANT over a re-run: if a source/derived pair can be diffed mechanically, the durable fix is a test/ratchet that fails on drift — flag that as the real remediation. This audit is the manual complement for pairs an invariant cannot express.

    ## Recall hint
    Recall the I25/I29/I32 invariants + prior drift findings (phantom config knobs, corrupt prompts) before starting.

    ## Modes
    - default: the source↔derived drift audit above.
    - `mode=plan-corpus`: classify plan-corpus files shipped vs remaining (task-list rebuild / pre-archive sweep). Read-only Explore agent. Input: plans directory path, current shipped versions, any in-flight branches whose plans count as PARTIAL-pending-merge. For each top-level plan file (exclude living docs like ROADMAP.md, exclude archive/ subdirs): (1) read header/first ~40 lines only, go deeper only when status unclear; (2) evidence priority: in-file status markers ("Status:", SHIPPED, checkboxes) → git log + CHANGELOG version markers → grep key feature names in codebase; (3) bucket SHIPPED (archive candidate) / PARTIAL (list remaining items, 1 line each) / OPEN / SUPERSEDED-RETIRED (name replacement). Output a compact table `file | BUCKET | evidence | remaining-if-partial`, then per-bucket counts + explicit SHIPPED list. Read-only, no moves/edits/git writes. End with `## Yadgar findings`.
- pattern: feasibility-design
  purpose: 'Verify a mechanism is buildable on the target platform (docs + existing precedent) BEFORE designing it — then design only what the platform actually supports.'
  content: |-
    DISPATCH: model=fable (fallback=opus) — pre-build feasibility shapes everything downstream — canonical: model-tier-dispatch

    Verify a mechanism is BUILDABLE on the target platform BEFORE designing it — then design only what the platform actually supports, not what you assume.

    FEASIBILITY first (cite the platform docs + existing-code precedent; do NOT assume):
    - Can the platform do the thing at all? Identify the exact API / hook / extension point that would carry it.
    - What's the EXACT capability + its LIMITS? Read the real docs + version notes (capabilities differ by version). Distinguish the IDEAL mechanism from the FALLBACK the platform actually allows.
    - Is there existing precedent in THIS codebase/setup doing something similar? Reuse its pattern.

    DESIGN second, gated on the feasibility:
    - Pick the STRONGEST mechanism the platform allows; design the fallback for if the ideal isn't supported.
    - Make it CHEAP at the point of action — no heavy/LLM call in a hot or blocking path (it gets disabled if it adds friction; cache, fast-path, fire only when warranted).
    - Loop-safety / idempotence: the mechanism must not re-trigger on the action it itself induced.
    - Scope + ship path: global vs local, and how it installs via the existing mechanism.

    Call `advisor` on the design. Deliver: the feasibility verdict (can-it / how, with citations), the concrete design (mechanism + fallback + anti-friction + loop-safety + ship path), and a build/no-build recommendation. Do NOT claim a capability exists without proving it.

    ## Recall hint
    Recall prior findings on the platform's extension points + any existing hooks/mechanisms in the codebase before starting.
- pattern: feature-kill-closeout
  purpose: 'Complete removal of a decision-killed feature: code+knobs+registries+tests+plans (archived in-PR per ADR-0081), zero residue'
  content: |-
    DISPATCH: model=sonnet — canonical: model-tier-dispatch

    ## Purpose
    Remove a decision-killed feature completely — code, knobs, registries, tests, plans — leaving zero residue. Used for: onnx CE backend (ADR-0067), recall-output cache (ADR-0071).

    ## Prompt (adapt bracketed parts)
    Isolated worktree off origin/master (other agents may hold the main checkout): `git worktree add /tmp/<name> -b chore/<feature>-closeout origin/master`.
    1. HUNT the feature surface by grep (feature terms + knob names): implementation branches, config knob (I25 three-way sync + I32 capability-registry are pre-commit ENFORCED — scrub Settings, config_registry.py, config_yaml, CAPABILITY_REGISTRY.md, configuration.md, env-only allowlist), metrics/instrumentation, tests OF the feature (delete those only — never neighboring tests). Distinguish look-alike features and preserve them (e.g. GTE onnx vs CE onnx). CAUTION from #174: shared modules may mix dead shadow code with LIVE invalidation/bump logic under misleading names — verify each removal candidate has no live consumers (bisect-grade care); rename-not-delete when the function does real work.
    2. ARCHIVE the feature's plan docs → docs/plans/archive/ IN THIS PR (ADR-0081: archival is part of done; lifecycle per [[agent-discipline-plan-lifecycle]]) — git mv + `> ARCHIVED <date> — <verdict, ADR-ref, this PR>` header; verify each file's own status doesn't contradict; flag instead of archive if it does.
    3. ROADMAP.md rows updated. MIGRATION_NOTES if a knob dies (state unknown-knob behavior — pydantic extra=ignore → silent).
    4. Version bump per convention if code removed (backend vs core by location; check_versions/check_backend_bump arbitrate; version pre-claim per [[agent-discipline-branch-state]]); docs-only → none.
    5. Gates before commit: ruff check+format + commit rules per [[agent-discipline-commit-hygiene]]; pytest-quiet wait per [[agent-discipline-process-hygiene]]; affected tests -n0.
    6. PR via codeberg API, verify body via GET. Kill your own monitors per [[agent-discipline-process-hygiene]]. Leave worktree for main thread.
    Report: surface found+removed (with live-vs-dead verdicts), archived/flagged plans, bump y/n, PR URL. End with ## Yadgar findings.

    ## Composes

    - [[agent-discipline-process-hygiene]]
    - [[agent-discipline-commit-hygiene]]
    - [[agent-discipline-plan-lifecycle]]
    - [[agent-discipline-branch-state]]
- pattern: dispatch-fix-test-migration
  purpose: 'Migrate tests broken by architecture changes without bending — v2 composes with plan-executing-build discipline'
  content: |-
    DISPATCH: model=sonnet — canonical: model-tier-dispatch

    # Pattern: dispatch-fix-test-migration (v2)

    Use when an architecture change (cutover/refactor) broke unit tests that assert OLD behavior, and the fix is proper MIGRATION not bending. Main thread MUST first diagnose per-test (delegate a read-only classifier) BEFORE dispatching edits — a blind "make tests pass" agent will hollow-pass or bend.

    ## COMPOSE WITH: agent-prompt-plan-executing-build
    Prepend that pattern's PLAN LIFECYCLE (ADR-0081/0082: first commit = plan archive-move if completing / header-update if partial; move-not-copy, git ls-files verify) and DISCIPLINE block (bracket pytest-wait, 5-site version sync, ADR-0078 DB stop-and-ask, ADR-0080 fetch-first, I13/I33 gates, zombie-monitor cleanup) to every dispatch built from this pattern.

    ## Contract (prepend to every dispatch)
    - Yadgar: `recall(<topic>, directory=<abs path>)` on entry; observed state wins; END with `## Yadgar findings`.
    - ⚠️ NO TEST BENDING (machine-enforced #52 guard). FORBIDDEN: delete/weaken assertions, change expected value to buggy output, add skips (skip-inventory gate rejects unsanctioned skips), hollow-pass.
    - Seam-migration is legitimate: when the architecture moved the behavior (e.g. write-phases to the drainer seam, ADR-0069), migrate the ASSERTION SEAM with rigor and cite the ADR — that is not bending.
    - A test that fails when un-skipped/un-gated was hiding a real break: fix properly or STOP-and-flag; never re-skip.
    - Diagnostic discipline: reproduce before editing; bisect against master before assuming the PR caused a CI failure (xdist reshuffling surfaces latent pollution in unrelated files); OOM signature (namespace-not-exist + ConnectError cascades) = environmental, rerun in quiet window (ADR-0079).
- pattern: mechanical-refactor-chunk-commit-early
  purpose: 'Big file-move/codemod refactor — ONE chunk per agent, commit before returning, so a stream-timeout can''t wipe work. Fill PLACEHOLDERS.'
  content: |-
    DISPATCH: model=sonnet — chunked mechanical codemod — canonical: model-tier-dispatch

    Caveman prose; code normal. TIGHT SCOPE — do ONLY <THIS CHUNK> then COMMIT. Do NOT do later chunks (<LIST>). A prior mega-agent doing everything at once timed out at ~75 tool calls with ZERO commits → all work lost + half-broken worktree. You do ONE chunk and COMMIT before returning. Entry per [[agent-discipline-recall-first]]: ONE `recall("<TOPIC>", directory="<REPO>")`.

    ⚠️ BEHAVIOR-NEUTRAL (git mv + import-path rewrites only). ⚠️ SHIM = sys.modules ALIAS (`sys.modules[__name__]=_m`) for leaf modules (write-through, patch-compatible) — NOT `__getattr__` (read-only, breaks test patch()); PACKAGES = `__init__` getattr shim (preserve `__path__`) + per-submodule `sys.modules` alias (aliasing the pkg object → `__path__` double-load → two instances → desync). ⚠️ REPOINT path-keyed guards proactively (they silently vacuously-pass against shim files: complexity baseline/allowlist, observe-allowlist, ruff per-file-ignores, capability-coverage, metric-writers, three-way-sync globs). ⚠️ import-linter catches FUNCTION-LOCAL imports (AST) — func-local does NOT hide the edge. ⚠️ SAFETY: import-smoke + targeted only (final CI is the gate) — per [[agent-discipline-process-hygiene]]. Commit rules per [[agent-discipline-commit-hygiene]]. WORK IN worktree `<PATH>` — branch `<BRANCH>` @ <SHA>. Confirm branch+HEAD. STACK a commit. Do NOT push. guards WITHOUT cd out of the worktree.

    CHUNK (this dispatch only): <WHAT MOVES / WHAT CODEMODS>. Method: `git mv` + codemod (sed/libcst), isolate mechanical diff from logic.

    VERIFY (light — next chunks do the rest): broad import-smoke (`python -c "import <new+old paths>"` → NO ImportError/cycle/double-load; for aliases assert `new is old` identity + write-through). Do NOT run the full suite.

    COMMIT immediately ("<clear chunk msg>") before returning. If a circular import/double-load the shim pattern can't fix appears → STOP + report (don't hack).

    REPORT: what moved/rewrote (+ skipped/ambiguous), shim mechanism per module/package, import-smoke result (cycle/double-load check), guards repointed, commit sha, + what's LEFT for the next chunks.

    ## Yadgar findings
    - (facts or "none")

    ## Composes

    - [[agent-discipline-recall-first]]
    - [[agent-discipline-process-hygiene]]
    - [[agent-discipline-commit-hygiene]]
- pattern: stacked-car-parallel-build
  purpose: 'Parallel car N+1 on a stacked branch off the train branch — disjoint seams, no train pushes, main thread rebases in (ADR-0088)'
  content: |-
    DISPATCH: model=sonnet — seams pre-cut by the plan — canonical: model-tier-dispatch

    ## Purpose
    Dispatch shape for building train car N+1 IN PARALLEL with car N when their file seams are disjoint (ADR-0088 one-PR trains). Car N owns the train branch; car N+1 builds on a STACKED branch and is rebased in by the main thread.

    ## Prompt block (adapt bracketed parts)
    You are in an isolated worktree. Base yourself on the TRAIN branch: `git fetch origin && git checkout -b [car-branch] origin/[train-branch]`. Car [N] is being built in parallel ON the train branch by another agent — you MUST NOT touch [car N's seam, e.g. root conftest] and MUST NOT push to the train branch. Push ONLY your own branch; the main thread rebases it onto the train branch after car [N] lands and re-validates any order-dependent final commit. NO PR (one train PR exists: #[PR]). NO version bump (train's claimed version stands).

    Plan lifecycle per [[agent-discipline-plan-lifecycle]]: your car COMPLETES the plan → archive-first commit; otherwise first commit updates the plan Status header.

    Order-dependent commits (e.g. a gate flip) go LAST and get re-validated after the rebase.

    Discipline: TDD where testable; process + commit rules per [[agent-discipline-process-hygiene]] and [[agent-discipline-commit-hygiene]].

    Final report: per-item commit hashes, before/after metrics for your car's goal, push confirmation, and any cross-car collision you noticed.

    ## Main-thread follow-up (not the agent's job)
    After car N lands: `git rebase origin/[train-branch]` in the stacked worktree → re-run the order-dependent validation → `git merge --ff-only` on the train branch → push. Expect version-file conflicts if master moved; the train's claimed version wins.

    ## Composes

    - [[agent-discipline-process-hygiene]]
    - [[agent-discipline-commit-hygiene]]
    - [[agent-discipline-plan-lifecycle]]

# disciplines: cross-cutting rule pages (Stage 2 extraction, 2026-07-10). Seeded as
# wiki pages agent-discipline-<name> (create-if-absent, same genesis mechanism as the
# contract). Pattern pages REFERENCE these via [[slug]] under a ## Composes section;
# the prelude (Stage 3) resolves the references and assembles contract + disciplines +
# pattern within the budget. Bodies are injected into preludes — keep them TIGHT.
disciplines:
- name: recall-first
  purpose: 'Recall-first entry, observed-state-wins, findings-footer reporting (contract-covered).'
  content: |-
    On entry: ONE bounded `recall("<task topic>", directory=<repo>)` — targeted, don't burst MCP.
    Observed state ALWAYS wins over recalled/assumed state — when code contradicts memory, believe the code.
    Do NOT call memorize() — emit findings in your report instead.
    REQUIRED: final message ends with a `## Yadgar findings` section (facts/insights, or "none").
- name: process-hygiene
  purpose: 'Background-process hygiene: pytest gate bracket form, monitor cleanup, long push timeout.'
  content: |-
    pytest-wait gate ONLY as a SEPARATE command or script file, GENERIC bracket form:
    `until ! pgrep -f "python -m [p]ytest" >/dev/null; do sleep 15; done`.
    NEVER embed gate+pytest in one background command string — the string self-matches the
    pattern and deadlocks (5 incidents); script-file invocation avoids it.
    Check pgrep BEFORE launching a suite; NEVER start a second run. `-n 4` max; targeted tests, no full sweeps.
    Don't park on a dead monitor — on wake, verify box state (did the prior run finish? exit marker?) before re-arming; never relaunch blindly.
    Kill your own monitors/background wait-shells BEFORE the final report (zombie notification loops).
    Push with a LONG timeout (pre-push e2e ~8min).
- name: branch-state
  purpose: 'The 3 branch-state checks before any feature-branch edit + the version pre-claim rule.'
  content: |-
    Before ANY edit on a feature branch, run all three:
    1. `gh pr list --head <branch> --state all` — MERGED → STOP, branch fresh off latest default; CLOSED → confirm first; OPEN/none → continue.
    2. `git ls-remote --exit-code --heads origin <branch>` — deleted upstream → STOP, branch fresh.
    3. `git fetch origin --prune && git rev-list --count <branch>..origin/<default>` — behind → rebase; large divergence → branch fresh.
    Version pre-claim: parallel branches claim DISTINCT next version numbers via the coordinator; a rebase keeps your claim (ADR-0080: version checkers are branch-level vs origin/master — git fetch first).
- name: plan-lifecycle
  purpose: 'ADR-0081/0082 plan lifecycle: archive move-not-copy on completion, status header on partial scope.'
  content: |-
    ADR-0081/0082. Branch COMPLETES a docs/plans/ plan → FIRST commit is
    `git mv docs/plans/<plan>.md docs/plans/archive/` + prepend header
    `> ARCHIVED <date> — executing on <branch>, ships with this PR`.
    A MOVE, not a copy: after the commit `git ls-files docs/plans/<plan>.md` MUST be empty
    (incident 2026-07-09: header-edit-in-place + copy left duplicates in the PR).
    PARTIAL scope (car N of M) → first commit updates the plan's Status header in place; the train's FINAL car does the archive-first commit.
    A merge conflict on the plan file during rebase = the plan changed under you: STOP and re-read it before continuing.
- name: commit-hygiene
  purpose: 'Commit-gate discipline: no hook bypass, no co-author trailers, venv on PATH, explicit adds.'
  content: |-
    NEVER --no-verify / --no-gpg-sign — hook failure = signal, fix the root cause. No Co-Authored-By trailers. Bot identity on codeberg.
    Commit with the worktree venv on PATH (`PATH=<worktree>/.venv/bin:$PATH git commit` — lint-imports is language:system).
    `git add` explicit paths only (never -A); no staged file >2MB.
    Pre-commit gotchas: py314 except-tuple parens; I13 caps (nesting ≤4, cyclomatic ≤15, params ≤8); I33 observe-coverage (`@observe(span=False)` for hot-loop/per-item helpers, ADR-0074).
- name: adr-consult
  purpose: 'Read-side ADR discipline: consult binding ADR decisions before planning/building/debugging a subsystem.'
  content: |-
    Before planning / building / debugging a subsystem: consult the ADRs for the touched area —
    `recall(type="wiki", tags=["adr"])` for semantic decisions + `adr_list(status="open")` for open ones.
    Observed ADR decisions BIND: a shipped ADR is a constraint, not a suggestion — do NOT re-litigate or contradict it; if the work requires reversing one, record a SUPERSEDING ADR (adr_add) rather than silently diverging.
    Uses the DEFAULT recall profile — it fans out to the wiki arm, unlike the fast-profile per-turn auto-recall hook (which is memory-only, ADR-0077, so ADR pages do NOT auto-surface each turn). This read is the deliberate counter to that gap.
    Direct fetch by id: `adr_get(directory, adr_id)`. ADRs are recall-native canonical pages (`<project>-adr-NNNN`) — readable from any branch.
