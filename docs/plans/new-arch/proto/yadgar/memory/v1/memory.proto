syntax = "proto3";

package yadgar.memory.v1;

import "yadgar/common/v1/common.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

message Memory {
  yadgar.common.v1.Meta meta = 1;

  string content = 16;
  repeated string tags = 17;

  // Optional real file path, used only for staleness detection.
  optional string source_path = 18;

  // Which agent produced this. Distinct from created_by, which is the human.
  optional string provenance_agent = 19;

  // Heat / plasticity / stability. Mutated by the thermodynamics module through
  // compare-and-set like any other writer (D8).
  double heat = 20;
  double stability = 21;

  bool is_anchor = 22;
  optional google.protobuf.Timestamp valid_until = 23;
}

message CreateMemoryRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  Memory memory = 3;  // meta.id, version, timestamps ignored on input
}
message CreateMemoryResponse { Memory memory = 1; }

message UpdateMemoryRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  // Mismatch returns FAILED_PRECONDITION; the caller re-reads, recomputes, and
  // retries. Recomputation must be idempotent.
  uint64 expect_version = 4;
  Memory memory = 5;
  google.protobuf.FieldMask update_mask = 6;
}
message UpdateMemoryResponse { Memory memory = 1; }

message GetMemoryRequest { yadgar.common.v1.Scope scope = 1; string id = 2; }
message GetMemoryResponse { Memory memory = 1; }

message BatchGetMemoriesRequest {
  yadgar.common.v1.Scope scope = 1;
  repeated string ids = 2;
}
message BatchGetMemoriesResponse { repeated Memory memories = 1; }

// One verb. Owner-only, soft (D26). No unshare, no remove-from-view, no erase.
message DeleteMemoryRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
}
message DeleteMemoryResponse {}

// Coarse, domain-shaped, one call per business operation and per transaction
// (D5). No generic query, no exposed begin/commit.
service MemoryDbService {
  rpc CreateMemory(CreateMemoryRequest) returns (CreateMemoryResponse);
  rpc UpdateMemory(UpdateMemoryRequest) returns (UpdateMemoryResponse);
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);
  // Batch reads exist so a fanout never becomes an N+1 across the network.
  rpc BatchGetMemories(BatchGetMemoriesRequest) returns (BatchGetMemoriesResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
}
