syntax = "proto3";

package yadgar.adr.v1;

import "yadgar/common/v1/common.proto";
import "google/protobuf/field_mask.proto";

enum AdrStatus {
  ADR_STATUS_UNSPECIFIED = 0;
  ADR_STATUS_PROPOSED    = 1;
  ADR_STATUS_ACCEPTED    = 2;
  ADR_STATUS_SUPERSEDED  = 3;
  ADR_STATUS_REJECTED    = 4;
}

message Adr {
  yadgar.common.v1.Meta meta = 1;

  // The semantic reference. "ADR-0466" is how a human and an agent name this
  // record, so it is a real field rather than a rendering of the URN. Allocated
  // by this module's own sequence; nothing outside adr-db allocates it.
  uint32 number = 16;

  string title = 17;
  AdrStatus status = 18;

  // A decision states the RULE, not the work that produced it.
  string decision = 19;
  string context = 20;
  string consequences = 21;
  repeated string alternatives_rejected = 22;

  // URNs of ADRs this one supersedes.
  repeated string supersedes = 23;
}

message CreateAdrRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  Adr adr = 3;  // number assigned by the service
}
message CreateAdrResponse { Adr adr = 1; }

message UpdateAdrRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
  Adr adr = 5;
  google.protobuf.FieldMask update_mask = 6;
}
message UpdateAdrResponse { Adr adr = 1; }

message GetAdrRequest {
  yadgar.common.v1.Scope scope = 1;
  oneof key {
    string id = 2;
    uint32 number = 3;
  }
}
message GetAdrResponse { Adr adr = 1; }

message ListAdrsRequest {
  yadgar.common.v1.Scope scope = 1;
  optional AdrStatus status = 2;
  int32 page_size = 3;
  string page_token = 4;
}
message ListAdrsResponse {
  repeated Adr adrs = 1;
  string next_page_token = 2;
}

message DeleteAdrRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
}
message DeleteAdrResponse {}

// No Search rpc and no RetrievalProvider: ADRs are addressed, not ranked.
// Excluding them from recall is expressed by this service not implementing the
// provider contract, rather than by a policy registry (D10).
service AdrDbService {
  rpc CreateAdr(CreateAdrRequest) returns (CreateAdrResponse);
  rpc UpdateAdr(UpdateAdrRequest) returns (UpdateAdrResponse);
  rpc GetAdr(GetAdrRequest) returns (GetAdrResponse);
  rpc ListAdrs(ListAdrsRequest) returns (ListAdrsResponse);
  rpc DeleteAdr(DeleteAdrRequest) returns (DeleteAdrResponse);
}
