syntax = "proto3";

package yadgar.task.v1;

import "yadgar/common/v1/common.proto";
import "google/protobuf/field_mask.proto";

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_OPEN        = 1;
  TASK_STATUS_IN_PROGRESS = 2;
  TASK_STATUS_BLOCKED     = 3;
  TASK_STATUS_DONE        = 4;
  TASK_STATUS_DROPPED     = 5;
}

message Task {
  yadgar.common.v1.Meta meta = 1;

  // Semantic reference, same rationale as Adr.number.
  uint32 number = 16;

  string title = 17;
  string body = 18;
  TaskStatus status = 19;
  repeated string tags = 20;

  // URNs — an ADR, a wiki page, a parent task.
  repeated string links = 21;
}

message CreateTaskRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  Task task = 3;
}
message CreateTaskResponse { Task task = 1; }

message UpdateTaskRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
  Task task = 5;
  google.protobuf.FieldMask update_mask = 6;
}
message UpdateTaskResponse { Task task = 1; }

message GetTaskRequest {
  yadgar.common.v1.Scope scope = 1;
  oneof key {
    string id = 2;
    uint32 number = 3;
  }
}
message GetTaskResponse { Task task = 1; }

message ListTasksRequest {
  yadgar.common.v1.Scope scope = 1;
  repeated TaskStatus statuses = 2;
  int32 page_size = 3;
  string page_token = 4;
}
message ListTasksResponse {
  repeated Task tasks = 1;
  string next_page_token = 2;
}

message DeleteTaskRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
}
message DeleteTaskResponse {}

service TaskDbService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
}
