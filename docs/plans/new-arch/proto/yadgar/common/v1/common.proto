// Shared envelope and scope types. Every module imports this and nothing else
// from outside its own package.
//
// Field numbers 1-15 encode in one byte, so the envelope fields that appear on
// every row are kept inside that range. 13-15 are reserved for envelope growth;
// entity-specific fields start at 16.
syntax = "proto3";

package yadgar.common.v1;

import "google/protobuf/timestamp.proto";

// Ordered ladder, most restrictive first (D12).
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;  // never persisted; rejected at validation
  VISIBILITY_PRIVATE     = 1;  // owner_user_id only
  VISIBILITY_TEAM        = 2;  // members of team_id
  VISIBILITY_ORG         = 3;  // everyone in the installation
}

// Carried by every user-facing entity (D8, D9, D12, D26).
message Meta {
  // URN, e.g. "yadgar:memory:01J8ZK7C4M9QX2VBNE5RTYH3PD".
  // Assigned by the owning -db service; never supplied by a client.
  string id = 1;

  // Compare-and-set counter (D8). Incremented by the -db service on every
  // successful update. A write whose expect_version does not match is rejected
  // with FAILED_PRECONDITION.
  uint64 version = 2;

  // Repo/project scope, e.g. "m-agahi/yadgar".
  string project_id = 3;

  // Who PRIVATE means, and the only user permitted to delete (D26).
  string owner_user_id = 4;

  // Meaningful only when visibility == VISIBILITY_TEAM. A user may belong to
  // several teams, so this names which one. ORG needs no identifier: one
  // deployment is one organisation (D27).
  string team_id = 5;

  Visibility visibility = 6;

  // Authorship, deliberately distinct from ownership. A record edited by
  // another member keeps its owner and changes updated_by; under D8's
  // multi-writer CAS this is what makes a version conflict diagnosable.
  string created_by = 7;
  string updated_by = 8;

  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;

  // Soft-delete tombstone (D26). Absent means live. Physical removal is an
  // administrative action, never a request-path operation.
  optional google.protobuf.Timestamp deleted_at = 11;

  // URNs this entity was synthesised from — set by the curator, consolidation,
  // or an LLM path, never by an agent. Empty for directly authored records.
  // Lineage cannot be reconstructed after the fact, which is why it is recorded
  // unconditionally (D26).
  repeated string derived_from = 12;

  reserved 13 to 15;  // envelope growth
}

// Caller identity and reach, attested by the gateway from the request's
// credentials. Never supplied by the caller itself.
message Scope {
  string user_id = 1;
  string project_id = 2;
  // Every team the caller belongs to. A -db service filters
  // visibility == TEAM against this list.
  repeated string team_ids = 3;
}

// Applied to every mutating RPC (D9). The same key replayed returns the
// original outcome rather than performing the write twice; required because a
// retrying load balancer will deliver a write more than once.
message Idempotency {
  string key = 1;
}
