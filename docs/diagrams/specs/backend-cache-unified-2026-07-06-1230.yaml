# Backend Caching Train — UNIFIED backend Cache class (structural view) — 2026-07-06.
#
# PROPOSED design (not built). Source of truth: docs/plans/backend-caching-train-2026-07-06.md.
# Companion flow view: backend-cache-in-pipeline-2026-07-06-1230.yaml (same 5 namespaces,
# there shown receiving the recall-pipeline hookpoint arrows).
#
# WHAT THIS SHOWS — one unified backend `Cache` class (yadgar/backend/cache.py),
# same shape as core yadgar/cache.py: one class, N named instances via a _REGISTRY,
# invalidation policy bound at CONSTRUCTION (ModelCkpt | DataEpoch | TTL | Manual).
# FIVE namespaces live in the ONE registry (drawn as one cluster = one class):
#
#   ce          MOVE-IN existing _ce_cache (embed_service.py:224) + WIRE recall CE
#   embed       MOVE-IN existing _embed_cache (embed_service.py:223)
#   memory_doc  NEW — build_results id→doc (fusion.py:316)
#   engram_slot NEW — engram_links slot→ids (engram.py:128)
#   graph       NEW — spreading+ppr entity→neighbours (knowledge_graph.py:455, core.py:125)
#
# INVALIDATION SPLIT (the KEY distinction, carried in labels + legend since the
# generator has no per-node border style — every type:cache node is dashed green):
#   * ModelCkpt-keyed (ce, embed): ckpt_sha already in key → model swap busts. No
#     cross-service signal needed. These are the MOVED-IN, model-stable caches.
#   * DataEpoch-keyed (memory_doc, engram_slot, graph): key embeds a global
#     `data_epoch`. CORE bumps it on memorize/forget/entity/relationship writes
#     (already runs _recall_shadow.bump_epoch) and PASSES it to the backend on each
#     recall request (cheap header/int, not a round-trip). Stale keys naturally miss
#     — epoch-in-key, no explicit cross-service bust call. This core→backend
#     data_epoch arrow is drawn async (green dashed).
#
# LEGEND cluster spells out MOVED-IN vs NEW and the two invalidation classes.

title: "Backend caching train — UNIFIED backend Cache class + 5 namespaces (PROPOSED, 2026-07-06)"
subtitle: "one Cache class (yadgar/backend/cache.py) · _REGISTRY of 5 · ce/embed=ModelCkpt (MOVED-IN) · memory_doc/engram_slot/graph=DataEpoch (NEW) fed by cross-service data_epoch from CORE"
rankdir: LR
show_total: false

clusters:
  - {id: core,     label: "Core (--cpus 1) — owns the data_epoch bus (_recall_shadow.bump_epoch)", kind: core}
  - {id: backend,  label: "Backend (--cpus 2) — UNIFIED Cache class (yadgar/backend/cache.py): ONE class, _REGISTRY of N named instances, policy bound at construction", kind: backend}
  - {id: legend,   label: "Legend", kind: external}

nodes:
  # ---- core: the write events + the data_epoch signal ----
  - {id: writes,   label: "CORE writes\\nmemorize / forget / entity / relationship\\n_recall_shadow.bump_epoch → global data_epoch++", cluster: core, type: compute}
  - {id: recallreq,label: "recall request → backend\\ncarries data_epoch (cheap header/int)\\nembedded into DataEpoch-keyed namespace keys", cluster: core, type: gate}

  # ---- backend: the ONE Cache class = 5 namespaces in the registry ----
  # Model-stable (MOVED-IN) namespaces:
  - {id: ns_ce,    label: "[MOVED-IN] namespace: ce\\nkey = query_sha:text_sha:ckpt_sha\\nval = CE score · invalidation = ModelCkpt\\nMOVE _ce_cache (embed_service.py:224) + WIRE recall CE path (#41)", cluster: backend, type: cache}
  - {id: ns_embed, label: "[MOVED-IN] namespace: embed\\nkey = text_sha:ckpt_sha\\nval = vector · invalidation = ModelCkpt\\nMOVE _embed_cache (embed_service.py:223)", cluster: backend, type: cache}
  # Data-stable (NEW) namespaces:
  - {id: ns_mdoc,  label: "[NEW] namespace: memory_doc\\nkey = memory_id:data_epoch\\nval = full doc dict · invalidation = DataEpoch\\nbuild_results (fusion.py:316) · content-immutable → ~bust-free\\nest. shave 150-200 ms", cluster: backend, type: cache}
  - {id: ns_slot,  label: "[NEW] namespace: engram_slot\\nkey = slot_index:data_epoch\\nval = [memory_id,…] · invalidation = DataEpoch\\nengram_links (engram.py:128)\\nest. shave 100-150 ms", cluster: backend, type: cache}
  - {id: ns_graph, label: "[NEW] namespace: graph\\nkey = entity_id:data_epoch\\nval = [neighbour,…] · invalidation = DataEpoch\\nspreading+ppr (knowledge_graph.py:455, core.py:125)\\nest. shave 300-400 ms", cluster: backend, type: cache}

  # ---- legend ----
  - {id: leg_moved, label: "[MOVED-IN] ce, embed\\nexisting backend LRU folded into the Cache class\\nbehaviour-neutral (same keys, same values)", cluster: legend, type: cache}
  - {id: leg_new,   label: "[NEW] memory_doc, engram_slot, graph\\nquery-independent stable-data caches (cross-query)", cluster: legend, type: cache}
  - {id: leg_ckpt,  label: "ModelCkpt invalidation\\nckpt_sha in key → model swap busts\\n(no cross-service signal)", cluster: legend, type: compute}
  - {id: leg_epoch, label: "DataEpoch invalidation\\ndata_epoch in key → CORE write bumps → stale keys miss\\n(cross-service signal, async dashed)", cluster: legend, type: gate}

edges:
  # core write bus feeds the data_epoch into the recall request
  - {src: writes,    dst: recallreq, type: async, label: "data_epoch++ (on every write)"}
  # cross-service data_epoch → the 3 DataEpoch namespaces (embedded in key)
  - {src: recallreq, dst: ns_mdoc,   type: async, label: "data_epoch in key"}
  - {src: recallreq, dst: ns_slot,   type: async, label: "data_epoch in key"}
  - {src: recallreq, dst: ns_graph,  type: async, label: "data_epoch in key"}
  # the ModelCkpt namespaces need no cross-service signal — ckpt_sha is self-contained
  - {src: recallreq, dst: ns_ce,     type: skip, label: "no data_epoch — ckpt_sha self-busts"}
  - {src: recallreq, dst: ns_embed,  type: skip, label: "no data_epoch — ckpt_sha self-busts"}
  # legend wiring (visual grouping only)
  - {src: leg_moved, dst: leg_ckpt, type: skip, label: "ce/embed →"}
  - {src: leg_new,   dst: leg_epoch, type: skip, label: "memory_doc/engram_slot/graph →"}
