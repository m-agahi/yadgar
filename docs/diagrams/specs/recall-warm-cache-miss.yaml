# Recall (warm) — CACHE-MISS variant.
#
# Flow source: docs/plans/cache-refactor-2026-07-01.md §1 (FLOW), cross-checked
# against yadgar/retrieval + recall.py.
# TIMINGS: docs/plans/recall-warm-profile-2026-07-02.md + recall-perf-checklist.md v5.99 run-log.
# STATE: POST v5.99 (PR #146) — PPR + spreading-BFS N+1 BATCHED per-depth
# (get_relationships_for_frontier WHERE source/target IN $ids per BFS depth;
# with_names=False dead name-enrichment dropped). Cold core (PPR/spreading): ~40-50s -> ~7-9s.
# Cold bottleneck moved: backend GTE-ModernBERT CE (~9s first /rerank, ~15s CE total cold).
# Warm floor ~1.6s unchanged: core-bound (knn + PPR + fusion); backend CE cached ~2ms.

title: "Recall (warm) — cache MISS (post v5.99)"
subtitle: "PPR+spreading-BFS N+1 batched per-depth; embed+CE miss -> compute; cold CE now bottleneck"
rankdir: TB
show_total: true

clusters:
  - {id: core,    label: "Core process (--cpus 1)",                       kind: core}
  - {id: backend, label: "Backend (--cpus 2): SurrealDB + rerank server", kind: backend}

nodes:
  - {id: entry,     label: "recall() entry\\nvalidate + detect branch/dir",  cluster: core, type: start, time_ms: 2}
  - {id: qanalysis, label: "query analysis\\nentities + routing",            cluster: core, type: compute, time_ms: 3}
  - {id: embed,     label: "query embed\\n[EMBED_CACHE MISS -> model runs]", cluster: backend, type: model, time_ms: 40}
  - {id: knn,       label: "vector KNN search\\nHNSW index",                 cluster: backend, type: io, time_ms: 25}
  - {id: fts,       label: "FTS BM25 search\\nbranch clause injected",       cluster: backend, type: io, time_ms: 22}
  - {id: priors,    label: "graph+cofire priors\\n[v5.96 BATCHED: 2 queries]", cluster: backend, type: io, time_ms: 150}
  - {id: spread,    label: "spreading-BFS activation\\n[v5.99 BATCHED: 1 q/BFS-depth; cold ~40-50s->~7-9s core w/PPR]", cluster: backend, type: io, time_ms: 0}
  - {id: ppr,       label: "personalized PageRank\\n[v5.99 adj batched; warm 0-300ms; cold see spread]", cluster: core, type: compute, time_ms: 300}
  - {id: fusion,    label: "WRRF / convex fusion\\nmerge signals",           cluster: core, type: compute, time_ms: 2}
  - {id: fetch,     label: "fusion final-fetch\\n[v5.97 BATCHED: 1 query WHERE id IN]", cluster: backend, type: io, time_ms: 40}
  - {id: cererank,  label: "CE rerank (GTE-ModernBERT)\\n[CE_CACHE MISS; COLD BOTTLENECK: ~9s first /rerank]", cluster: backend, type: model, time_ms: 720}
  - {id: dedup,     label: "dedup + MMR diversity",                          cluster: core, type: compute, time_ms: 3}
  - {id: heat,      label: "heat-boost\\n(async, off critical path)",        cluster: backend, type: store, time_ms: 0}
  - {id: results,   label: "ranked results",                                cluster: core, type: end}

edges:
  - {src: entry,     dst: qanalysis, order: 1}
  - {src: qanalysis, dst: embed,     order: 2}
  - {src: embed,     dst: knn,       order: 3, label: "query vector"}
  - {src: knn,       dst: fts,       order: 4}
  - {src: fts,       dst: priors,    order: 5}
  - {src: priors,    dst: spread,    order: 6}
  - {src: spread,    dst: ppr,       order: 7}
  - {src: ppr,       dst: fusion,    order: 8, label: "signals"}
  - {src: fusion,    dst: fetch,     order: 9, label: "top candidates"}
  - {src: fetch,     dst: cererank,  order: 10, label: "hydrated rows"}
  - {src: cererank,  dst: dedup,     order: 11}
  - {src: dedup,     dst: heat,      order: 12}
  - {src: heat,      dst: results,   order: 13}
