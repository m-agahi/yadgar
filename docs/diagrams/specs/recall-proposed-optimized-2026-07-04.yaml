# Recall — PROPOSED optimized pipeline (DESIGN TARGET, not measured).
#
# This is a MOCK/PROPOSED architecture, NOT a captured trace. Every time_ms is
# a design estimate ("PROPOSED"/"est"), derived from the real cold-trace
# (recall-cold-trace-2026-07-04.yaml, trace 242cc546, 26.1 s) by applying three
# structural changes. Do NOT read these as measured numbers.
#
# THE THREE CHANGES vs today's 26.1 s serial pipeline:
#   (a) ALL-BACKEND — the whole pipeline (steps 1-21) relocates INTO the backend
#       (the #85 plan). Core keeps only a thin forward-in / return-out shim, so
#       there are exactly two `core` nodes: the entry forward and the final
#       return. No per-stage core<->backend RPC hop anymore.
#   (b) PARALLEL GATHER — the independent gather signals run concurrently instead
#       of serially. Step 1 forks into three arms: FTS(2), query-embed(3)->KNN(4),
#       and the whole wiki arm(17). From the seeds {2,4} a second fan-out drives
#       PPR(5), spreading(6), graph-priors(8), cofire-priors(9) in parallel. The
#       memory signals join at convex fusion(7); wiki(17) joins at build(10).
#   (c) ONE MERGED CE PASS — today's THREE cross-encoder passes (11 cross_encoder
#       + 12 multi_passage + 18 wiki crossfuse, ~20 s) collapse into a SINGLE CE
#       pass over the memory+wiki candidate UNION. multi_passage is DROPPED.
#       This is still the wall (~10 s PROPOSED); #32 faster-model is the next
#       frontier after this.
#   (d) ASYNC SIDE-EFFECTS — step 20 (heat-boost + SR transition) forks OFF the
#       critical path. Step 19 fans out to BOTH 21 (return, critical) and 20
#       (async, non-blocking). 21 does NOT wait on 20.
#
# CRITICAL PATH (a DAG, so total is NOT the node-sum): the longest chain is
# forward -> 1 -> (embed 21 + KNN 55 + spreading 1538, the gather long-pole) ->
# fusion 2 -> build 943 -> CE 10000 -> post-rerank 1200 -> finalize 0.1 ->
# return 0.5 ≈ 13.8 s. Side-effects(20, 233 ms) are async, EXCLUDED. total_ms is
# pinned to the critical-path figure below so show_total does NOT sum the DAG.
#
# Node types are compute/io/model only — all render shape=box (rectangles). No
# store/start/end types (those draw cylinders/circles), per the request.

title: "Recall — PROPOSED optimized (all-backend · parallel-gather · single merged CE · async side-effects)"
subtitle: "DESIGN TARGET (not measured) · today 26.1 s → PROPOSED ~14 s critical path · CE still dominates (~10 s) → #32 faster-model next · side-effects async off-path"
rankdir: TB
show_total: true
total_ms: 14000        # PROPOSED critical-path (DAG), NOT node-sum. ~13.8 s longest chain, rounded.

clusters:
  - {id: core,    label: "Core process — thin shim only (forward in / return out)", kind: core}
  - {id: backend, label: "Backend — ENTIRE pipeline relocated here (#85): SurrealDB + rerank + embed, parallel gather", kind: backend}

nodes:
  # --- thin core shim: forward in ---
  - {id: forward,   label: "recall() → forward to backend /recall\\nthin core shim (branch/dir detect)\\nPROPOSED",  cluster: core,    type: compute, time_ms: 1}
  # --- step 1: query analysis, fans out the gather arms ---
  - {id: n1,        label: "1 · query analysis\\nentities / routing\\nest",                                          cluster: backend, type: compute, time_ms: 0.4}
  # --- memory candidate signals (parallel gather) ---
  - {id: n2,        label: "2 · FTS BM25\\nbranch clause injected\\nest",                                            cluster: backend, type: io,      time_ms: 23}
  - {id: n3,        label: "3 · query embed\\nbackend.embed\\nest",                                                  cluster: backend, type: model,   time_ms: 21}
  - {id: n4,        label: "4 · vector KNN\\nHNSW search\\nest",                                                     cluster: backend, type: io,      time_ms: 55}
  - {id: n5,        label: "5 · personalized PageRank\\nentity seeds + graph walk\\nest",                            cluster: backend, type: compute, time_ms: 241}
  - {id: n6,        label: "6 · spreading activation BFS\\nper-depth graph IO (gather long-pole)\\nest",             cluster: backend, type: io,      time_ms: 1538}
  - {id: n8,        label: "8 · graph priors\\nstorage.graph_priors\\nest",                                          cluster: backend, type: io,      time_ms: 157}
  - {id: n9,        label: "9 · cofire priors\\nstorage.cofire_priors\\nest",                                        cluster: backend, type: io,      time_ms: 151}
  # --- wiki arm (parallel to the whole memory arm) ---
  - {id: n17,       label: "17 · wiki candidates gather\\nwiki.query + get_wiki_page (∥ memory arm)\\nest",          cluster: backend, type: io,      time_ms: 1499}
  # --- fusion over the memory signals ---
  - {id: n7,        label: "7 · convex fusion\\nmerge memory signals (now over merged pool)\\nest",                  cluster: backend, type: compute, time_ms: 2}
  # --- hydrate the merged memory+wiki pool ---
  - {id: n10,       label: "10 · build_results hydrate\\nget_memories_by_ids — MERGED memory+wiki pool\\nest",       cluster: backend, type: io,      time_ms: 943}
  # --- THE WALL: single merged CE pass ---
  - {id: ce,        label: "CE — SINGLE merged pass (memory+wiki union)\\n#28-trimmed · replaces 11+12+18 · multi_passage DROPPED\\nPROPOSED — still the wall → #32 faster-model next", cluster: backend, type: model, time_ms: 10000}
  # --- post-rerank (combined for readability) ---
  - {id: post,      label: "13–16 · post-rerank\\nprofile_belief + rules + MMR + engram_links\\nest",               cluster: backend, type: compute, time_ms: 1200}
  # --- finalize (trivial once pool is pre-merged) ---
  - {id: n19,       label: "19 · finalize + cross-type dedup\\ntrivial once pool merged\\nest",                      cluster: backend, type: compute, time_ms: 0.1}
  # --- async side-effect fork (OFF critical path) ---
  - {id: n20,       label: "20 · side-effects: heat-boost + SR transition\\nASYNC, non-blocking, ∥ return\\nest",    cluster: backend, type: io,      time_ms: 233}
  # --- thin core shim: return out (CRITICAL PATH END) ---
  - {id: n21,       label: "21 · ranked results → return to core\\nCRITICAL PATH END\\nest",                         cluster: core,    type: compute, time_ms: 0.5}

edges:
  # thin core forward → step 1 (crosses into backend cluster)
  - {src: forward, dst: n1,  label: "forward to backend"}
  # step 1 forks the three parallel gather arms
  - {src: n1, dst: n2,  label: "gather ∥"}
  - {src: n1, dst: n3,  label: "gather ∥"}
  - {src: n1, dst: n17, label: "wiki arm ∥"}
  # embed → KNN
  - {src: n3, dst: n4,  label: "query vector"}
  # seeds {2,4} fan out to graph signals + priors (all parallel)
  - {src: n2, dst: n5}
  - {src: n2, dst: n6}
  - {src: n2, dst: n8}
  - {src: n2, dst: n9}
  - {src: n4, dst: n5}
  - {src: n4, dst: n6}
  - {src: n4, dst: n8}
  - {src: n4, dst: n9}
  # memory signals {2,4,5,6,8,9} join into convex fusion
  - {src: n2, dst: n7}
  - {src: n4, dst: n7}
  - {src: n5, dst: n7}
  - {src: n6, dst: n7}
  - {src: n8, dst: n7}
  - {src: n9, dst: n7}
  # {fusion, wiki} join at build — memory pool + wiki pool MERGE here
  - {src: n7,  dst: n10, label: "memory pool"}
  - {src: n17, dst: n10, label: "wiki pool → merge"}
  # merged pool → single CE → post-rerank → finalize
  - {src: n10, dst: ce,   label: "merged candidates"}
  - {src: ce,  dst: post}
  - {src: post, dst: n19}
  # step 19 forks: 21 (critical return) AND 20 (async, non-blocking)
  - {src: n19, dst: n21, label: "critical path"}
  - {src: n19, dst: n20, label: "async · non-blocking", type: async}
