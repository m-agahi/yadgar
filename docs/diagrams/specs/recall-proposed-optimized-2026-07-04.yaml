  - {src: forward, dst: n1,  label: "forward to backend"}
  # step 1 forks the gather arms (bounded budget)
  - {src: n1, dst: n2,  label: "gather ∥ (bounded)"}
  - {src: n1, dst: n3,  label: "gather ∥ (bounded)"}
  - {src: n1, dst: n17, label: "wiki arm ∥"}
  # embed → KNN
  - {src: n3, dst: n4,  label: "query vector"}
  # seeds {2,4} fan out to graph signals + priors (GIL-bound → serial-by-default)
  - {src: n2, dst: n5}
  - {src: n2, dst: n6}
  - {src: n2, dst: n8}
  - {src: n2, dst: n9}
  - {src: n4, dst: n5}
  - {src: n4, dst: n6}
  - {src: n4, dst: n8}
  - {src: n4, dst: n9}
  # memory signals {2,4,5,6,8,9} join into convex fusion (serial-by-default)
  - {src: n2, dst: n7}
  - {src: n4, dst: n7}
  - {src: n5, dst: n7}
  - {src: n6, dst: n7}
  - {src: n8, dst: n7}
  - {src: n9, dst: n7}
  # fusion → build MEMORY pool (wiki NO LONGER merges here)
  - {src: n7,  dst: n10, label: "memory pool"}
