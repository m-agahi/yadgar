# Alembic config for MariaDB (spine — task-table-refactor-2026-07-29, D34)
#
# This config is for the RELATIONAL set only: runtime_config + task + adr +
# agent_prompt. SurrealDB schema changes stay in migrations.py — the two
# migration systems are separate and must not be merged (D34).

[alembic]
script_location = yadgar/_shared/storage/alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
