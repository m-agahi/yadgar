repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # third-party/ holds VERBATIM upstream license texts whose SHA-256 is
      # pinned in .third-party-manifest.json — a normalised verbatim license is
      # no longer verbatim. PROPHYLACTIC, not corrective: measured 2026-08-20,
      # both current texts are already hook-clean (no trailing whitespace, final
      # newline present, no CRLF), so these excludes change nothing today. They
      # are here for the next text added — a CRLF upstream file, or one without
      # a final newline, would be rewritten on the commit that adds it.
      # check_third_party_licenses.py rule 2 re-checks the SHA-256 on every
      # commit, so dropping an exclude is caught rather than silently absorbed.
      - id: end-of-file-fixer
        exclude: "^third-party/"
      - id: trailing-whitespace
        exclude: "^third-party/"
      - id: mixed-line-ending
        exclude: "^third-party/"
      - id: check-added-large-files
        args: [--maxkb=2048]
      # PARSE GATES (0047 C1). scripts/check_versions.py reads
      # docker-compose.yml as TEXT and regexes it, so a file PyYAML cannot
      # parse at all still exits 0 — and that is exactly what happened: an
      # `image:` key landed at column 0 inside `services: -> backend:` and every
      # version gate stayed green over a compose file no runtime could load.
      # That is not a bug in check_versions.py; it is a missing hook, and
      # converting that script to a full YAML parse adds no coverage once these
      # two exist. Same argument for JSON — server.json took the same column-0
      # damage in the same PR.
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: sync-version
        name: Sync version to server.json
        language: system
        entry: python3 scripts/sync_version.py
        # BOTH tracks trigger the sync. pyproject.toml is the CORE source;
        # server.json's backend_version is the BACKEND source, and
        # sync_version.py already propagates it to flake.nix, docker-compose.yml
        # and yadgar/__init__.py. Gating on pyproject alone meant a backend bump
        # never fired the propagation it needed, and check_versions.py VALIDATES
        # the backend track rather than syncing it — so the commit just failed
        # until all four sites were hand-edited to agree (v5.171.0).
        files: ^(pyproject\.toml|server\.json)$
        pass_filenames: false

      - id: sync-uv-lock
        name: Sync uv.lock
        language: system
        entry: python3 scripts/sync_uv_lock.py
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: gitleaks
        name: Detect secrets and credentials
        language: system
        entry: gitleaks git --pre-commit --staged --verbose
        pass_filenames: false

      - id: check-versions
        name: Check version consistency
        language: system
        entry: python3 scripts/check_versions.py
        # always_run: a rebase/assembly can produce an inconsistent version set
        # WITHOUT staging any version file (2026-07-10: Car 2 bumped backend in 3
        # of 4 surfaces, assembly unioned server.json, flake.nix stayed at 5.34.0
        # and every file-triggered hook reported Skipped). Consistency must be
        # checked on every commit regardless of which files are staged — same
        # gate-blindness class as ADR-0080's check_backend_bump fix.
        always_run: true
        pass_filenames: false

      - id: check-backend-bump
        name: Enforce backend_version bump on backend build input changes
        language: system
        entry: python3 scripts/check_backend_bump.py
        # always_run (PR #175 local/CI parity): the script evaluates the
        # cumulative branch diff vs merge-base(origin/master), exactly like the
        # CI gate — so it must fire on EVERY commit, not only when a backend
        # input is staged.  The old `files:` filter also missed yadgar/backend/**
        # (matched top-level backend/ only) while the script matches a backend
        # dir at any depth — hook silently skipped locally, CI failed.
        always_run: true
        pass_filenames: false

      - id: check-version-compat-window
        name: Check version_compat.json's declared window covers server.json's shipped pair
        language: system
        entry: python3 scripts/check_version_compat_window.py
        # always_run: same gate-blindness class as check-versions and
        # check-backend-bump above (ADR-0080). server.json's `version` /
        # `backend_version` and yadgar/_shared/version_compat.json's declared
        # window are two independent files — either can be edited without the
        # other being staged. That is exactly how this went stale for 5 minor
        # releases each side (task 173): core.max sat at 5.183.1 and
        # backend.max at 5.75.0 while production shipped 5.188.0 / 5.80.0, and
        # /health reported a correctly-matched pair as incompatible. Nothing
        # gates a live process on that field (it's informational — see the
        # sidecar's own _comment) but the DECLARATION must stay honest.
        always_run: true
        pass_filenames: false

      - id: check-complexity
        name: Enforce I13 complexity caps (LOC / nesting / class / file)
        language: system
        entry: python3 scripts/check_complexity.py
        types: [python]
        exclude: "^benchmarks/"
        pass_filenames: true

      - id: check-metric-writers
        name: Check that declared Prometheus metrics have writers (I23)
        language: system
        entry: python scripts/check_metric_writers.py
        pass_filenames: false
        files: ^yadgar/.*\.py$

      - id: check-trace-spans
        name: Check that public observable methods have @trace_span (I24)
        language: system
        entry: python scripts/check_trace_spans.py
        types: [python]
        pass_filenames: false
        files: ^yadgar/core/server/http\.py$

      - id: check-observe-coverage
        name: Check I33 tri-signal observe-coverage (HARD; MISSING=0 enforced)
        language: system
        entry: python scripts/check_observe_coverage.py
        types: [python]
        pass_filenames: false
        files: ^(yadgar/.*\.py|\.observe-allowlist\.json)$

      - id: check-dynamic-span-names
        name: Check span names stay dynamic (no hardcoded @trace_span/@observe name, R2b)
        language: system
        entry: python scripts/check_dynamic_span_names.py
        types: [python]
        pass_filenames: false
        files: ^yadgar/.*\.py$

      - id: check-ledger-chokepoint
        name: "Check ledger chokepoint (D20: every ledger table access goes through MariaStorageEngine)"
        language: system
        entry: python scripts/check_ledger_chokepoint.py --allowlist .ledger-chokepoint-allowlist.txt
        types: [python]
        pass_filenames: false
        files: ^yadgar/.*\.py$

      - id: check-auth-token-pattern
        name: "Check bearer-token resolution chokepoint (bug train car 9: every YADGAR_MCP_AUTH_TOKEN read routes through resolve_auth_token())"
        language: system
        entry: python scripts/check_auth_token_pattern.py
        types: [python]
        pass_filenames: false
        files: ^yadgar/.*\.py$

      - id: check-secret-gate
        name: Check I26 secret-gate invariant (all write tools call gate_or_reject)
        language: system
        entry: python scripts/check_secret_gate.py
        pass_filenames: false
        files: ^yadgar/core/server/tools/.*\.py$

      - id: check-config-three-way-sync
        name: Check config three-way-sync + default-value invariants (I25 / I25b)
        language: system
        entry: >-
          uv run python -m pytest
          yadgar/tests/server/test_config_three_way_sync.py
          yadgar/tests/server/test_config_default_values.py
          -q --tb=short
        # always_run (task:0103): the old `files:` filter listed only the three
        # config modules + the env-only allowlist.  I25b compares a DECLARED
        # registry default against the CODE default it documents, and that code
        # default lives anywhere — yadgar/core/daemon/runtime.py held the one
        # that exposed this gap.  A commit touching ONLY the code side would
        # have skipped the hook entirely, i.e. the hook would fire in exactly
        # the one direction already visible in review.  Enumerating every module
        # that can hold a code default is unbounded; always_run is the repo's
        # established answer to this gate-blindness class (see check-versions
        # and check-backend-bump above, and ADR-0080).
        always_run: true
        pass_filenames: false

      - id: check-allowlist-audit
        name: Check I28 allowlist-audit invariant (every allowlist hit has audit entry)
        language: system
        entry: python scripts/check_allowlist_audit.py
        pass_filenames: false
        files: ^yadgar/_shared/security/(allowlist\.py|secrets\.py)$

      - id: check-dead-capability
        name: Check I29 edge dead-capability lint (produced ≡ contracted, no drop-still-produced)
        language: system
        entry: python scripts/check_dead_capability.py
        pass_filenames: false
        files: ^(yadgar/backend/graph/graph_api\.py|yadgar/_shared/contracts/viz\.py|yadgar/core/viz/viz_meta\.py|docs/contracts/EDGE_CONTRACT\.md)$

      - id: check-capability-coverage
        name: Check I32 capability-registry coverage (every setting/tool/migration/BC catalogued)
        language: system
        entry: python scripts/check_capability_coverage.py
        pass_filenames: false
        # always_run is a local/CI PARITY nit, NOT a fix: CI already runs this
        # unconditionally, so the `files:` filter only ever produced the
        # "quiet locally, loud in CI" surprise ADR-0080 names. The I32 hole that
        # let CAP-CODEGRAPH-001 rot was never the trigger — this checker RAN and
        # PASSED on that PR. See check-registry-prose-liveness below for the fix.
        always_run: true

      - id: check-route-literals
        name: Check every internal route literal resolves to a registered route
        language: system
        entry: python scripts/check_route_literals.py
        pass_filenames: false
        # always_run: the route table and the call sites are collected from ALL of
        # non-test yadgar/, and a call site can be added in a file that declares no
        # route (which is exactly how /api/check_invariants was requested for months
        # with nothing registered behind it). Any files: filter is narrower than the
        # read set. Measured ~1.7s on this tree.
        always_run: true

      - id: check-health-endpoint-semantics
        name: Check bare /health (readiness) probes are governed by an allowlist rationale (Car 0091)
        language: system
        entry: python scripts/check_health_endpoint_semantics.py
        pass_filenames: false
        # always_run: same rationale as check-route-literals above — the ADR-0019
        # config-file-only pin let three Python call sites drift onto bare /health
        # (readiness) where /health/live (liveness) was actually needed, with no
        # files: filter narrow enough to have caught any of them.
        always_run: true

      - id: check-urllib-httperror-close
        name: Check urllib HTTPError/response call sites close the file wrapper (Car 0036)
        language: system
        entry: python scripts/check_urllib_httperror_close.py
        pass_filenames: false
        # always_run: same rationale as check-route-literals above — a urllib
        # HTTPError/urlopen() call site can appear in any file, so any files:
        # filter is narrower than the read set.
        always_run: true

      - id: check-directory-residue
        name: Check ADR-0225 `directory` residue sweep (both directions + sibling allowlists)
        language: system
        entry: python scripts/check_directory_residue.py
        pass_filenames: false
        # always_run, and this one is the POINT of the hook rather than a nit.
        # Three tree-scoped predecessors exist as PYTEST modules (C9a/_shared,
        # C9b/backend), so `pre-commit run --all-files` — the standing per-car
        # requirement — never ran them, and ADR-0218 forbids the full unit suite.
        # A car sweeping `backend` was therefore structurally unable to see
        # `_shared`'s module go red, which is how a sweep stranded a sibling's
        # allowlist entry twice on this train. One whole-repo run against one
        # allowlist, at every car boundary, is what closes that class; this
        # script also parses the two sibling dicts so their entries cannot be
        # stranded unseen either. Measured ~1.5s on this tree (506 files).
        always_run: true

      - id: check-registry-prose-liveness
        name: Check I32 prose-token liveness (registry cites no dead identifiers)
        language: system
        entry: python scripts/check_registry_prose_liveness.py
        pass_filenames: false
        # always_run: the read set is the registry PLUS all of non-test yadgar/,
        # so any narrower files: filter is blind by construction — a pure code
        # change with zero contract files staged is exactly the input that must
        # make this fail. Measured ~1.2s on this tree.
        always_run: true

      - id: check-ruff-ignores-liveness
        name: Check pyproject.toml per-file-ignores liveness (no dead-path or vacuous entries)
        language: system
        entry: python scripts/check_ruff_ignores_liveness.py
        pass_filenames: false
        # always_run: the read set is pyproject.toml's per-file-ignores table
        # PLUS a repo-wide ruff pass with that table cleared — a pure code
        # change that fixes an allowlisted violation (or moves/deletes an
        # allowlisted file) with zero pyproject.toml lines staged is exactly
        # the input that must make this fail. Car 7 (2026-08-13) found the
        # table 23/28 path entries rotten (5 dead-path lines, 18 vacuous
        # lines) with no guard catching either class; this closes that gap.
        # One ruff subprocess.
        always_run: true

      - id: check-model-id-liveness
        name: Check model-id liveness (config default ↔ image bake ↔ code literal)
        language: system
        entry: python scripts/check_model_id_liveness.py
        pass_filenames: false
        # always_run: the read set is config.py + Dockerfile.backend + every
        # ML-loading module, so a change to any ONE of the three can invalidate
        # the other two. A files: filter narrower than that is blind by
        # construction — a Dockerfile bake-list edit with no config change is
        # exactly the input that must fail. Measured ~0.3s on this tree.
        always_run: true

      - id: check-third-party-licenses
        name: Check every bundled third-party binary is catalogued and shipped (task 69)
        language: system
        entry: python scripts/check_third_party_licenses.py
        pass_filenames: false
        # always_run: the read set is every root Dockerfile PLUS the manifest,
        # the verbatim texts and THIRD-PARTY-LICENSES — and the guard's whole
        # point is to fail on inputs that stage NONE of them. A formatter
        # rewriting a verbatim license, or a `.pre-commit-config.yaml` edit
        # dropping the third-party/ exclude, changes the verdict without
        # touching a Dockerfile. Same gate-blindness class as check-versions
        # and check-backend-bump above (ADR-0080). Sub-second on this tree.
        always_run: true

      - id: check-roadmap-links
        name: Check every path docs/plans/ROADMAP.md references actually exists (Car 0026)
        language: system
        entry: python scripts/check_roadmap_links.py
        pass_filenames: false
        # always_run: the read set is a single fixed file (docs/plans/ROADMAP.md)
        # regardless of which files are staged — a plan doc moving to archive/
        # in one commit and the roadmap link update landing in another (or
        # never) is exactly the drift this guard exists to catch. Sub-second.
        always_run: true

      - id: check-plan-signature-drift
        name: Check docs/plans/** cross-document signature drift (call kwargs vs in-corpus def)
        language: system
        entry: python scripts/check_plan_signature_drift.py
        pass_filenames: false
        # files: (NOT always_run). The corpus half is safe to filter — no commit
        # can add a signature or a call site without staging a docs/plans/*.md.
        # But the verdict is a function of the corpus AND this script's
        # suppression rules, so the script is in scope too: editing _MIN_KWARGS
        # or dropping a suppression must re-run the guard (ADR-0080).
        # ~60 non-archive plan docs, well under a second.
        files: ^(docs/plans/.*\.md|scripts/check_plan_signature_drift\.py)$

      - id: check-changelog-unreleased-versions
        name: Check docs/CHANGELOG.md [Unreleased] carries no shipped-version markers (Car 0102)
        language: system
        entry: python scripts/check_changelog_unreleased_versions.py
        pass_filenames: false
        # always_run: the read set is a single fixed file (docs/CHANGELOG.md)
        # regardless of which files are staged — a release shipping (version
        # bump landing in one commit) while its CHANGELOG entry keeps an
        # inline **vX.Y.Z marker instead of being cut into its own section is
        # exactly the drift this guard exists to catch (55 entries across 40
        # versions accumulated this way before Car 0102). Sub-second.
        always_run: true

      - id: check-complexity-allowlist
        name: Check I30 complexity-cap integrity (HARD gated, rationale required, no stale entries)
        language: system
        entry: python scripts/check_complexity_allowlist.py
        pass_filenames: false
        files: ^(yadgar/.*\.py|scripts/.*\.py|\.complexity-allowlist\.json|\.complexity-config\.json)$

      - id: check-swallowed-failure
        name: Check ADR-0420 swallowed failure (R3 at zero, R1 baseline-ratcheted)
        language: system
        entry: python scripts/check_swallowed_failure.py
        pass_filenames: false
        # always_run (same reason as check-test-weakening below, and as the
        # comment there records): this hook's HARD arm is baseline INTEGRITY —
        # a stale entry, a shape change, a log-level move. A `files:` filter
        # keyed on staged paths skips exactly the commits that matter: deleting
        # or renaming a baselined function strands its entry, and the commit
        # that does it may stage no file the filter would match.
        always_run: true

      - id: check-test-weakening
        name: Block silent test weakening (e2e assert removal / ✅ regression) (#52)
        language: system
        entry: python scripts/check_test_weakening.py
        pass_filenames: false
        # always_run (2026-07-29, same reason as check-backend-bump/ADR-0080):
        # the script now evaluates the cumulative BRANCH diff vs
        # merge-base(origin/master), not just the index — so a `files:` filter
        # keyed on staged paths would skip the hook on the very commits where an
        # earlier commit's weakening is the thing to catch.
        always_run: true

      - id: check-ci-local-parity
        name: Check `make ci-local` matches ci-pr.yml's CI subsystem test selection + leg structure (Car F5/F10, PR #40 postmortem)
        language: system
        entry: python scripts/check_ci_local_parity.py
        pass_filenames: false
        # Narrow files: is correct here (unlike the always_run checks above) — this
        # script reads exactly these files and nothing else, so a filter on them is
        # not narrower than the read set. Car F10 widened the read set to
        # scripts/ci-local-legs.sh (the leg runner it now also validates) and to
        # itself (editing the guard's own discovery logic should re-run it too).
        files: ^(Makefile|\.github/workflows/ci-pr\.yml|scripts/ci-local-legs\.sh|scripts/check_ci_local_parity\.py)$

      - id: check-e2e-assertions
        name: Assert every e2e test_* fn has ≥1 real assertion (#52)
        language: system
        entry: python scripts/check_e2e_assertions.py
        pass_filenames: false
        # always_run (2026-07-29 gate-blindness fix): the script's scan set is
        # yadgar/tests/e2e/**/*.py ∪ yadgar/tests/**/*e2e*.py — it reads the whole
        # set regardless of what is staged, so ANY `files:` filter is narrower
        # than the read set by construction (the defect this widening fixed).
        # Whole-tree AST over ~40 modules; measured well under the per-commit budget.
        always_run: true

      - id: check-skip-inventory
        name: Validate skip_inventory.json (ADR-0087 governance — note >=40, stale hard-fail, no wildcards)
        language: system
        entry: python scripts/check_skip_inventory.py --validate-inventory
        pass_filenames: false
        # Also fires on test-file changes: deleting/renaming a test can strand
        # an inventory entry — the stale-entry hard-fail catches it at commit.
        files: ^yadgar/tests/(skip_inventory\.json|.*\.py)$

      - id: check-subsystem-readmes
        name: Every major subsystem package has a README.md (T2 Car D existence lint)
        language: system
        entry: python scripts/check_subsystem_readmes.py
        pass_filenames: false
        files: ^(yadgar/(_shared|backend|core)/[^/]+/?.*|scripts/check_subsystem_readmes\.py)$
      - id: check-skip-markers
        name: Block new unsanctioned skip markers in staged test files (ADR-0087)
        language: system
        entry: python scripts/check_skip_markers.py
        types: [python]
        pass_filenames: true
        files: ^yadgar/tests/.*\.py$

  - repo: local
    hooks:
      - id: check-image-size-backend
        name: Release-readiness — backend image size cap (2.0 GB)
        language: system
        entry: python3 scripts/check_image_size.py --image-type backend
        files: ^(Dockerfile\.backend|uv\.lock|pyproject\.toml)$
        pass_filenames: false
        stages: [manual]

      - id: check-image-size-core
        name: Release-readiness — core image size cap (0.8 GB)
        language: system
        entry: python3 scripts/check_image_size.py --image-type core
        files: ^(Dockerfile|uv\.lock|pyproject\.toml)$
        pass_filenames: false
        stages: [manual]

      - id: import-linter
        name: Enforce layer boundaries (import-linter, folder-split #17)
        # HARD-FAIL, not report-only. Analyzes the IMPORTABLE yadgar package
        # (not staged files), so it needs yadgar installed in the environment —
        # language: system runs it in the active venv where `pip install -e .`
        # has been done. An isolated pre-commit venv would lack yadgar and hit
        # "Could not read any configuration". Contract config lives in
        # pyproject.toml [tool.importlinter]; must stay 4 kept / 0 broken.
        language: system
        # Self-resolve the CURRENT worktree's venv. `language: system` runs under
        # pre-commit's python, not the project venv, so a bare `lint-imports` is
        # "Executable not found" in any worktree that has not exported PATH by hand
        # (every agent worktree, repeatedly). Must be THIS tree's .venv, never the
        # main repo's — the editable install points at whichever tree owns it, so
        # borrowing it would analyse the wrong code.
        entry: bash -c 'PATH="$PWD/.venv/bin:$PATH" exec lint-imports'
        files: ^(yadgar/.*\.py|pyproject\.toml)$
        pass_filenames: false
        # pre-commit only (fail fast at commit). Without this the hook runs every
        # stage incl. pre-push, where the venv may be absent on PATH → spurious
        # "Executable `lint-imports` not found". Commit-time is the enforcement point.
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ruff
        name: Lint Python (ruff)
        language: system
        entry: ruff check --fix --unsafe-fixes
        types: [python]
        exclude: "^benchmarks/"

      - id: ruff-format
        name: Format Python (ruff)
        language: system
        entry: ruff format
        types: [python]
        exclude: "^benchmarks/"

      - id: check-staged-parses
        name: Staged Python files must parse
        language: system
        entry: python scripts/check_staged_parses.py
        types: [python]
        pass_filenames: true
        # ORDER IS LOAD-BEARING: this must sit AFTER ruff/ruff-format. The
        # incident it exists for (93f3ed95, reverted in 8f826592) was a
        # FORMATTER rewrite that `git add -A` re-staged, so a parse check
        # ordered before the formatter is structurally unable to see the file
        # that actually gets committed.
        #
        # No `exclude:` — unlike the ruff hooks above, which skip benchmarks/.
        # An unparseable file is a broken commit wherever it lives, and the
        # 2026-08-12 sweep found benchmarks/ was exactly the tree that rotted
        # while every yadgar/**-scoped guard stayed green.
        #
        # pass_filenames is explicit rather than defaulted: the script treats
        # an empty argv as a hard error precisely so flipping this to false
        # cannot silently turn the hook into a no-op.

      - id: type-ratchet
        name: Strict-typing ratchet (touched files may not gain type errors)
        language: system
        entry: python scripts/check_type_ratchet.py
        pass_filenames: false
        # always_run + cumulative BRANCH diff, for the same reason as
        # check-test-weakening/check-backend-bump: a CI checkout has an empty
        # index, so a `files:`-filtered hook would skip on exactly the commits
        # where an EARLIER commit on the branch introduced the type error.
        always_run: true

  - repo: local
    hooks:
      - id: verify-version-bump-local
        name: Verify version bump vs latest tag (local mirror of CI)
        language: system
        entry: python scripts/check_version_bump.py
        pass_filenames: false
        stages: [pre-push]
        # fail_fast: a failure here must abort the push immediately, before
        # the ~7min e2e-behavior-contract hook below runs — without this,
        # `pre-commit run --hook-stage pre-push` executes every hook
        # regardless of earlier failures.
        fail_fast: true
        # Mirrors .github/workflows/ci-pr.yml's verify-version-bump job: fails
        # when pyproject.toml's version still matches the latest git tag AND
        # the push touches yadgar/**. Runs first among the pre-push hooks —
        # near-instant, so it fails fast before the ~7min `make e2e` run below
        # instead of only surfacing after push as a CI failure on an open PR.
        # No `files:` filter: the script itself decides via `git diff
        # origin/master...HEAD`, which is the authoritative CI-parity
        # comparison — a pre-commit-side files: filter would duplicate that
        # decision with a different (push-local) diff and could disagree with
        # it. Fail-open (exit 0 + stderr warning) when origin/master is
        # unreachable locally; use `SKIP=verify-version-bump-local git push`
        # for the rare deliberate no-bump push (no local equivalent of CI's
        # 'no-release' PR label).

      - id: e2e-behavior-contract
        name: Behavior-contract e2e safety net (make e2e)
        language: system
        entry: make e2e
        pass_filenames: false
        stages: [pre-push]
        # Only gate pushes that touch code or the behavior contract. Docs-only /
        # non-code pushes (plans, *.md, *.json, configs) skip the slow e2e run —
        # they cannot change e2e outcomes. BEHAVIOR_CONTRACT.md is included
        # because the e2e suite asserts its SHALL statements.
        files: '(\.py$|(^|/)Makefile$|(^|/)pyproject\.toml$|(^|/)conftest\.py$|^docs/contracts/BEHAVIOR_CONTRACT\.md$)'
