repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: local
    hooks:
      - id: sync-version
        name: Sync version to server.json
        language: system
        entry: python3 scripts/sync_version.py
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: sync-uv-lock
        name: Sync uv.lock
        language: system
        entry: python3 scripts/sync_uv_lock.py
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: gitleaks
        name: Detect secrets and credentials
        language: system
        entry: gitleaks git --pre-commit --staged --verbose
        pass_filenames: false

      - id: check-versions
        name: Check version consistency
        language: system
        entry: python3 scripts/check_versions.py
        files: ^(pyproject\.toml|server\.json|docker-compose\.yml|uv\.lock)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: ruff
        name: Lint Python (ruff)
        language: system
        entry: ruff check --fix --unsafe-fixes
        types: [python]
        exclude: "^benchmarks/"

      - id: ruff-format
        name: Format Python (ruff)
        language: system
        entry: ruff format
        types: [python]
        exclude: "^benchmarks/"
