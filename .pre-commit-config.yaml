repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: local
    hooks:
      - id: sync-version
        name: Sync version to server.json
        language: system
        entry: python3 scripts/sync_version.py
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: sync-uv-lock
        name: Sync uv.lock
        language: system
        entry: python3 scripts/sync_uv_lock.py
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: gitleaks
        name: Detect secrets and credentials
        language: system
        entry: gitleaks git --pre-commit --staged --verbose
        pass_filenames: false

      - id: check-versions
        name: Check version consistency
        language: system
        entry: python3 scripts/check_versions.py
        files: ^(pyproject\.toml|server\.json|docker-compose\.yml|uv\.lock)$
        pass_filenames: false

      - id: check-backend-bump
        name: Enforce backend_version bump on backend build input changes
        language: system
        entry: python3 scripts/check_backend_bump.py
        files: ^(entrypoint-backend\.sh|Dockerfile\.backend|backend/.*)$
        pass_filenames: false

      - id: check-complexity
        name: Enforce I13 complexity caps (LOC / nesting / class / file)
        language: system
        entry: python3 scripts/check_complexity.py
        types: [python]
        exclude: "^benchmarks/"
        pass_filenames: true

  - repo: local
    hooks:
      - id: check-image-size-backend
        name: Release-readiness — backend image size cap (2.0 GB)
        language: system
        entry: python3 scripts/check_image_size.py --image docker.io/openfantasy/yadgar-backend:$(python3 -c "import json; print(json.load(open('server.json'))['backend_version'])")
        files: ^(Dockerfile\.backend|uv\.lock|pyproject\.toml)$
        pass_filenames: false
        stages: [manual]

      - id: check-image-size-core
        name: Release-readiness — core image size cap (0.8 GB)
        language: system
        entry: python3 scripts/check_image_size.py --image docker.io/openfantasy/yadgar:$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
        files: ^(Dockerfile|uv\.lock|pyproject\.toml)$
        pass_filenames: false
        stages: [manual]

  - repo: local
    hooks:
      - id: ruff
        name: Lint Python (ruff)
        language: system
        entry: ruff check --fix --unsafe-fixes
        types: [python]
        exclude: "^benchmarks/"

      - id: ruff-format
        name: Format Python (ruff)
        language: system
        entry: ruff format
        types: [python]
        exclude: "^benchmarks/"
