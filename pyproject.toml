[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yadgar"
version = "5.6.1"
description = "Persistent memory engine for Claude Code — heat decay, sleep consolidation, and surprise-gated storage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "maxagahi" },
]
keywords = [
    "mcp",
    "claude",
    "memory",
    "persistent-memory",
    "cognitive-architecture",
    "hopfield-networks",
    "knowledge-graph",
    "neuroscience",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.109.1",
    "sse-starlette>=1.6.0",
    "uvicorn>=0.24.0",
    "mcp>=1.23.0",
    "watchdog>=3.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "ruamel.yaml>=0.18.0",
    "prometheus-client>=0.20.0",
    # CVE-2026-42561 (HIGH): floor so transitive resolution doesn't backslide
    "python-multipart>=0.0.27",
    # CVE-2026-44431, CVE-2026-44432 (HIGH)
    "urllib3>=2.7.0",
    # S3 (H-6): stdlib `re` has no timeout — catastrophic-backtracking (ReDoS) patterns
    # in caller-supplied rules_engine.py regexes would hang indefinitely. The third-party
    # `regex` library is a drop-in stdlib replacement that adds a timeout= kwarg.
    # Option A chosen over AST-checker (incomplete) or subprocess (per-call overhead).
    "regex>=2024.1.0",
]

[project.scripts]
yadgar = "yadgar.__main__:cli"

[project.urls]
Homepage = "https://codeberg.org/maxagahi/yadgar"
Repository = "https://codeberg.org/maxagahi/yadgar"
Issues = "https://codeberg.org/maxagahi/yadgar/issues"

[tool.hatch.build.targets.wheel]
packages = ["yadgar"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["benchmarks/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C901", "PLR0913"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments
    "UP007",  # use X | Y for unions — already done where possible
]

[tool.ruff.lint.per-file-ignores]
# v5.4.3 grandfathering: pre-existing C901/PLR0913 violations that existed before
# b27d218 enabled ruff --select=C901,PLR0913 without grandfathering existing code.
# Each entry is technical debt; refactor target: v5.4.4.
# DO NOT add new entries here — fix violations in new code.
# v5.4.6 LOW-risk batch resolved 2 PLR0913 files + 1 partial:
#   curation/ingestion.py  — insert_new_memory decomposed (params 12→4 via NewMemorySpec)
#   storage/entity.py      — insert_typed_relationship decomposed (params 9→4 via RelationshipMeta)
#   restoration.py         — create_checkpoint decomposed (params 9→3 via CheckpointContext);
#                            PLR0913 removed, C901 remains for _format_restoration + restore
# Remaining entries: MEDIUM/HIGH cyclo violations or MEDIUM PLR0913 (curate_on_remember p=11).
"yadgar/causal_discovery/pc.py" = ["C901"]
"yadgar/cli/daemon.py" = ["C901"]
"yadgar/cli/stats.py" = ["C901"]
"yadgar/cls_store/clustering.py" = ["C901"]
"yadgar/consolidation/cls.py" = ["C901"]
"yadgar/curation/__init__.py" = ["PLR0913"]
"yadgar/curation/prune_passes.py" = ["C901"]
"yadgar/graph_api.py" = ["C901"]
"yadgar/install_hooks_lib.py" = ["C901"]
"yadgar/metacognition/cognitive_load.py" = ["C901"]
"yadgar/metacognition/coverage.py" = ["C901"]
"yadgar/metacognition/gap_detection.py" = ["C901"]
"yadgar/predictive_coding.py" = ["C901"]
"yadgar/restoration.py" = ["C901"]
"yadgar/retrieval/_reranking_heuristic.py" = ["C901"]
"yadgar/retrieval/fusion.py" = ["C901"]
"yadgar/retrieval/query_analysis.py" = ["C901"]
"yadgar/retrieval/reranking.py" = ["C901", "PLR0913"]
"yadgar/retrieval/scoring.py" = ["C901"]
"yadgar/rules_engine.py" = ["C901"]
"yadgar/seed/_generate.py" = ["C901"]
"yadgar/seed/_scan.py" = ["C901"]
"yadgar/server/tools/admin_invariants.py" = ["C901"]
"yadgar/server/tools/admin_other.py" = ["C901"]
"yadgar/server/tools/project.py" = ["C901"]
"yadgar/server/tools/recall.py" = ["C901"]
"yadgar/server/tools/wiki.py" = ["PLR0913"]
"yadgar/tests/test_metacognition.py" = ["PLR0913"]
"yadgar/tests/test_rules_engine.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 15  # I13 hard cap

[tool.ruff.lint.pylint]
max-args = 8  # I13 hard cap (params)

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0",
    # Pin below 1.4 — hf-xet 1.4 deprecates download_files() but huggingface_hub
    # 1.12 still calls it, emitting DeprecationWarning. Revisit when
    # huggingface_hub adopts XetSession (upstream tracking required).
    "hf-xet<1.4",
]
test = [
    # CVE-2025-71176 (MEDIUM)
    "pytest>=9.0.3",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.3",
    "pytest-rerunfailures>=14",
    "hypothesis>=6",
]
dev = [
    "yadgar[test]",
    "ruff>=0.4.0",
    "surrealdb>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["yadgar/tests"]
addopts = "--timeout=120 -n 4 --dist loadgroup --maxprocesses=4 -m 'not integration'"
markers = [
    "xdist_group: group tests that share server module-level globals into one worker",
    "integration: requires docker/podman + spins up live containers (slow, opt-in)",
]
