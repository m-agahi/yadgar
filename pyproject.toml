[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yadgar"
version = "5.72.0"
description = "Persistent memory engine for Claude Code — heat decay, sleep consolidation, and surprise-gated storage"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [
    { name = "maxagahi" },
]
keywords = [
    "mcp",
    "claude",
    "memory",
    "persistent-memory",
    "cognitive-architecture",
    "hopfield-networks",
    "knowledge-graph",
    "neuroscience",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Filesystems",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
]
dependencies = [
    "fastapi>=0.109.1",
    "sse-starlette>=1.6.0",
    "uvicorn>=0.24.0",
    "mcp>=1.23.0",
    "watchdog>=3.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "ruamel.yaml>=0.18.0",
    "prometheus-client>=0.20.0",
    # CVE-2026-42561 (HIGH): floor so transitive resolution doesn't backslide
    "python-multipart>=0.0.27",
    # CVE-2026-44431, CVE-2026-44432 (HIGH)
    "urllib3>=2.7.0",
    # S3 (H-6): stdlib `re` has no timeout — catastrophic-backtracking (ReDoS) patterns
    # in caller-supplied rules_engine.py regexes would hang indefinitely. The third-party
    # `regex` library is a drop-in stdlib replacement that adds a timeout= kwarg.
    # Option A chosen over AST-checker (incomplete) or subprocess (per-call overhead).
    "regex>=2024.1.0",
    # v5.6.3 — distributed tracing (I14-compliant span logs, W3C propagation)
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    # v5.7.6 — OTLP/HTTP span exporter for direct Tempo ingestion (opt-in via YADGAR_OTLP_ENDPOINT)
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    # backend v5.4.0 — msgpack snapshot for LRU cache (CE + embed caches)
    "msgpack>=1.0",
    # v5.10.2 — surrealdb promoted from dev-only to base dep (StorageEngine uses it at runtime)
    "surrealdb>=1.0.0",
]

[project.scripts]
yadgar = "yadgar.__main__:cli"
yadgar-nightly-cycle = "yadgar.scripts.nightly_cycle:main"
yadgar-setup = "yadgar.scripts.yadgar_setup:main"

[project.urls]
Homepage = "https://codeberg.org/maxagahi/yadgar"
Repository = "https://codeberg.org/maxagahi/yadgar"
Issues = "https://codeberg.org/maxagahi/yadgar/issues"

[tool.hatch.build.targets.wheel]
packages = ["yadgar"]

[tool.hatch.build.targets.wheel.shared-data]
# Ship install assets inside the wheel so pipx-installed users can run setup
"install_assets" = "share/yadgar/install_assets"
# v5.46.10 fix: ship ALL scripts/install/ helpers (not just yadgar-setup.sh).
# Previously only yadgar-setup.sh was bundled; helpers it calls were absent,
# breaking pipx installs on fresh hosts since v5.45.0.
# Directory-wide mapping ships helpers + systemd .in templates + launchd/ subdir.
"scripts/install" = "share/yadgar/scripts"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["benchmarks/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C901", "PLR0913"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments
    "UP007",  # use X | Y for unions — already done where possible
]

[tool.ruff.lint.per-file-ignores]
# v5.4.3 grandfathering: pre-existing C901/PLR0913 violations that existed before
# b27d218 enabled ruff --select=C901,PLR0913 without grandfathering existing code.
# Each entry is technical debt; refactor target: v5.4.4.
# DO NOT add new entries here — fix violations in new code.
"yadgar/causal_discovery/pc.py" = ["C901"]
"yadgar/cli/daemon.py" = ["C901"]
"yadgar/cli/stats.py" = ["C901"]
"yadgar/cls_store/clustering.py" = ["C901"]
"yadgar/consolidation/cls.py" = ["C901"]
"yadgar/curation/__init__.py" = ["PLR0913"]
"yadgar/curation/ingestion.py" = ["PLR0913"]
"yadgar/curation/prune_passes.py" = ["C901"]
"yadgar/graph_api.py" = ["C901"]
"yadgar/install_hooks_lib.py" = ["C901"]
"yadgar/metacognition/cognitive_load.py" = ["C901"]
"yadgar/metacognition/coverage.py" = ["C901"]
"yadgar/metacognition/gap_detection.py" = ["C901"]
"yadgar/predictive_coding.py" = ["C901"]
"yadgar/restoration.py" = ["C901", "PLR0913"]
"yadgar/retrieval/_reranking_heuristic.py" = ["C901"]
"yadgar/retrieval/fusion.py" = ["C901"]
"yadgar/retrieval/query_analysis.py" = ["C901"]
"yadgar/retrieval/reranking.py" = ["C901", "PLR0913"]
"yadgar/retrieval/scoring.py" = ["C901"]
"yadgar/rules_engine.py" = ["C901"]
"yadgar/seed/_generate.py" = ["C901"]
"yadgar/seed/_scan.py" = ["C901"]
"yadgar/server/tools/admin_invariants.py" = ["C901"]
"yadgar/server/tools/admin_other.py" = ["C901"]
"yadgar/server/tools/project.py" = ["C901"]
"yadgar/server/tools/recall.py" = ["C901"]
"yadgar/server/tools/wiki.py" = ["PLR0913"]
"yadgar/storage/entity.py" = ["PLR0913"]
"yadgar/tests/test_metacognition.py" = ["PLR0913"]
"yadgar/tests/test_rules_engine.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 15  # I13 hard cap

[tool.ruff.lint.pylint]
max-args = 8  # I13 hard cap (params)

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0",
    # Pin below 1.4 — hf-xet 1.4 deprecates download_files() but huggingface_hub
    # 1.12 still calls it, emitting DeprecationWarning. Revisit when
    # huggingface_hub adopts XetSession (upstream tracking required).
    "hf-xet<1.4",
]
test = [
    # CVE-2025-71176 (MEDIUM)
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "coverage>=7.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.3",
    "pytest-rerunfailures>=14",
    "hypothesis>=6",
    # v5.45.1 — safe XML parsing in tests (plist validation); defends against XXE
    # even though we only parse our own generated output (defence-in-depth)
    "defusedxml>=0.7.1",
    # v5.46.3 — B7 fix: async test support; asyncio_mode=auto in ini_options removes
    # per-test @pytest.mark.asyncio noise (pytest-asyncio 1.4.0 = latest stable 2026-06-05)
    "pytest-asyncio>=1.4.0",
    "anyio>=4.0",
    # v5.59 — parallel chunk splitting for CI matrix (ci-pr.yaml --splits/--group)
    "pytest-split>=0.9.0",
]
dev = [
    "yadgar[test]",
    "ruff>=0.4.0",
]
# Distribution tooling: SBOM generation via CycloneDX (cyclonedx-py is an alias; use cyclonedx-bom directly)
# Pin exact version — OWASP supply-chain; no auto-upgrade without review.
# cyclonedx-bom==7.3.0 resolved 2026-06-05 as latest stable.
dist = [
    "cyclonedx-bom==7.3.0",
]
sbom = [
    "cyclonedx-bom==7.3.0",
]

[tool.pytest.ini_options]
testpaths = ["yadgar/tests"]
# --timeout=120 removed; per-session default now comes from `timeout = 300` below.
addopts = "-n 4 --dist loadgroup --maxprocesses=4 -m 'not integration and not e2e'"
# Suppress INFO-level noise in test output; WARNING/ERROR still visible on failure.
log_level = "WARNING"
# pytest-timeout defaults — override per-test with @pytest.mark.timeout(N).
# timeout_method=signal (SIGALRM) can interrupt deadlocked / hung C-extension
# tests that the thread method cannot — a thread-method hang once ran 9.7h
# pegging all cores because the 300s timeout could not kill the stuck test.
# Signal method fires reliably per xdist worker process. (Belt-and-suspenders:
# scripts/reap-stale-tests.timer hard-kills any test proc older than 90min.)
timeout = 300
timeout_method = "signal"
timeout_func_only = false
markers = [
    "xdist_group: group tests that share server module-level globals into one worker",
    "integration: requires docker/podman + spins up live containers (slow, opt-in)",
    "e2e: behavior-contract end-to-end tests against a real local SurrealDB (run via make e2e; excluded from CI)",
]
# v5.46.3 — B7 fix: auto mode avoids per-test @pytest.mark.asyncio decoration noise
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]
