[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yadgar"
version = "5.181.50"
description = "Persistent memory engine for Claude Code — heat decay, sleep consolidation, and surprise-gated storage"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [
    { name = "m-agahi" },
]
keywords = [
    "mcp",
    "claude",
    "memory",
    "persistent-memory",
    "cognitive-architecture",
    "hopfield-networks",
    "knowledge-graph",
    "neuroscience",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Filesystems",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
]
dependencies = [
    "fastapi>=0.109.1",
    "sse-starlette>=1.6.0",
    "uvicorn>=0.24.0",
    "mcp>=2.0.0",
    "watchdog>=3.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "ruamel.yaml>=0.18.0",
    "prometheus-client>=0.20.0",
    # CVE-2026-42561 (HIGH): floor so transitive resolution doesn't backslide
    "python-multipart>=0.0.27",
    # CVE-2026-44431, CVE-2026-44432 (HIGH)
    "urllib3>=2.7.0",
    # S3 (H-6): stdlib `re` has no timeout — catastrophic-backtracking (ReDoS) patterns
    # in caller-supplied rules_engine.py regexes would hang indefinitely. The third-party
    # `regex` library is a drop-in stdlib replacement that adds a timeout= kwarg.
    # Option A chosen over AST-checker (incomplete) or subprocess (per-call overhead).
    "regex>=2024.1.0",
    # v5.6.3 — distributed tracing (I14-compliant span logs, W3C propagation)
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    # v5.7.6 — OTLP/HTTP span exporter for direct Tempo ingestion (opt-in via YADGAR_OTLP_ENDPOINT)
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    # backend v5.4.0 — msgpack snapshot for LRU cache (CE + embed caches)
    "msgpack>=1.0",
    # v5.10.2 — surrealdb promoted from dev-only to base dep (StorageEngine uses it at runtime)
    "surrealdb>=1.0.0",
    # multi-client framework (Car 0) — format-preserving TOML merge for the Codex
    # config.toml MCP-registration target (preserves user comments + key order).
    "tomlkit>=0.13",
]

[project.scripts]
yadgar = "yadgar.__main__:cli"
yadgar-nightly-cycle = "yadgar.core.scripts.nightly_cycle:main"
yadgar-setup = "yadgar.core.scripts.yadgar_setup:main"

[project.urls]
Homepage = "https://github.com/m-agahi/yadgar"
Repository = "https://github.com/m-agahi/yadgar"
Issues = "https://github.com/m-agahi/yadgar/issues"

[tool.hatch.build.targets.wheel]
packages = ["yadgar"]

[tool.hatch.build.targets.wheel.shared-data]
# Ship install assets inside the wheel so pipx-installed users can run setup
"install_assets" = "share/yadgar/install_assets"
# v5.88 seed consolidation: anchors.yaml moved to the canonical seed materials dir
# (folder-split #17 Car 4a: yadgar/core/seed/materials/) so all seed CONTENT is
# edited in one place. It still ships at the historical share/ destination so the
# install script + wheel-bundle test are unchanged. (agent_prompts.yaml needs no
# mapping — it ships as package data under the yadgar/ tree automatically.)
"yadgar/core/seed/materials/anchors.yaml" = "share/yadgar/install_assets/seeds/anchors.yaml"
# v5.46.10 fix: ship ALL scripts/install/ helpers (not just yadgar-setup.sh).
# Previously only yadgar-setup.sh was bundled; helpers it calls were absent,
# breaking pipx installs on fresh hosts since v5.45.0.
# Directory-wide mapping ships helpers + systemd .in templates + launchd/ subdir.
"scripts/install" = "share/yadgar/scripts"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["benchmarks/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C901", "PLR0913"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments
    "UP007",  # use X | Y for unions — already done where possible
]

[tool.ruff.lint.per-file-ignores]
# v5.4.3 grandfathering: pre-existing C901/PLR0913 violations that existed before
# b27d218 enabled ruff --select=C901,PLR0913 without grandfathering existing code.
# Each entry is technical debt; refactor target: v5.4.4.
# DO NOT add new entries here — fix violations in new code.
"yadgar/backend/causal_discovery/pc.py" = ["C901"]
"yadgar/core/cli/daemon.py" = ["C901"]
"yadgar/core/cli/stats.py" = ["C901"]
"yadgar/backend/cls_store/clustering.py" = ["C901"]
"yadgar/backend/consolidation/cls.py" = ["C901"]
"yadgar/backend/curation/__init__.py" = ["PLR0913"]
"yadgar/backend/curation/ingestion.py" = ["PLR0913"]
"yadgar/backend/curation/prune_passes.py" = ["C901"]
"yadgar/_shared/metacognition/cognitive_load.py" = ["C901"]
"yadgar/_shared/metacognition/coverage.py" = ["C901"]
"yadgar/_shared/metacognition/gap_detection.py" = ["C901"]
"yadgar/backend/restoration/checkpoint_restore.py" = ["C901", "PLR0913"]
"yadgar/_shared/retrieval/_reranking_heuristic.py" = ["C901"]
"yadgar/_shared/retrieval/fusion.py" = ["C901"]
"yadgar/_shared/retrieval/query_analysis.py" = ["C901"]
"yadgar/_shared/retrieval/reranking.py" = ["C901", "PLR0913"]
"yadgar/_shared/retrieval/scoring.py" = ["C901"]
"yadgar/_shared/rules_engine/rules_engine.py" = ["C901"]
"yadgar/core/seed/_generate.py" = ["C901"]
"yadgar/core/seed/_scan.py" = ["C901"]
"yadgar/core/server/tools/admin_invariants.py" = ["C901"]
"yadgar/core/server/tools/admin_other.py" = ["C901"]
"yadgar/core/server/tools/project.py" = ["C901"]
"yadgar/core/server/tools/recall.py" = ["C901"]
"yadgar/core/server/tools/wiki.py" = ["PLR0913"]
"yadgar/_shared/storage/entity.py" = ["PLR0913"]
"yadgar/tests/_shared/test_metacognition.py" = ["PLR0913"]
"yadgar/tests/_shared/test_rules_engine.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 15  # I13 hard cap

[tool.ruff.lint.pylint]
max-args = 8  # I13 hard cap (params)

# ---------------------------------------------------------------------------
# Strict-typing enforcement (two arms, deliberately asymmetric)
#
# Arm 1 — THIS SECTION: an opt-in allowlist runs `strict = true`, so a
#   subsystem is strict from its FIRST commit. Add a module when you START it;
#   retrofitting strict onto a grown module never happens.
# Arm 2 — scripts/check_type_ratchet.py: a file you TOUCH may not gain type
#   errors versus .mypy-ratchet-baseline.json. Legacy code keeps its errors,
#   it just cannot accumulate more.
#
# The tree-wide default below is PERMISSIVE ON PURPOSE. ~306k lines across
# ~1129 modules predate any type checker (task 0116); a blanket strict gate
# emits thousands of errors on day one and gets switched off within a week.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "silent"
# The ratchet reports per-file counts, so mypy's own summary is noise.
show_error_codes = true
# Override sections for not-yet-created modules must not warn.
warn_unused_configs = false

[[tool.mypy.overrides]]
# STRICT ALLOWLIST — append here as each new subsystem lands. Intentionally
# empty at introduction: naming a module that does not exist yet would read as
# a decision already implemented. The spine rebuild (task 0047) is the first
# customer and adds its modules in the same commit that creates them.
module = []
strict = true

[project.optional-dependencies]
ml = [
    # [onnx] extra REMOVED (5.131.0 deps train): the resolver routes it through
    # optimum-onnx, whose latest release (0.1.0) caps transformers<4.58.0 —
    # unsatisfiable with the transformers>=5.0 floor below. The dormant
    # GTE_RERANKER_BACKEND=onnx-int8 path was removed with it (plan Q8: no
    # half-drop). Re-adding ONNX reranking needs an optimum-onnx release that
    # supports transformers 5.x.
    # Cap <5.5: HELD at 5.4.x (plan Q6) — the blanket 5.131.0 re-lock floated st
    # to 5.6.0; 5.4.1 already spans transformers 4.x/5.x and carries the
    # CrossEncoder modular arch Ettin needs. Revisit on the next deps train.
    "sentence-transformers>=2.2.0,<5.5",
    # Cap raised <1.4 -> <2.0 (5.131.0 deps train): huggingface_hub 1.x REQUIRES
    # hf-xet>=1.5.1 (hub's own ceiling is <2.0), so the old cap hard-blocked the
    # transformers-5.x resolve. The old cap's reason (old-hub download_files()
    # DeprecationWarning) dissolved at hub >=1.5 (hub adopted XetSession).
    "hf-xet<2.0",
    # Ettin rerankers (T4) declare tokenizer_class=TokenizersBackend —
    # transformers 5.x only. Explicit floor prevents a future re-lock silently
    # backsliding under sentence-transformers' wide <6.0.0 bound.
    "transformers>=5.0",
]
# Engine #2 (ADR-0195): the relational set lives in MariaDB, served by the
# BACKEND container only. Deliberately an EXTRA, not a base dependency:
#   * `asyncmy` is a COMPILED (Cython) driver. In base deps every pipx / pip
#     install of the core package would need a wheel for the running
#     interpreter — or a C toolchain to build one. Install is this repo's worst
#     surface (ADR-0195 consequences); adding a compile step to it for a driver
#     core never opens is the wrong trade.
#   * Core has ZERO engine-#2 access by design (ADR-0195 / ADR-0200: core
#     forwards to backend admin ops), so the driver is backend-only in exactly
#     the way the `ml` extra above is backend-only.
# `sqlalchemy` + `alembic` travel with it: alembic is the migration arm this
# split buys (ADR-0195 rationale — it moots task 0051's surrealmigrate fork),
# and alembic depends on sqlalchemy regardless.
# NOTE: the yadgar-ci image bakes `--extra test --extra ml` (Dockerfile.ci:116)
# and has no auto-sync pipeline — it must be rebuilt with `--extra sql` before
# any test may import these.
sql = [
    "asyncmy>=0.2.11",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
test = [
    # starlette 1.3.x testclient prefers httpx2 (`import httpx2 as httpx`) and
    # emits StarletteDeprecationWarning when only plain httpx is installed —
    # fatal under the zero-warning gate (ADR-0087). Prod code stays on plain
    # httpx; httpx2 is the testclient's transport only. (5.131.0 deps train.)
    "httpx2>=2.0.0",
    # CVE-2025-71176 (MEDIUM)
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "coverage>=7.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.3",
    "pytest-rerunfailures>=14",
    "hypothesis>=6",
    # v5.45.1 — safe XML parsing in tests (plist validation); defends against XXE
    # even though we only parse our own generated output (defence-in-depth)
    "defusedxml>=0.7.1",
    # v5.46.3 — B7 fix: async test support; asyncio_mode=auto in ini_options removes
    # per-test @pytest.mark.asyncio noise (pytest-asyncio 1.4.0 = latest stable 2026-06-05)
    "pytest-asyncio>=1.4.0",
    "anyio>=4.0",
    # v5.59 — parallel chunk splitting for CI matrix (ci-pr.yaml --splits/--group)
    "pytest-split>=0.9.0",
]
dev = [
    "yadgar[test]",
    "ruff>=0.4.0",
    # Type checker for the strict-typing ratchet (scripts/check_type_ratchet.py).
    # Ruff CANNOT type-check — it lints. Annotations without a checker enforce
    # NOTHING (task 0116), which is how the three severe coupling defects in the
    # 203-defect audit shipped as untyped dict/positional passing.
    "mypy>=1.11",
]
# Distribution tooling: SBOM generation via CycloneDX (cyclonedx-py is an alias; use cyclonedx-bom directly)
# Pin exact version — OWASP supply-chain; no auto-upgrade without review.
# cyclonedx-bom==7.3.0 resolved 2026-06-05 as latest stable.
dist = [
    "cyclonedx-bom==7.3.0",
]
sbom = [
    "cyclonedx-bom==7.3.0",
]

[tool.pytest.ini_options]
testpaths = ["yadgar/tests"]
# --timeout=120 removed; per-session default now comes from `timeout = 300` below.
addopts = "-n 4 --dist loadgroup --maxprocesses=4 -m 'not integration and not e2e'"
# Suppress INFO-level noise in test output; WARNING/ERROR still visible on failure.
log_level = "WARNING"
# pytest-timeout defaults — override per-test with @pytest.mark.timeout(N).
# timeout_method=signal (SIGALRM) can interrupt deadlocked / hung C-extension
# tests that the thread method cannot — a thread-method hang once ran 9.7h
# pegging all cores because the 300s timeout could not kill the stuck test.
# Signal method fires reliably per xdist worker process. (Belt-and-suspenders:
# scripts/reap-stale-tests.timer hard-kills any test proc older than 90min.)
timeout = 300
timeout_method = "signal"
timeout_func_only = false
markers = [
    "xdist_group: group tests that share server module-level globals into one worker",
    "integration: requires docker/podman + spins up live containers (slow, opt-in)",
    "e2e: behavior-contract end-to-end tests against a real local SurrealDB (run via make e2e; excluded from CI)",
    "perf: timing-sensitive perf guard; run SERIALLY only (unreliable under xdist CPU contention) — dedicated test-perf job",
]
# v5.46.3 — B7 fix: auto mode avoids per-test @pytest.mark.asyncio decoration noise
asyncio_mode = "auto"
# ── Zero-warning gate (hardening train Car 3, ADR-0087) ──────────────────────
# Warnings are test failures permanently. Every ignore below is a NARROW,
# message-pinned third-party exception with a revisit note — never add a bare
# category-wide ignore. First-party warnings get FIXED, not ignored.
filterwarnings = [
    "error",
    # torch emits this on Python 3.14 when sentence-transformers loads TorchScript
    # modules. Third-party; nothing actionable on our side. REVISIT: drop when a
    # torch release supports py3.14 TorchScript or sentence-transformers stops
    # using torch.jit (check on each torch bump in uv.lock).
    "ignore:`torch\\.jit\\.script_method` is not supported in Python 3\\.14:DeprecationWarning",
    # uvicorn's websockets protocol imports websockets.legacy at import time
    # (deprecated since websockets 14.0). Third-party import chain — fires in any
    # test that pulls in uvicorn's websockets impl. REVISIT: drop when uvicorn
    # migrates off websockets.legacy (check uvicorn changelog on next bump).
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    # Same uvicorn import chain: websockets.server.WebSocketServerProtocol is a
    # deprecated alias. REVISIT: same trigger as above (next uvicorn bump).
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    # import-linter: core/backend/_shared boundary enforcement (folder-split #17).
    # ENFORCING: the contracts below run as the blocking `lint-imports`
    # pre-commit hook (.pre-commit-config.yaml) on every commit.
    "import-linter>=2.0",
]

# ── import-linter (folder-split #17) ─────────────────────────────────────────
# ENFORCING (T2 Car F fixed this stale Car-0 comment): the contracts below are
# wired into pre-commit as the blocking `lint-imports` hook
# (.pre-commit-config.yaml, "Enforce layer boundaries") — every commit must
# keep 4/4 contracts. Run manually with `uv run lint-imports`.
[tool.importlinter]
root_package = "yadgar"

[[tool.importlinter.contracts]]
name = "shared must not import core or backend"
type = "forbidden"
source_modules = ["yadgar._shared"]
forbidden_modules = ["yadgar.core", "yadgar.backend"]
# Car 2 (folder-split #17): the sole sanctioned _shared→backend edge is the
# COMPOSITION ROOT. lifecycle.init_engines must name the concrete Local/Remote
# ML client + the backend cache singletons to SELECT and INJECT them (that is
# what DI is — the edge exists *because* of DI, not despite it). Both concretes
# physically live in yadgar/backend/, so this cannot be dissolved while the
# composition root lives in _shared; pushing selection to callers only relocates
# the same backend import (a core→backend edge, equally forbidden). Splitting
# ml_client.py by consumer is Car 3 scope. This is a PERMANENT waiver for Car 2,
# NOT a shrinking migration allowance. All CONSUMER edges (reranking, storage,
# log_config) are clean — they receive injected Protocol handles.
ignore_imports = [
  "yadgar._shared.runtime.lifecycle -> yadgar.backend.ml_client",
  "yadgar._shared.runtime.lifecycle -> yadgar.backend.cache",
]

[[tool.importlinter.contracts]]
name = "backend must not import core"
type = "forbidden"
source_modules = ["yadgar.backend"]
forbidden_modules = ["yadgar.core"]
# R2a Car D2: the composition-root transitive chain (backend -> _shared.runtime ->
# core) is GONE — _shared.runtime.lifecycle now imports ZERO core. No waiver needed.

[[tool.importlinter.contracts]]
name = "core and backend must not import each other's internals"
type = "forbidden"
source_modules = ["yadgar.core"]
forbidden_modules = ["yadgar.backend"]
# Composition-root waiver (folder-split #17, ADR-0056). core reaches backend
# ONLY transitively through the DI composition root
# (core.* -> _shared.runtime.lifecycle -> backend.ml_client/backend.cache).
# lifecycle.init_engines must name the concrete Local/Remote ML client + backend
# cache singletons to SELECT and INJECT them — that is the composition root, and
# the concretes physically live in yadgar/backend/. Ignoring the sanctioned
# lifecycle->backend edges here (same 2 edges waived on contract 1) removes the
# transitive chain. All direct core->backend edges (e.g. admin_other) are FIXED,
# not waived.
ignore_imports = [
  "yadgar._shared.runtime.lifecycle -> yadgar.backend.ml_client",
  "yadgar._shared.runtime.lifecycle -> yadgar.backend.cache",
]

[[tool.importlinter.contracts]]
name = "layered: core|backend -> _shared"
type = "layers"
layers = ["core | backend", "_shared"]
containers = ["yadgar"]
# Composition-root waiver (folder-split #17, ADR-0056). The layers contract
# forbids _shared -> backend, but the DI composition root
# (_shared.runtime.lifecycle) must name the concrete backend ML client + cache to
# inject them. Same sanctioned edges waived on contracts 1 and 3. This is a
# PERMANENT structural waiver, not a shrinking migration allowance.
ignore_imports = [
  "yadgar._shared.runtime.lifecycle -> yadgar.backend.ml_client",
  "yadgar._shared.runtime.lifecycle -> yadgar.backend.cache",
]
