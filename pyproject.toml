[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yadgar"
version = "4.0.0"
description = "Persistent memory engine for Claude Code — heat decay, sleep consolidation, and surprise-gated storage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "maxagahi" },
]
keywords = [
    "mcp",
    "claude",
    "memory",
    "persistent-memory",
    "cognitive-architecture",
    "hopfield-networks",
    "knowledge-graph",
    "neuroscience",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.109.1",
    "sse-starlette>=1.6.0",
    "uvicorn>=0.24.0",
    "mcp>=1.23.0",
    "watchdog>=3.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "ruamel.yaml>=0.18.0",
]

[project.scripts]
yadgar = "yadgar.__main__:cli"

[project.urls]
Homepage = "https://codeberg.org/maxagahi/yadgar"
Repository = "https://codeberg.org/maxagahi/yadgar"
Issues = "https://codeberg.org/maxagahi/yadgar/issues"

[tool.hatch.build.targets.wheel]
packages = ["yadgar"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["benchmarks/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments
    "UP007",  # use X | Y for unions — already done where possible
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0",
]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.3",
]
dev = [
    "yadgar[test]",
    "ruff>=0.4.0",
    "surrealdb>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["yadgar/tests"]
addopts = "--timeout=300"
