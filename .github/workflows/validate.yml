name: Validate

on:
  pull_request:
    branches: [master]
    # opened+synchronize: `reopened`/`edited` caused duplicate runs when a push
    # (synchronize) landed close to a PR body/title edit — two pull_request
    # events for the same commit, both matching this workflow. Narrowing to
    # synchronize-only (2026-07-27) over-corrected: it silently gave brand-new
    # PRs ZERO Validate coverage until their first follow-up push (confirmed
    # live on PR #8 — opened event never matched, no run ever queued). The
    # concurrency group below already cancels a superseded run on the same
    # ref, which is what actually prevents the near-simultaneous duplicate —
    # dropping `opened` was not the fix. ci-pr.yml has no `types:` override
    # (defaults to {opened, synchronize, reopened}, no `edited`) and never had
    # this problem. Cost of still dropping `edited`: a bad PR title/body isn't
    # re-validated if fixed after the last push with no new commit; accepted
    # tradeoff.
    types: [opened, synchronize]

# Cancel superseded runs on the same PR branch (rapid push storms).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Self-hosted runner + yadgar-ci image (matches the rest of the
    # GitHub workflows; avoids GitHub-hosted runner minutes). The
    # yadgar-ci image already has: python 3.14 + apt deps (make, git,
    # curl, ca-certificates, build-essential, gpg, nodejs 22 from
    # NodeSource, bsdmainutils, graphviz) + SurrealDB binary + HF model
    # weights + gitleaks v8.30.1 baked in. So this job only needs to
    # pip install the Python tooling (pre-commit + uv + import-linter)
    # and editable-install yadgar itself.
    runs-on: [self-hosted, linux, x64, yadgar]
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_metadata.py

      - name: Install pre-commit and uv
        # uv: required by pre-commit check-config-three-way-sync hook
        # (entry: uv run python -m pytest yadgar/tests/test_config_three_way_sync.py).
        # import-linter + editable yadgar: the import-linter hook (language: system,
        # entry: lint-imports) needs the executable on PATH AND the yadgar package
        # locatable — grimp parses the AST, so --no-deps is enough (no runtime deps).
        # (folder-split #17: without this the hook aborts "Executable lint-imports not found".)
        # NOTE: ruff is pre-baked in the yadgar-ci image (system dep from the
        # apt install line). gitleaks is pre-baked too (CAR-of-self-hosted-runner
        # migration). nodejs 22 from NodeSource is pre-baked. So this pip install
        # is only for the Python-side tools the pre-commit hooks call as
        # `language: system` entries.
        run: |
          pip install pre-commit uv import-linter
          pip install -e . --no-deps

      - name: Run pre-commit
        run: |
          # GHA checks out as a different UID than the container's root user →
          # git refuses with "dubious ownership"; pre-commit surfaces it as
          # "git failed. Is it installed…". Mark the workspace safe.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pre-commit run --all-files
