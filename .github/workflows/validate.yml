name: Validate

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

# Cancel superseded runs on the same PR branch (rapid push storms).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: Install Node.js, git, gitleaks, and ruff
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends nodejs git curl ca-certificates
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          pip install --no-cache-dir ruff==0.15.10

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_metadata.py

      - name: Install pre-commit and uv
        # uv: required by pre-commit check-config-three-way-sync hook
        # (entry: uv run python -m pytest yadgar/tests/test_config_three_way_sync.py).
        # import-linter + editable yadgar: the import-linter hook (language: system,
        # entry: lint-imports) needs the executable on PATH AND the yadgar package
        # locatable — grimp parses the AST, so --no-deps is enough (no runtime deps).
        # (folder-split #17: without this the hook aborts "Executable lint-imports not found".)
        run: |
          pip install pre-commit uv import-linter
          pip install -e . --no-deps

      - name: Run pre-commit
        run: |
          # GHA checks out as a different UID than the container's root user →
          # git refuses with "dubious ownership"; pre-commit surfaces it as
          # "git failed. Is it installed…". Mark the workspace safe.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pre-commit run --all-files
