name: CI (PR)

on:
  pull_request:
    branches: [master]
    # Docs-only changes skip CI (docs go direct to master, no PR). Workflow-only
    # changes skip too — the test suite doesn't validate workflow YAML; validate.yml
    # (yaml/actionlint) still runs on .github edits as the safety net. Skips a run
    # only when EVERY changed path matches — mixed code+docs/ci PRs still run.
    paths-ignore:
      - 'benchmarks/**'
      - 'docs/**'
      - '.forgejo/**'
      - '.github/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'flake.nix'
      - 'flake.lock'
      - 'MIGRATION_NOTES.md'
      - '.gitignore'
  # Master baseline — ON DEMAND ONLY. There is no cron here on purpose.
  #
  # A nightly `schedule:` used to live at this spot. It was never asked for,
  # and the runner is the OWNER'S LAPTOP: a single self-hosted box. The cron
  # fired at 03:17 UTC, GitHub's scheduler delivered it up to an hour late,
  # and a ~60-90 min full suite then saturated the machine during working
  # hours — four SurrealDB instances at ~73% CPU each, load average ~5.7,
  # discovered only because the laptop got slow.
  #
  # The baseline it produced is genuinely useful for A/B-ing a PR's failures
  # against master, so the capability stays — but it runs when a human asks
  # for it, not on a timer against someone else's hardware. Trigger it from
  # the Actions tab, or: gh workflow run 'CI (PR)' --ref master
  #
  # Do not re-add `schedule:` without the repo owner explicitly asking.
  workflow_dispatch:

# Cancel superseded test runs on a fresh push to the same PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# YADGAR_TEST_SKIP_RUNTIME_CHECK: skip container-runtime detection in Makefile
# pre-setup target when podman/docker is absent in CI runner (P8 fix v5.46.7).
env:
  YADGAR_TEST_SKIP_RUNTIME_CHECK: "1"

# ── TUNING KNOBS (Actions repository variables) ──────────────────────────────
#
# These are the resource dials. They are repo VARIABLES so that tuning them —
# after adding a runner, or resizing the box — is a Settings change, not a PR.
# Every one carries an explicit default equal to today's measured-safe value,
# so an UNSET variable reproduces current behaviour exactly. None of them may
# default to "unlimited": an unbounded default is precisely the 2026-07-09 OOM.
#
#   CI_RUNS_ON          default ["self-hosted","linux","x64","yadgar"]
#                       JSON array of runner labels, applied to EVERY job in
#                       this workflow so one variable moves the whole thing.
#   CI_MAX_PARALLEL     default 2
#                       Max concurrent `tests` matrix groups. This IS the
#                       2026-07-09 OOM protection (ADR-0073's measured ceiling
#                       of two concurrent heavy legs), moved off the `needs:`
#                       chain that used to fake it. Raise when runners are added.
#   CI_PYTEST_WORKERS   default 4
#                       pytest-xdist `-n` per group. NEVER set this to `auto`:
#                       /proc/meminfo reports HOST RAM inside the cgroup-limited
#                       runner, so `auto` spawns a worker per host core and each
#                       worker carries a SurrealDB child + the embedding model
#                       (ADR-0070 — this is what exit-137'd the legs).
#
# CI_MAX_PARALLEL IS A GITHUB-ONLY KNOB. The Forgejo mirror carries a LITERAL
# `max-parallel: 2` and must be edited by PR, because act_runner parses that key
# with a bare strconv.Atoi before evaluating expressions: an expression there is
# not rejected, it silently falls back to act's default of 4 — double this
# ceiling, on the only runner that actually runs jobs concurrently. Change both
# together. See the comment on that job in .forgejo/workflows/ci-pr.yaml.
#
# WHAT BREAKS IF YOU FLIP CI_RUNS_ON TO A GITHUB-HOSTED RUNNER. The knob exists
# so the switch is possible; the switch itself is NOT verified, and these are
# the known landmines rather than an exhaustive list:
#   1. scripts/test-capped.sh enforces TEST_MEM_MAX via `systemd-run --user
#      --scope`. It FAILS CLOSED (exit 3) when no user-scope systemd exists
#      rather than silently running uncapped — so on a hosted runner it refuses
#      until TEST_ALLOW_UNCAPPED=1 is set explicitly. Note this affects
#      `make ci-local` only: the jobs below invoke pytest directly and never go
#      through test-capped.sh, so TEST_MEM_MAX is a LOCAL knob and deliberately
#      is not a variable here — a `vars.`-backed TEST_MEM_MAX in this file would
#      read impressively and change nothing.
#   2. test-engine2-integration runs bare on the host and needs a WORKING
#      container runtime. Hosted Ubuntu has docker but not podman; car G5's
#      select_container_runtime() probes function rather than presence, so it
#      may well work — unverified there.
#   3. ubuntu-latest is 4 vCPU / 16 GB. The 20G TEST_MEM_MAX default is wrong
#      for it; set TEST_MEM_MAX=12G alongside the runner switch, and expect
#      CI_PYTEST_WORKERS=4 to be at or over the line on 4 vCPU.
#   4. This repository is private, so hosted minutes are BILLED. A full
#      serialized suite is ~90-115 minutes of runner time per PR.

jobs:
  # ── Test groups (Car J1: module groups, not a fake dependency chain) ─────────
  #
  # WHAT CHANGED AND WHY. Until Car J1 the four test jobs were chained with
  # `needs:` — and the workflow's own comments admitted the chain was not a
  # dependency ("scheduling throttle only (RAM waves, ADR-0073/0079)"). It
  # existed because the host OOM'd on 2026-07-09 with three concurrent heavy
  # legs. That expressed a RESOURCE constraint with a DEPENDENCY primitive:
  # the rendered graph implied an ordering that does not exist, and a failure
  # in an early leg delayed every leg behind it for no reason.
  #
  # The concurrency cap now lives on `max-parallel`, the primitive that
  # actually means "at most N of these at once". The OOM protection is NOT
  # dropped — see the knob block at the top of this file: the default is 2,
  # the same ceiling ADR-0073 measured, and `-n` stays capped per leg because
  # `-n auto` reads the HOST /proc/meminfo rather than the cgroup limit and
  # oversubscribes (ADR-0070).
  #
  # ONE RUNNER TODAY. `gh api repos/m-agahi/yadgar/actions/runners` reports
  # exactly one self-hosted runner (gh-runner-r1), and a self-hosted runner
  # takes one job at a time — so on GitHub every group already serialises and
  # `max-parallel` is inert until a second runner is registered. It is NOT
  # inert on the Forgejo mirror: that runner's config.yaml carries
  # `capacity: 2`, so two jobs really do run concurrently there and this cap
  # is the thing holding the 2026-07-09 ceiling.
  #
  # THE GROUPS ARE MODULE-SCOPED WHERE THE TREE ALLOWS IT. Five of the six
  # groups are a real module boundary (the old `fast` job was a bucket of five
  # unrelated directories; it is now three groups that each name what they
  # test). `core` is the exception and is labelled honestly: yadgar/tests/core/
  # is a FLAT directory of 242 test files with no subpackages (only fixtures/
  # and snapshots/), so it admits no module boundary to split on — it is
  # duration-sharded via pytest-split instead, and the group names say `core-N`
  # rather than pretending to be subsystems.
  #
  # Shard count is now a free parameter: it was cut 3→2 purely for RAM
  # (ADR-0073's per-wave leg ceiling), and `max-parallel` bounds that
  # independently of how many groups exist. It is left at 2 here because that
  # is the measured-safe value; raising it costs one job's setup overhead and
  # buys finer failure isolation.
  #
  # Anti-drift: scripts/ci_group_manifest.py parses the matrix below and is the
  # single source of truth for the group list. check-skip-inventory derives its
  # expected artifact count from it (never a hardcoded number), and
  # scripts/check_ci_local_parity.py pins `make ci-local`'s legs against it.
  tests:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","yadgar"]') }}
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_XET: '1'
      HF_HOME: ${{ vars.HF_HOME }}
      YADGAR_OTLP_ENDPOINT: ''
    strategy:
      # fail-fast: false — a failure in one group must not cancel its siblings.
      # Cancelling destroys the information the split exists to produce: which
      # subsystems are broken, not merely that one of them is.
      fail-fast: false
      # THE RAM CAP. This is the 2026-07-09 OOM protection, re-expressed with
      # the primitive that means it. Default 2 = ADR-0073's measured ceiling of
      # two concurrent heavy legs. Raise CI_MAX_PARALLEL when runners are added.
      max-parallel: ${{ fromJSON(vars.CI_MAX_PARALLEL || '2') }}
      matrix:
        include:
          # scripts/ — the repo's own CI guards (check_*.py) and their tests.
          - group: repo-guards
            paths: yadgar/tests/scripts/
          # server/ — MCP tool surface, HTTP routes, config three-way sync.
          - group: server-api
            paths: yadgar/tests/server/
          # The small client-facing surfaces, grouped because each is minutes
          # of setup overhead for seconds of tests. restoration/ is HERE
          # deliberately: before Car J1 it was in NO CI job at all — one test
          # file that had never run in CI.
          - group: client-surfaces
            paths: yadgar/tests/hooks/ yadgar/tests/clients/ yadgar/tests/_meta/ yadgar/tests/restoration/
          # _shared/ — the storage engines (SurrealDB + engine #2 / MariaDB
          # offline arms) and the shared recall/retrieval layer. Not split
          # surreal-vs-sql: only 7 of its 95 files are engine-#2 files, which
          # is not worth a job's setup cost.
          - group: shared-storage
            paths: yadgar/tests/_shared/
          # backend/ — consolidation, retrieval, embed_service, admin_exec.
          - group: backend-services
            paths: yadgar/tests/backend/
          # core/ — FLAT, 242 files, no subpackages: duration-sharded, not
          # module-scoped. .test_durations is committed at the repo root.
          - group: core-1
            paths: yadgar/tests/core/
            split: --splits 2 --group 1 --splitting-algorithm least_duration
          - group: core-2
            paths: yadgar/tests/core/
            split: --splits 2 --group 2 --splitting-algorithm least_duration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trust workspace (container runs as a different UID than checkout)
        run: git config --global --add safe.directory '*'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /root/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-

      - name: Install dependencies
        # Deps are BAKED into yadgar-ci FROM uv.lock (lock parity — ADR-0089).
        # --no-deps installs only the yadgar package itself; nothing re-resolves
        # at run time, so CI cannot drift past the lock. Missing dep = rebuild
        # the image (fail-loud by design).
        run: |
          uv pip install --system --no-deps -e .

      - name: Assert this group selects tests (zero selection is a silent pass)
        # A mistyped path or an over-narrow marker makes a group collect nothing
        # and still exit green — the "reported success while skipping all 41 of
        # its tests" shape this repo keeps rediscovering. Collect first, refuse
        # to proceed on zero. Runs with -n 0 so the count is pytest's own, not
        # an xdist-sharded subset.
        # TWO INDEPENDENT SIGNALS, deliberately. Resting the gate on a single
        # text parse would make a summary-format change silently disarm it.
        #   (a) pytest's own exit code: 5 = "no tests collected", 4 = usage/path
        #       error. Both are captured explicitly rather than swallowed.
        #   (b) the parsed count from the summary line.
        # Either one failing fails the step. Verified locally against all three
        # real summary shapes: "52 tests collected in 0.32s";
        # "1775/3564 tests collected (1789 deselected) in 4.91s" (the sharded
        # core groups); and "no tests collected (38 deselected)" — the last
        # yields an EMPTY parse, which the -z branch treats as failure.
        run: |
          set -o pipefail
          rc=0
          python -m pytest ${{ matrix.paths }} ${{ matrix.split }} \
            -m 'not integration and not e2e and not perf' \
            -n 0 -q --collect-only > collect-${{ matrix.group }}.txt 2>&1 || rc=$?
          collected=$(sed -n 's/^\([0-9]\{1,\}\)[/0-9]* tests\{0,1\} collected.*/\1/p' \
            collect-${{ matrix.group }}.txt | tail -1)
          if [ "$rc" -ne 0 ] || [ -z "$collected" ] || [ "$collected" -eq 0 ]; then
            echo "group '${{ matrix.group }}' did not collect a usable test set" >&2
            echo "  paths        : ${{ matrix.paths }}" >&2
            echo "  split        : ${{ matrix.split }}" >&2
            echo "  pytest exit  : $rc (5 = no tests collected, 4 = path/usage error)" >&2
            echo "  parsed count : '${collected}'" >&2
            echo "A group that collects nothing passes for the wrong reason." >&2
            tail -30 collect-${{ matrix.group }}.txt >&2
            exit 1
          fi
          echo "group '${{ matrix.group }}' selects ${collected} tests"

      - name: Run tests
        # -rs + tee: the skip-summary output feeds the check-skip-inventory gate
        # as an artifact — the gate parses this text instead of re-running the
        # suite. pipefail keeps pytest's exit code through the tee.
        # -n is capped (never `auto`): /proc/meminfo reports HOST RAM inside the
        # cgroup-limited runner, so `auto` spawns a worker per host core and each
        # worker carries a SurrealDB child plus the embedding model (ADR-0070).
        #
        # EXTRAS RECEIPT FIRST (task 392). `--emit-receipt` MEASURES, in this
        # job's own interpreter, whether each optional dependency the inventory
        # keys on is importable, and writes one `SKIPGATE-MODULES:` line into
        # the artifact ahead of pytest's output (hence `>` then `tee -a`). The
        # gate reads it out of the same stream and refuses to let an entry like
        # 'sqlalchemy not installed (sql extra)' sanction a skip on a leg where
        # sqlalchemy is installed. It must be MEASURED and not declared here:
        # yadgar-ci has no auto-sync pipeline, so a hardcoded "this image has
        # the sql extra" would be an assertion that can silently go false —
        # precisely the kind of unverifiable claim this gate exists to remove.
        run: |
          set -o pipefail
          python scripts/check_skip_inventory.py --emit-receipt \
            > pytest-rs-${{ matrix.group }}.txt
          cat pytest-rs-${{ matrix.group }}.txt
          python -m pytest ${{ matrix.paths }} ${{ matrix.split }} \
            -q -rs --tb=short \
            -n ${{ vars.CI_PYTEST_WORKERS || '4' }} --dist loadgroup \
            --reruns 2 --reruns-delay 2 \
            -m 'not integration and not e2e and not perf' \
            2>&1 | tee -a pytest-rs-${{ matrix.group }}.txt

      - name: Upload -rs output for skip gate
        # if: always() — a FAILING group must still publish its artifact, or
        # check-skip-inventory's artifact-count gate fails for the wrong reason
        # and masks the real failure underneath it.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest-rs-${{ matrix.group }}
          path: pytest-rs-${{ matrix.group }}.txt
          retention-days: 1

  test-perf:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","yadgar"]') }}
    # Serial perf-guard job: runs only @pytest.mark.perf tests without xdist
    # (-n 0 overrides addopts -n 4 while keeping the plugin loaded — avoids
    # "unrecognized arguments: -n" that -p no:xdist triggers against addopts).
    # ~3 tests, lightweight; dedicated job so timing is trustworthy.
    #
    # NO `needs:` (Car J1). It used to declare `needs: [test-fast, test-shared,
    # test-backend, test-core]` with the comment "scheduling throttle only" —
    # i.e. an admitted non-dependency. It has none: it selects `-m perf`, which
    # every other job excludes. The concurrency cap it was faking now lives on
    # the `tests` matrix's max-parallel. `if: always()` went with the `needs:`
    # that made it meaningful — a job with no dependencies always runs.
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_XET: '1'
      HF_HOME: ${{ vars.HF_HOME }}
      YADGAR_OTLP_ENDPOINT: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trust workspace (container runs as a different UID than checkout)
        run: git config --global --add safe.directory '*'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /root/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-

      - name: Install dependencies
        # Deps are BAKED into yadgar-ci FROM uv.lock (lock parity — ADR-0089).
        # --no-deps installs only the yadgar package itself; nothing re-resolves
        # at run time, so CI cannot drift past the lock. Missing dep = rebuild
        # the image (fail-loud by design).
        run: |
          uv pip install --system --no-deps -e .

      - name: Run perf guards (serial)
        run: |
          python -m pytest yadgar/tests/ \
            -m perf \
            -n 0 \
            -q --tb=short

  # ── engine #2 (MariaDB) integration — task #26 ────────────────────────────
  #
  # (This comment deliberately writes no `yadgar/tests/<dir>/` path and no
  # quoted pytest marker: scripts/check_ci_local_parity.py discovers subsystem
  # legs by SHAPE, over the raw text of the preceding job's block, and either
  # token in a comment makes it mis-attribute this job's contents to test-perf.)
  #
  # WHY THIS JOB EXISTS. The engine-#2 tests carry the integration marker, and
  # every other job's marker filter excludes it, so this suite had NEVER
  # executed in CI. That is how a migration
  # chain that cannot run under production's own grants shipped and stayed
  # broken for months: the offline tests pinned the DDL text, the grant test
  # pinned the GRANT text, and nothing ever started a server to discover that
  # the granted account could not create the tables it was being granted.
  #
  # BARE ON THE RUNNER HOST — no `container:`. The other jobs run inside the
  # yadgar-ci image, which has no podman (that is exactly what the
  # YADGAR_TEST_SKIP_RUNTIME_CHECK env at the top of this file is for), and
  # these tests need to start a real mariadb container. The runner host has
  # BOTH `podman` and `docker` binaries on PATH — but only `docker` actually
  # works: this runner is itself a container (github-runners_runner_1) with a
  # `docker:dind` sidecar (ADR-0166), and rootless podman cannot nest inside
  # it — `podman info` / `podman run` fail INSTANTLY with "Error: cannot
  # re-exec process" (car G5, confirmed live on the runner). `docker`, proxied
  # through the dind sidecar, works fine. Presence-only checks (`command -v`,
  # `shutil.which`) pick the broken podman every time; the assert below and
  # the four test fixtures (`yadgar.tests.integration._podman.
  # select_container_runtime`) both probe FUNCTION, not presence, so they
  # correctly fall through to docker.
  #
  # A SKIPPED RUN IS NOT A PASS. The fixture calls `pytest.skip` when no
  # WORKING container runtime is found, and a job that skips everything
  # exits 0 and looks green — the same "green means nothing" failure this
  # job is here to end. So a working runtime is asserted up front, and the
  # run is required to have COLLECTED tests and reported zero skips.
  test-engine2-integration:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","yadgar"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trust workspace
        run: git config --global --add safe.directory '*'

      - name: Assert a WORKING container runtime is present (a skip here is a failure)
        # `command -v` (the original check) only proves a binary is on PATH.
        # It passed while the suite still skipped everything: `podman` is on
        # PATH here but cannot actually start anything (car G5 — nested
        # rootless podman fails "cannot re-exec process" inside this runner's
        # own docker:dind sidecar container). Run a real throwaway container
        # per candidate runtime instead of just checking the binary exists —
        # exercises the exact capability the tests below need.
        run: |
          set -euo pipefail
          runtime=""
          for candidate in podman docker; do
            if command -v "$candidate" >/dev/null 2>&1 && \
               "$candidate" run --rm docker.io/library/alpine:3 true >/dev/null 2>&1; then
              runtime="$candidate"
              break
            fi
          done
          if [ -z "$runtime" ]; then
            echo "no WORKING container runtime on the runner host (podman/docker may be" >&2
            echo "on PATH but unable to actually start a container) — the engine-#2 suite" >&2
            echo "cannot run, and a silent skip is what let a broken migration ship." >&2
            echo "Failing loudly." >&2
            exit 1
          fi
          echo "using $runtime as the working container runtime"

      - name: Install mariadb client (mariadb-dump / mariadb — needed by the dump/restore arms)
        # Bare runner host, no image to inherit these from. Without this,
        # test_mariadb_dump_arm.py / test_mariadb_restore_arm.py skip via
        # their own `shutil.which("mariadb-dump")` / `shutil.which("mariadb")`
        # guards even once a working container runtime is found (car G5).
        #
        # NOT THE DISTRO PACKAGE. This runner is Ubuntu 20.04 — its
        # `mariadb-client` is MariaDB 10.3, which predates the
        # `mysqldump` -> `mariadb-dump` rename (10.5). So apt SUCCEEDED while
        # `mariadb-dump` stayed absent, and every one of the 15 skips left in
        # run 31677402827 was that single cause. Production resolves the
        # binary by that exact name (`backup_sql.py`: which("mariadb-dump")),
        # so pointing a symlink at 10.3's `mysqldump` would satisfy the guard
        # with the wrong binary under a false name — a green tick for an
        # untested path. MariaDB's own repo publishes 11.4 for focal, the
        # same series as the server image the fixtures start, so client and
        # server match.
        run: |
          set -euo pipefail
          . /etc/os-release
          codename="${VERSION_CODENAME:-}"
          if [ -z "$codename" ]; then
            echo "/etc/os-release carries no VERSION_CODENAME; cannot pick a MariaDB repo" >&2
            exit 1
          fi
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://mariadb.org/mariadb_release_signing_key.pgp \
            | sudo tee /etc/apt/keyrings/mariadb.pgp > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/mariadb.pgp] https://mirror.mariadb.org/repo/11.4/${ID} ${codename} main" \
            | sudo tee /etc/apt/sources.list.d/mariadb.list > /dev/null
          # MariaDB drops EOL distros from its repo (focal etc.). When the
          # codename isn't published, ``apt-get update`` exits 100 and the
          # whole step blows up — even though the distro's own
          # ``mariadb-client`` is new enough to expose ``mariadb-dump``.
          # Try the upstream repo first; fall back to the distro package
          # if update fails, with a log line naming the skipped codename so
          # the next EOL doesn't bury itself in a generic 100. (task 335)
          if ! sudo apt-get update -qq 2>/tmp/mariadb-update.err; then
            echo "MariaDB repo skipped: codename '${codename}' not published (likely EOL distro)"
            cat /tmp/mariadb-update.err >&2
            sudo rm -f /etc/apt/sources.list.d/mariadb.list
            sudo apt-get update -qq
          fi
          sudo apt-get install -y --no-install-recommends mariadb-client
          # Fail HERE rather than as a skip three minutes into the suite.
          for binary in mariadb-dump mariadb; do
            command -v "$binary" >/dev/null 2>&1 || {
              echo "$binary is STILL absent after installing mariadb-client" >&2
              exit 1
            }
          done
          mariadb-dump --version

      - name: Install uv (bare host, no container to inherit it from)
        # `python3 -m pip install uv` (the original approach) resolves through
        # WHATEVER `python3` is on the runner's PATH -- that turned out to be
        # the host's system Python 3.8, and the pip-installed `uv` package's
        # binary-fetch landed somewhere `python3 -m uv` doesn't search
        # (uv._find_uv.UvNotFound — PR #41's actual CI failure). The official
        # installer places a real `uv` binary at ~/.local/bin/uv directly,
        # independent of whatever system python is on PATH.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Provision Python 3.14 (requires-python >=3.14; system python3 here is 3.8)
        run: uv python install 3.14

      - name: Sync the sql + test extras
        # The `sql` extra (sqlalchemy + asyncmy + alembic) is NOT baked into
        # yadgar-ci, and this job does not use that image anyway.
        run: uv sync --python 3.14 --extra sql --extra test

      - name: Run the engine-#2 integration suite
        # `-rf` (the original flag) reports FAILURES only — a skip reason is
        # never printed, so a run that skips everything leaves the artifact
        # with nothing to diagnose from but "s" characters (car G5: 41
        # skipped in 2.31s, cause invisible from the artifact alone). `-ra`
        # reports every non-passing outcome, including skip reasons.
        #
        # THE FILE LIST BELOW IS HAND-MAINTAINED AND WAS WRONG (task #77):
        # every file here carries `pytest.mark.xdist_group("engine2_mariadb")`
        # in addition to `integration`, but three siblings that carry the same
        # xdist_group tag were never added — test_cross_engine_invariants.py
        # said so in its own docstring ("this file is not in the CI job's file
        # list, so it carried both defects latently after its three siblings
        # were fixed"), and the two newest files (Car B's row-constructor fix,
        # Car C2's NULL-clearing fix) landed marked `integration` and were
        # therefore silently EXCLUDED by every other job's `-m 'not
        # integration and not e2e and not perf'` — never run anywhere.
        # `yadgar/tests/scripts/test_engine2_integration_coverage.py` now
        # gates this list against the marker so a future omission fails loudly
        # instead of vanishing the same way.
        run: |
          set -o pipefail
          uv run --python 3.14 --extra sql --extra test python -m pytest \
            yadgar/tests/integration/test_mariadb_migrations.py \
            yadgar/tests/integration/test_mariadb_connection.py \
            yadgar/tests/integration/test_mariadb_dump_arm.py \
            yadgar/tests/integration/test_mariadb_restore_arm.py \
            yadgar/tests/integration/test_cross_engine_invariants.py \
            yadgar/tests/integration/test_task_list_status_filter.py \
            yadgar/tests/integration/test_task_write_clear_columns.py \
            yadgar/tests/integration/test_task_edges_and_paging.py \
            yadgar/tests/integration/test_adr_seed_ledger_ids.py \
            -m integration \
            -n 0 \
            -q -ra --tb=short \
            2>&1 | tee pytest-engine2.txt

      - name: Gate on tests having actually RUN
        # `0 passed` and `N skipped` both exit 0. Neither is evidence.
        run: |
          set -euo pipefail
          if grep -qE '[0-9]+ skipped' pytest-engine2.txt; then
            echo "the engine-#2 suite skipped tests — a skipped privilege test is not a pass:" >&2
            grep -E '[0-9]+ skipped' pytest-engine2.txt >&2
            exit 1
          fi
          grep -qE '[1-9][0-9]* passed' pytest-engine2.txt || {
            echo "the engine-#2 suite collected nothing" >&2
            exit 1
          }

      - name: Upload output
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest-engine2
          path: pytest-engine2.txt
          retention-days: 1

      - name: Resolve a PULLABLE backend image for the vacuum e2e suite
        # server.json carries the PENDING backend_version; backend images are
        # published at RELEASE, i.e. AFTER merge. So on every PR that bumps
        # backend_version the derived tag does not exist and the container start
        # fails, which conftest reports as a SKIP — and the gate below (rightly)
        # treats a skip as a failure. Car A3 wired this suite into CI for the
        # first time and hit exactly that on run #1:
        #   docker.io/openfantasy/yadgar-backend:5.76.4: not found
        #
        # So resolve the tag here instead of letting the fixture derive it:
        # prefer the PENDING image when it is actually published (true on
        # master and post-release), else fall back to master's released one.
        # NEVER silently: the fallback prints a warning saying backend changes
        # in this PR are not validated by this job, and an unpullable image is
        # a hard failure rather than a skip.
        #
        # `git fetch --depth=1 origin master` is required — actions/checkout
        # fetches only the PR merge ref at depth 1, so origin/master is absent.
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          PENDING=$(python3 -c "import json;print(json.load(open('server.json'))['backend_version'])")
          BASE=$(git show origin/master:server.json \
                   | python3 -c "import json,sys;print(json.load(sys.stdin)['backend_version'])")
          REPO=docker.io/openfantasy/yadgar-backend
          # Tier 3 exists because tier 2's premise turned out to be false. The
          # original logic assumed master's DECLARED backend_version is always a
          # PUBLISHED image. It is not: images are pushed by hand (ledger task
          # 232), so master can declare 5.84.0 while Docker Hub's newest tag is
          # 5.83.0 — which made this step hard-fail on EVERY pr, forever, for a
          # reason no pr could fix. Measured 2026-08-27 (ledger task 396).
          # So: ask the registry what actually exists rather than trusting a
          # version string. Failing only when NOTHING is pullable keeps the gate
          # honest — that is a real repo-level problem — while a merely-stale
          # published image degrades to a loud warning, which is what this step
          # already admits it is.
          newest_published() {
            python3 - "$REPO" <<'PY'
          import json, re, sys, urllib.request
          repo = sys.argv[1].split("docker.io/", 1)[-1]
          url = f"https://hub.docker.com/v2/repositories/{repo}/tags?page_size=100"
          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  tags = [t["name"] for t in json.load(r).get("results", [])]
          except Exception:
              sys.exit(0)
          sem = [t for t in tags if re.fullmatch(r"\d+\.\d+\.\d+", t)]
          if sem:
              print(max(sem, key=lambda t: tuple(int(p) for p in t.split("."))))
          PY
          }
          IMG=""
          if docker manifest inspect "$REPO:$PENDING" >/dev/null 2>&1; then
            IMG="$REPO:$PENDING"
            echo "vacuum e2e: backend $PENDING is published — testing the pending image"
          elif docker manifest inspect "$REPO:$BASE" >/dev/null 2>&1; then
            IMG="$REPO:$BASE"
            echo "::warning::vacuum e2e: backend $PENDING is not published yet; falling back to master's $BASE"
            echo "::warning::vacuum e2e: backend changes in THIS PR are NOT validated by this job"
          else
            NEWEST="$(newest_published || true)"
            if [ -n "$NEWEST" ] && docker manifest inspect "$REPO:$NEWEST" >/dev/null 2>&1; then
              IMG="$REPO:$NEWEST"
              echo "::warning::vacuum e2e: NEITHER $PENDING (pending) NOR $BASE (master's declared) is published"
              echo "::warning::vacuum e2e: master declares a backend_version that was never pushed — see ledger task 396"
              echo "::warning::vacuum e2e: falling back to the newest PUBLISHED tag $NEWEST; backend changes are NOT validated"
            fi
          fi
          if [ -z "$IMG" ]; then
            echo "no pullable backend image at all: tried $PENDING (pending), $BASE (master), and the newest published tag." >&2
            echo "That is a repo-level publishing failure, not a PR problem — see ledger task 396." >&2
            exit 1
          fi
          docker pull "$IMG" || {
            echo "$IMG resolved via the registry but could not be pulled" >&2
            exit 1
          }
          echo "YADGAR_TEST_BACKEND_IMAGE=$IMG" >> "$GITHUB_ENV"
          # ...and the SAME tag for the phase-3 side build. `launcher.backend_image()`
          # resolves DOCKERHUB_BACKEND_IMAGE from server.json's backend_version — the
          # PENDING one, which on any PR that bumps it is not published, so it is not
          # in the local store either. `backend_image_present()` then answers no and
          # the vacuum SKIPs its side build before doing anything, which the tests
          # read as a failed vacuum. The resolution above already picked the tag that
          # can actually be run; the side build has to use that same one, or this job
          # tests the fixture's image and the vacuum's image separately.
          echo "YADGAR_BACKEND_IMAGE=$IMG" >> "$GITHUB_ENV"

      - name: Cross the dind namespace split for the vacuum e2e suite (task 228)
        # THREE of the four layers of one bug. The daemon this job talks to is a
        # docker:dind SIDECAR (DOCKER_HOST=tcp://dind:2375), so it lives in a
        # different network namespace AND a different filesystem namespace from
        # this shell. Every string this job hands the daemon is resolved THERE:
        #
        #   port   — a container port published on 127.0.0.1 lands on the
        #            SIDECAR's loopback. Fixed for the backend container in
        #            7d88c8eb (conftest `_docker_endpoint_host`); fixed for the
        #            phase-3 side-build container by YADGAR_VACUUM_SIDE_HOST below.
        #   mount  — `-v {data_dir}:/data` resolves in the SIDECAR's filesystem,
        #            so with a /tmp path the backend wrote its whole DB somewhere
        #            invisible here and the vacuum's own preflight then reported
        #            `DB dir not found`. That is what YADGAR_TEST_SHARED_DATA_ROOT
        #            fixes, for the backend container and for the side-build
        #            container that mounts the very same directory.
        #
        # The mount fix rests on a property of THIS runner's compose file, not of
        # dind in general: the runner container and its sidecar both bind-mount
        # the host's runner-work dir at the same absolute path, so a dir under
        # the workspace is one directory with one name on both sides. That is an
        # assumption about infrastructure this repo does not own, so it is
        # PROVEN here rather than assumed — same discipline as the working-runtime
        # assertion at the top of this job. A silent regression in the compose
        # file would otherwise resurface as the same baffling `DB dir not found`.
        # Measured 2026-08-20 on this runner: workFolder is /runner/work, the
        # checkout is /runner/work/<repo>/<repo>, and both containers bind-mount
        # /runner/work — so github.workspace IS under the share. The fixture
        # mkdtemps a per-module subdir BENEATH the root exported here; that rides
        # the same mount, so proving the root is enough.
        run: |
          set -euo pipefail
          case "${DOCKER_HOST:-}" in
            tcp://*)
              hostport=${DOCKER_HOST#tcp://}
              side_host=${hostport%:*}
              ;;
            *)
              echo "DOCKER_HOST is not a TCP daemon — no namespace split to cross."
              echo "Leaving both knobs at their local-dev defaults."
              exit 0
              ;;
          esac

          shared_root="${{ github.workspace }}/.vacuum-e2e-data"
          mkdir -p "$shared_root"
          marker="$shared_root/.dind-visibility-probe"
          token="probe-$$-$(date +%s)"
          echo "$token" > "$marker"
          seen=$(docker run --rm -v "$shared_root:/probe" docker.io/library/alpine:3 \
            cat /probe/.dind-visibility-probe 2>/dev/null || true)
          rm -f "$marker"
          if [ "$seen" != "$token" ]; then
            echo "the workspace is NOT visible to the $side_host daemon at the same path." >&2
            echo "  probed path : $shared_root" >&2
            echo "  wrote       : $token" >&2
            echo "  read back   : ${seen:-<nothing>}" >&2
            echo "The vacuum e2e suite needs one directory that both this shell and the" >&2
            echo "daemon resolve to the same bytes — the vacuum renames and copytrees it" >&2
            echo "in-process, so it cannot be proxied. Check that the runner container and" >&2
            echo "its dind sidecar still share the runner-work bind mount at one path." >&2
            exit 1
          fi
          echo "workspace is dind-visible at $shared_root; side-build host is $side_host"
          echo "YADGAR_TEST_SHARED_DATA_ROOT=$shared_root" >> "$GITHUB_ENV"
          echo "YADGAR_VACUUM_SIDE_HOST=$side_host" >> "$GITHUB_ENV"
          # LAYER 6: pin the container runtime to docker. `_get_runtime()`
          # (yadgar/core/daemon/runtime.py) probes `podman --version` FIRST and
          # returns podman when it answers 0. On this runner podman IS on PATH
          # and answers --version fine, but cannot DO anything — nested rootless
          # podman fails "cannot re-exec process" (car G5, confirmed live). So
          # `backend_image_present()` ran `podman image inspect` against a store
          # that is not the one dind uses, answered no, and phase 3 SKIPped with
          # "no usable surreal" even though the image was pullable. That is the
          # presence-not-function trap this job's own header warns about; the
          # test fixtures probe FUNCTION and pick docker, the vacuum code did not.
          echo "YADGAR_CONTAINER_RUNTIME=docker" >> "$GITHUB_ENV"

      - name: Run the vacuum e2e integration suite (task 156 / car A3)
        # yadgar/tests/integration/test_vacuum_e2e.py and
        # yadgar/tests/integration/test_conftest_backend_pin.py were in NO CI
        # job at all — unlike the engine-#2 files above (excluded only by
        # every OTHER job's marker filter, and covered here), the whole
        # `yadgar/tests/integration/` directory is absent from the `tests`
        # matrix's `paths:` entries, so nothing ever passed either file to
        # pytest, marker or no marker. This job already asserted a WORKING
        # container runtime above, which is exactly what
        # `live_backend_container` (test_vacuum_e2e.py's fixture) needs;
        # test_conftest_backend_pin.py needs no container but lives beside it.
        #
        # `-o addopts='-n 0'` REPLACES pyproject's default addopts (which
        # excludes the integration and e2e marks) instead of appending to it,
        # so test_vacuum_e2e.py's `integration` marker does not deselect it —
        # deliberately no `-m` flag on this line at all: a quoted marker
        # string anywhere in this job's text would make
        # scripts/check_ci_local_parity.py's shape-based stray-job scan
        # misfile this job as an uncovered subsystem leg (see the comment
        # above `test-engine2-integration:` — same landmine, same reason it
        # writes no quoted marker either). `-n 0` because
        # `live_backend_container` is module-scoped and does docker
        # stop/start; xdist workers would race the same container.
        run: |
          set -o pipefail
          uv run --python 3.14 --extra sql --extra test python -m pytest \
            yadgar/tests/integration/test_vacuum_e2e.py \
            yadgar/tests/integration/test_conftest_backend_pin.py \
            -o addopts='-n 0' \
            -q -ra --tb=short \
            2>&1 | tee pytest-vacuum-e2e.txt

      - name: Gate on vacuum e2e tests having actually RUN
        # Same discipline as the engine-#2 gate above: a full skip (e.g. the
        # container runtime assertion above passed but the backend image
        # itself failed to pull/start) exits 0 and looks green. A real test
        # failure already fails the step above via pipefail; this step only
        # exists to catch the skip case that wouldn't.
        run: |
          set -euo pipefail
          if grep -qE '[0-9]+ skipped' pytest-vacuum-e2e.txt; then
            echo "the vacuum e2e suite skipped tests — a skip here is not a pass:" >&2
            grep -E '[0-9]+ skipped' pytest-vacuum-e2e.txt >&2
            exit 1
          fi
          grep -qE '[1-9][0-9]* (passed|failed)' pytest-vacuum-e2e.txt || {
            echo "the vacuum e2e suite collected nothing" >&2
            exit 1
          }

      - name: Upload vacuum e2e output
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest-vacuum-e2e
          path: pytest-vacuum-e2e.txt
          retention-days: 1

  check-skip-inventory:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","yadgar"]') }}
    # Validates every test group's pytest -rs skip summary WITHOUT re-running
    # any test.  The original Car 1 gate re-ran all four leg paths as a 5th
    # full-suite run: doubled CI wall time, added another OOM-class load to the
    # co-hosted runner (ADR-0079), and its pipe buffered so the job looked hung
    # for 20+ minutes.  Now the groups tee their own -rs output to artifacts and
    # this job just parses the text — runtime is seconds.
    # No pip install: check_skip_inventory.py and ci_group_manifest.py are both
    # stdlib-only.
    #
    # This `needs:` IS a real dependency, unlike the ones Car J1 deleted: this
    # job consumes the artifacts those groups produce. `if: always()` so a
    # FAILING group is still inventoried rather than skipping the gate.
    needs: [tests]
    if: ${{ always() }}
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trust workspace (container runs as a different UID than checkout)
        run: git config --global --add safe.directory '*'

      - name: Download every group's -rs output
        # One `pattern:` replaces the old five hand-listed download steps. A
        # per-group step list has to be edited in lockstep with the matrix and
        # goes stale silently; the COUNT check below is what makes a missing
        # artifact fail, so the download itself does not need to enumerate.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: pytest-rs-*
          merge-multiple: true
          path: rs-logs/

      - name: Gate skip inventory (parse group artifacts — no test execution)
        # EVERY group's output must be present — a missing artifact fails loudly
        # rather than silently narrowing the gate to whatever did upload.
        #
        # The expected count is DERIVED from the matrix, never a literal. It was
        # `-ne 5`; a hardcoded number that happens to match today stops
        # discriminating the moment a group is added — the gate would inventory
        # a subset and still pass. scripts/ci_group_manifest.py parses the
        # matrix and is the single source of truth.
        run: |
          set -o pipefail
          expected=$(python scripts/ci_group_manifest.py --count)
          if [ -z "$expected" ] || [ "$expected" -lt 1 ]; then
            echo "could not derive the expected group count from ci-pr.yml" >&2
            exit 1
          fi
          count=$(ls rs-logs/pytest-rs-*.txt 2>/dev/null | wc -l)
          if [ "$count" -ne "$expected" ]; then
            echo "expected $expected group -rs artifacts (one per matrix group), found $count:" >&2
            python scripts/ci_group_manifest.py --names >&2
            ls -la rs-logs/ >&2
            exit 1
          fi
          # --require-receipt: every group must carry its measured
          # SKIPGATE-MODULES line. A group whose -rs text has none is
          # unverifiable — 'ran and passed' and 'skipped and passed' look
          # identical — so its absence FAILS rather than being tolerated.
          # The gate echoes each receipt, so this job's log is the CI-visible
          # answer to 'did the optional-dependency tests actually run?'.
          cat rs-logs/pytest-rs-*.txt \
            | python scripts/check_skip_inventory.py --require-receipt

      - name: Validate inventory governance (ADR-0087 — stale entries, note length, wildcards)
        run: python scripts/check_skip_inventory.py --validate-inventory

  invariant-checks:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","yadgar"]') }}
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # fetch-depth: 0 — check_test_weakening --ci needs the merge-base with
          # origin/master. A shallow checkout cannot reach it and the guard
          # fail-opens (the exact CI-inertness this job now closes).
          fetch-depth: 0

      - name: Trust workspace (container runs as a different UID than checkout)
        run: git config --global --add safe.directory '*'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /root/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-

      - name: Install dependencies
        # Deps are BAKED into yadgar-ci FROM uv.lock (lock parity — ADR-0089).
        # --no-deps installs only the yadgar package itself; nothing re-resolves
        # at run time, so CI cannot drift past the lock. Missing dep = rebuild
        # the image (fail-loud by design).
        run: |
          uv pip install --system --no-deps -e .

      - name: Check I23 — declared metrics must have writers
        run: python scripts/check_metric_writers.py

      - name: Check I24 — public HTTP handlers must have @trace_span
        run: python scripts/check_trace_spans.py

      - name: Check I33 — tri-signal observe-coverage (HARD; MISSING=0 enforced, closes #8)
        run: python scripts/check_observe_coverage.py

      - name: Check I25 / I25b — config three-way-sync + default-value agreement
        # Both files, matching the check-config-three-way-sync pre-commit hook.
        # I25 compares PRESENCE across Settings/yaml/registry; I25b compares the
        # declared default against the code default it documents (task:0103).
        # Naming only the I25 file here would leave I25b enforced locally and
        # invisible in CI — the same gate-blindness class I25b exists to close.
        run: >-
          python -m pytest
          yadgar/tests/server/test_config_three_way_sync.py
          yadgar/tests/server/test_config_default_values.py
          -q --tb=short

      - name: Check I29 — edge dead-capability lint (produced ≡ contracted, no drop-still-produced)
        run: python scripts/check_dead_capability.py

      - name: Check I32 — capability-registry coverage (every setting/tool/migration/BC catalogued)
        run: python scripts/check_capability_coverage.py

      - name: Check I32 prose-liveness — registry must not cite dead identifiers
        # Companion to the I32 coverage lint above, NOT a replacement. That lint
        # covers four enumerable identifier surfaces and never reads explanation:/
        # wiring: prose — which is why it ran green on the PR that made
        # CAP-CODEGRAPH-001's prose false. This one gates the prose tokens.
        run: python scripts/check_registry_prose_liveness.py

      - name: Check every bundled third-party binary is catalogued and shipped
        # SurrealDB (BUSL-1.1 — its own text says "not an Open Source license")
        # shipped in openfantasy/yadgar-backend and openfantasy/yadgar-ci for
        # many releases with no license anywhere in the image, because a
        # bare-binary `COPY --from` carries nothing but the binary and the
        # source image ships no license file at all. This gate keeps that from
        # recurring. Note the real gate is on the PUBLISH path in ci-release —
        # this step is the earlier, cheaper mirror of it.
        run: python scripts/check_third_party_licenses.py

      - name: Check internal route literals resolve to registered routes
        # core/vacuum POSTed /api/check_invariants for months with no route behind
        # it, and six tests mocked that URL to 200 — the mocks agreed with the
        # caller and nothing compared either against the route table.
        run: python scripts/check_route_literals.py

      - name: Layer 4 — block silent test weakening across the branch (#52)
        # --ci --base origin/master: the pre-commit path reads `git diff --cached`,
        # which is ALWAYS empty in a CI checkout — so the guard ran, printed OK and
        # could never fail. This step evaluates the cumulative branch diff vs the
        # merge-base instead, which is the question a PR actually poses.
        # NO env: block here, and none may be added. A sanctioned deletion is
        # recorded per file in .test-weakening-allowlist.json, in the repo, in the
        # diff a reviewer reads — not in a label-gated environment variable that
        # silences every file at once from outside the repository.
        run: python scripts/check_test_weakening.py --ci --base origin/master

  # Gateway: aggregates the test matrix plus every auxiliary gating job.
  # if: always() is required — without it this job is SKIPPED (not failed)
  # when any gated job fails, which would leave the PR green incorrectly.
  #
  # `tests` is ONE entry here for the whole matrix: a matrix job's `result` is
  # the aggregate over its groups, so with `fail-fast: false` a single failing
  # group still lands here as `failure` — the gate does not need to enumerate
  # groups, and therefore cannot go stale when a group is added or removed.
  test-gate:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","yadgar"]') }}
    needs:
      [
        tests,
        test-perf,
        test-engine2-integration,
        check-skip-inventory,
        invariant-checks,
        viz-tests,
        verify-version-bump,
      ]
    if: ${{ always() }}
    steps:
      - name: Assert all gated jobs passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "tests matrix failed (result: ${{ needs.tests.result }})"
            exit 1
          fi
          if [ "${{ needs.test-perf.result }}" != "success" ]; then
            echo "test-perf failed (result: ${{ needs.test-perf.result }})"
            exit 1
          fi
          if [ "${{ needs.test-engine2-integration.result }}" != "success" ]; then
            echo "test-engine2-integration failed (result: ${{ needs.test-engine2-integration.result }})"
            exit 1
          fi
          if [ "${{ needs.check-skip-inventory.result }}" != "success" ]; then
            echo "check-skip-inventory failed (result: ${{ needs.check-skip-inventory.result }})"
            exit 1
          fi
          if [ "${{ needs.invariant-checks.result }}" != "success" ]; then
            echo "invariant-checks failed (result: ${{ needs.invariant-checks.result }})"
            exit 1
          fi
          if [ "${{ needs.viz-tests.result }}" != "success" ]; then
            echo "viz-tests failed (result: ${{ needs.viz-tests.result }})"
            exit 1
          fi
          if [ "${{ needs.verify-version-bump.result }}" != "success" ]; then
            echo "verify-version-bump failed (result: ${{ needs.verify-version-bump.result }})"
            exit 1
          fi
          echo "All gated jobs passed."

  viz-tests:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","yadgar"]') }}
    # Use yadgar-ci-viz which extends yadgar-ci with Playwright + Chromium pre-baked.
    # Saves ~75s vs inline apt-get install on every run (v5.46.9 CI speedup).
    container:
      image: docker.io/openfantasy/yadgar-ci-viz:${{ vars.YADGAR_VERSION }}
    steps:
      # Playwright + Chromium + SurrealDB + HF model pre-baked in yadgar-ci-viz.
      # No apt-get install or binary download steps needed.

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trust workspace (container runs as a different UID than checkout)
        run: git config --global --add safe.directory '*'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /root/.cache/pip
          key: pip-viz-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-viz-

      - name: Cache npm (viz-tests)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: viz-tests/node_modules
          key: npm-viz-${{ hashFiles('viz-tests/package-lock.json') }}
          restore-keys: npm-viz-

      - name: Install Python dependencies
        # uv: required by test_v5_46_10_wheel_bundle (uv build --wheel subprocess).
        # Deps are BAKED into yadgar-ci FROM uv.lock (lock parity — ADR-0089).
        # --no-deps installs only the yadgar package itself; nothing re-resolves
        # at run time, so CI cannot drift past the lock. Missing dep = rebuild
        # the image (fail-loud by design).
        run: |
          uv pip install --system --no-deps -e .

      - name: Layer 1 — API contract integrity (Python)
        run: |
          python -m pytest yadgar/tests/server/test_graph_api_contract.py \
            -v --tb=short -q --reruns 1

      - name: Layer 2 — Playwright headless smoke
        # System chromium path pre-set via PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
        # env in yadgar-ci-viz image. No extra env needed here.
        run: |
          python -m pytest yadgar/tests/integration/viz/ \
            -m integration -v --tb=short -q --reruns 1

      - name: Install Node.js deps (Layer 3)
        working-directory: viz-tests
        # Resilient install: npm registry socket timeouts are a recurring CI flake.
        # Bump fetch retries/timeouts and retry the whole `npm ci` up to 3x.
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          ok=0
          for attempt in 1 2 3; do
            if npm ci; then ok=1; break; fi
            echo "npm ci attempt ${attempt} failed; retrying in 10s..." >&2
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "npm ci failed after 3 attempts" >&2; exit 1; }

      - name: Layer 3 — JS unit tests (Vitest)
        working-directory: viz-tests
        run: npx vitest run

  verify-version-bump:
    # Skip the version-bump gate when the PR carries the 'no-release' label
    # (docs/chore PRs that touch yadgar/** — e.g. contract-doc path pins — but
    # intentionally ship no version bump). Absent/empty label list → contains()
    # is false → !false = true → the gate RUNS (safe default; never silently
    # skips an unlabeled PR). Referenced by the error string below since v?; the
    # label + this guard were wired 2026-07-14.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-release') }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","yadgar"]') }}
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust workspace (container runs as a different UID than checkout)
        run: git config --global --add safe.directory '*'
      - name: Verify version bump vs merge-base
        # Task 382: was inline bash comparing pyproject.toml's version to
        # `git describe --tags --abbrev=0`. A tag cannot answer "does THIS
        # branch bump the version relative to its fork point" once master has
        # moved — measured live, the gate stayed green over a branch whose own
        # bump had been reverted by a master merge. Now delegates to the script
        # (the same one the pre-push hook runs, so local and CI return the same
        # verdict for the same repo state — the ADR-0097 parity contract) which
        # compares against the merge-base, exactly as the backend step below.
        run: python scripts/check_version_bump.py --ci --base origin/master

      - name: Verify backend_version bump when backend changed (#83)
        # Uses --ci --base origin/master to diff the PR branch vs the merge-base
        # so backend build input changes (yadgar/backend/**, Dockerfile.backend,
        # entrypoint-backend.sh) that lack a server.json backend_version bump
        # fail the PR — closes the gap that let PR #144 slip through pre-commit.
        run: python scripts/check_backend_bump.py --ci --base origin/master
