name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Install SurrealDB
        run: |
          SURREAL_VERSION="v3.0.5"
          SURREAL_SHA256="48dbeba4896765f33e07acc25224073f0850c190872052b917ebda1f7b4375cb"
          SURREAL_URL="https://github.com/surrealdb/surrealdb/releases/download/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz"
          curl -fsSL "$SURREAL_URL" -o surreal.tgz
          echo "${SURREAL_SHA256}  surreal.tgz" | sha256sum -c -
          tar -xzf surreal.tgz
          mkdir -p "$HOME/.surrealdb"
          mv surreal "$HOME/.surrealdb/surreal"
          echo "$HOME/.surrealdb" >> $GITHUB_PATH
      - name: Run tests
        run: python -m pytest yadgar/tests/ -q --tb=short

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1

  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.check.outputs.docker }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && \
             ! git diff --name-only HEAD~1 HEAD | grep -qE '^(Dockerfile|Dockerfile\.backend|entrypoint.*\.sh|yadgar/|pyproject\.toml|\.github/workflows/ci\.yaml)'; then
            echo "docker=false" >> "$GITHUB_OUTPUT"
          else
            echo "docker=true" >> "$GITHUB_OUTPUT"
          fi

  docker:
    needs: [test, changes]
    runs-on: ubuntu-latest
    # Push on version tags and direct pushes to master (not PRs)
    # On master: only when Docker-relevant files changed; on version tags: always
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.docker == 'true')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version from pyproject.toml
        id: get-version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      # Generate tags for core image: latest + exact version on master, semver on tags
      - name: Docker metadata (core)
        id: meta-core
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: looseking/yadgar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get-version.outputs.version }},enable={{is_default_branch}}

      # Generate tags for backend image
      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: looseking/yadgar-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get-version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push core image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=registry,ref=looseking/yadgar:buildcache
          cache-to: type=registry,ref=looseking/yadgar:buildcache,mode=min,ignore-error=true

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=looseking/yadgar-backend:buildcache
          cache-to: type=registry,ref=looseking/yadgar-backend:buildcache,mode=min,ignore-error=true
