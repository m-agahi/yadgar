name: CI (Release)

# Triggers on every push to master (post-merge). Detects whether a new version
# was bumped; if so, runs the full release pipeline: build images, build wheel,
# publish to PyPI, create git tag + GitHub release.
#
# workflow_dispatch: manual fallback — forces release=true so an operator can
# re-run a failed release without re-pushing to master.
on:
  push:
    branches: [master]
    # Docs-only and workflow-only pushes skip the release pipeline (no code →
    # nothing to build; workflow edits already detect no build + no version bump).
    # Skips only when EVERY changed path matches — real releases (pyproject +
    # docs/CHANGELOG) still run because pyproject is non-docs.
    paths-ignore:
      - 'benchmarks/**'
      - 'docs/**'
      - '.forgejo/**'
      - '.github/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'flake.nix'
      - 'flake.lock'
      - 'MIGRATION_NOTES.md'
      - '.gitignore'
  workflow_dispatch:

# Don't cancel in-progress releases when a new push arrives — let the current
# release finish. Only one release runs at a time per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  YADGAR_CI_BRANCH: master
  YADGAR_TEST_SKIP_RUNTIME_CHECK: "1"

jobs:
  # ── Detect whether a release is needed ───────────────────────────────────
  changes:
    runs-on: [self-hosted, linux, x64, yadgar]
    outputs:
      release:  ${{ steps.detect.outputs.release }}
      core:     ${{ steps.detect.outputs.core }}
      backend:  ${{ steps.detect.outputs.backend }}
      version:  ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout (full history for tag detection)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect version bump + per-image changes
        id: detect
        # Release fires when pyproject version differs from the latest v* tag.
        # On workflow_dispatch, force release=true (manual override).
        # Per-image rebuild detection uses file globs + server.json version fields
        # (same logic as the old ci.yaml changes job).
        #
        # This job runs bare on the self-hosted runner host (no container:), so
        # its python3 isn't guaranteed to be the yadgar-ci image's pinned 3.14 —
        # `tomllib` is stdlib-only from 3.11+. `tomli` is the same API as a pip
        # package that works on any python3, so install it and alias it in.
        run: |
          set -euo pipefail

          python3 -m pip install --quiet --disable-pip-version-check tomli==2.4.1

          PYPROJECT_VER=$(python3 -c "import tomli as tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${PYPROJECT_VER}" >> "$GITHUB_OUTPUT"

          # Latest v* git tag (empty string if none exist yet → first release)
          LATEST_TAG=$(git tag --list 'v*' | sort -V | tail -1 || true)
          LATEST_VER="${LATEST_TAG#v}"  # strip leading v

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — forcing release=true"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$LATEST_VER" ]; then
            echo "No v* tags found — first release, release=true"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "${PYPROJECT_VER}" = "${LATEST_VER}" ]; then
            echo "Version ${PYPROJECT_VER} already tagged — release=false"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${PYPROJECT_VER} vs latest tag ${LATEST_TAG} — release=true"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

          # Per-image change detection: diff HEAD~1..HEAD file globs.
          # (On first commit / shallow history, default both=true.)
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "core=true"    >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only HEAD~1 HEAD)

          core_changed=false
          backend_changed=false

          # Per-image file globs. Workflow files are deliberately NOT in either
          # pattern — workflow edits change orchestration, not image content.
          # To force a rebuild, bump the version field in pyproject.toml or server.json.
          #
          # After v5.60 the 4 backend-only modules live under yadgar/backend/.
          # Core = everything under yadgar/ EXCEPT yadgar/backend/, plus Dockerfile
          # and entrypoint.sh. Backend = yadgar/backend/**, Dockerfile.backend,
          # entrypoint-backend.sh. pyproject.toml touches both (ml-extra deps live
          # there too) so we treat any pyproject.toml change as a trigger for both.
          #
          # Mirror of the pre-commit check-backend-bump hook path list
          # (scripts/check_backend_bump.py: BACKEND_BUILD_INPUTS + BACKEND_BUILD_DIRS),
          # extended with yadgar/backend/ for the v5.60 module move.
          if echo "$changed" | grep -qE '^(Dockerfile$|entrypoint\.sh$|pyproject\.toml$)'; then
            core_changed=true
          fi
          # yadgar/ files that are NOT under yadgar/backend/ → core
          if echo "$changed" | grep -E '^yadgar/' | grep -qvE '^yadgar/backend/'; then
            core_changed=true
          fi
          if echo "$changed" | grep -qE '^(Dockerfile\.backend$|entrypoint-backend\.sh$|yadgar/backend/)'; then
            backend_changed=true
          fi
          # pyproject.toml triggers backend ONLY when dependencies or ml-extra deps changed,
          # NOT for a version-only bump (avoids wasteful rebuild on CORE-only releases).
          # Mirrors the server.json field-compare pattern at lines 126-131.
          if echo "$changed" | grep -q '^pyproject\.toml$'; then
            BE_DEPS='import tomli as tomllib,sys,json; p=tomllib.load(sys.stdin.buffer)["project"]; print(json.dumps([p.get("dependencies"), p.get("optional-dependencies",{}).get("ml")], sort_keys=True))'
            old_be_deps=$(git show HEAD~1:pyproject.toml | python3 -c "$BE_DEPS")
            new_be_deps=$(python3 -c "$BE_DEPS" < pyproject.toml)
            [ "$old_be_deps" != "$new_be_deps" ] && backend_changed=true
          fi

          # server.json — only the relevant version field counts
          if echo "$changed" | grep -q '^server\.json$'; then
            old_core=$(git show HEAD~1:server.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
            new_core=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
            [ "$old_core" != "$new_core" ] && core_changed=true
            old_be=$(git show HEAD~1:server.json | python3 -c "import json,sys; print(json.load(sys.stdin)['backend_version'])")
            new_be=$(python3 -c "import json; print(json.load(open('server.json'))['backend_version'])")
            [ "$old_be" != "$new_be" ] && backend_changed=true
          fi

          # Registry-existence check: build if (file/version changed) OR (target tag absent
          # from registry). Closes the v5.56/5.57 phantom-image gap where backend_version
          # bumped in a dev-gated run (nothing built), then v5.57.x saw it "unchanged" and
          # skipped — leaving yadgar-backend:5.6.0 as a phantom 404 on Docker Hub.
          # Fail-safe: if curl errors/empty (network hiccup), default to building (treat as
          # missing) — better to rebuild than silently skip.
          # BACKEND_VER read unconditionally here (new_be may not exist if server.json didn't
          # change in this commit, but the tag could still be absent from the registry).
          BACKEND_VER=$(python3 -c "import json; print(json.load(open('server.json'))['backend_version'])")

          core_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://hub.docker.com/v2/repositories/openfantasy/yadgar/tags/${PYPROJECT_VER}" || true)
          [ "$core_code" = "200" ] || core_changed=true

          backend_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://hub.docker.com/v2/repositories/openfantasy/yadgar-backend/tags/${BACKEND_VER}" || true)
          [ "$backend_code" = "200" ] || backend_changed=true

          echo "core=$core_changed"       >> "$GITHUB_OUTPUT"
          echo "backend=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "core_changed=$core_changed backend_changed=$backend_changed (core_tag=${core_code:-err} backend_tag=${backend_code:-err})"

  # ── Build Docker images ───────────────────────────────────────────────────
  build-images:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: [self-hosted, linux, x64, yadgar]
    # Self-hosted runner hosts the docker:cli container which has the docker CLI
    # + buildx. The yadgar-ci image is NOT used here (buildx + build-cloud
    # driver, not Python tooling). TODO(migration): if the self-hosted runner
    # gets docker installed directly, drop the docker:cli container entirely.
    container:
      image: docker:cli
    steps:
      - name: Install minimal tools
        # docker:cli already has the docker CLI. bash for heredocs, python3 for
        # version extraction, nodejs+git for JS actions, curl for runtime.
        run: apk add --no-cache bash python3 nodejs git curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trust workspace (container runs as a different UID than checkout)
        run: git config --global --add safe.directory '*'

      # Log in BEFORE setting up buildx: the `cloud` driver fetches a Docker Hub
      # token to reach the remote builder (openfantasy/builder), so credentials
      # must already be present.
      - name: Log in to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx (Build Cloud)
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver: cloud
          endpoint: openfantasy/builder

      - name: Get version from pyproject.toml
        id: get-version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Get backend version from server.json
        id: get-backend-version
        run: |
          echo "version=$(python3 -c "import json; print(json.load(open('server.json'))['backend_version'])")" >> "$GITHUB_OUTPUT"

      # Generate tags for core image: latest + exact version on master, semver on tags
      - name: Docker metadata (core)
        id: meta-core
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: openfantasy/yadgar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get-version.outputs.version }},enable={{is_default_branch}}

      # Generate tags for backend image — version read from server.json:backend_version
      # so core and backend can be bumped independently.
      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: openfantasy/yadgar-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get-backend-version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push core image
        if: needs.changes.outputs.core == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          # Registry-based BuildKit cache on dockerhub. Reused across runs on
          # the same builder; survives runner restarts unlike actions/cache.
          cache-from: type=registry,ref=openfantasy/yadgar:buildcache
          cache-to: type=registry,ref=openfantasy/yadgar:buildcache,mode=min

      - name: Build and push backend image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=openfantasy/yadgar-backend:buildcache
          cache-to: type=registry,ref=openfantasy/yadgar-backend:buildcache,mode=min

  # ── Build wheel + sdist ───────────────────────────────────────────────────
  build-wheel:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: [self-hosted, linux, x64, yadgar]
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    steps:
      # make, git, curl, ca-certificates, nodejs are pre-installed in yadgar-ci image.

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trust workspace (container runs as a different UID than checkout)
        run: git config --global --add safe.directory '*'

      - name: Install build tools
        run: pip install build

      - name: Get version from pyproject.toml
        id: get-version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ steps.get-version.outputs.version }}
          path: dist/
          retention-days: 7

  # ── Generate SBOM ─────────────────────────────────────────────────────────
  build-sbom:
    needs: [changes, build-wheel]
    if: needs.changes.outputs.release == 'true'
    # NOT continue-on-error: this job now carries the clean-venv wheel-install
    # gate (below), the only CI surface that resolves [project.dependencies].
    # A non-blocking gate is not a gate.
    runs-on: [self-hosted, linux, x64, yadgar]
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    steps:
      # make, git, nodejs are pre-installed in yadgar-ci image.

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trust workspace (container runs as a different UID than checkout)
        run: git config --global --add safe.directory '*'

      - name: Get version
        id: get-version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-${{ steps.get-version.outputs.version }}
          path: dist/

      - name: Install yadgar with sbom extra
        # Install from the local wheel built by build-wheel job (already in dist/).
        # This avoids a PyPI roundtrip and guarantees we test the exact artifact
        # being released. Wheel filename: yadgar-<version>-py3-none-any.whl.
        run: |
          pip install --upgrade pip
          pip install "dist/yadgar-${{ steps.get-version.outputs.version }}-py3-none-any.whl[sbom]"

      - name: Clean-venv wheel install + entry-point smoke
        # The ONLY CI surface that resolves [project.dependencies].
        #
        # Every test job installs `uv pip install --system --no-deps -e .`
        # against deps baked into the yadgar-ci image from uv.lock (ADR-0089),
        # so a dep present in the image but missing from [project.dependencies]
        # is invisible to all of them. The sbom install above does not close
        # that gap either — it runs in the same pre-baked image against system
        # site-packages, so pip finds everything already satisfied and resolves
        # nothing. Only an ISOLATED venv (no --system-site-packages) forces a
        # real resolve: the `ModuleNotFoundError: No module named 'surrealdb'`
        # class that reached a real install.
        #
        # The sbom install is deliberately left in the ambient environment:
        # generate_sbom.sh runs `cyclonedx-py environment`, which introspects
        # the ACTIVE env.
        #
        # Executed targets are read-only BY DESIGN. `yadgar-nightly-cycle` and
        # `yadgar-setup` are import-probed, never executed: nightly-cycle has
        # no --help handling and immediately starts a real backup and kills
        # spawned surreal processes; yadgar-setup execv's setup.sh. Probing the
        # `module:func` target is what actually catches a packaging break.
        run: |
          set -euo pipefail
          python3 -m venv /tmp/cleanvenv
          /tmp/cleanvenv/bin/pip install --upgrade pip
          /tmp/cleanvenv/bin/pip install "dist/yadgar-${{ steps.get-version.outputs.version }}-py3-none-any.whl"

          # Console script + `-m` targets verified safe to execute (exit 0).
          /tmp/cleanvenv/bin/yadgar --version
          /tmp/cleanvenv/bin/python -m yadgar --version
          /tmp/cleanvenv/bin/python -m yadgar.backend.safe_start --help

          # Resolve-only probes for the surface that must not be executed.
          # find_spec does NOT execute the module — it is exactly the check
          # that catches a missing __main__.py (the ADR-0084 safe_start
          # regression: `python -m yadgar.backend.safe_start` broke because the
          # package had no __main__.py, and no console-script test saw it).
          /tmp/cleanvenv/bin/python -c "
          import importlib, importlib.util
          for mod, fn in [
              ('yadgar.__main__', 'cli'),
              ('yadgar.core.scripts.nightly_cycle', 'main'),
              ('yadgar.core.scripts.yadgar_setup', 'main'),
          ]:
              assert callable(getattr(importlib.import_module(mod), fn)), mod
          for mod in ('yadgar.__main__', 'yadgar.backend.safe_start.__main__'):
              assert importlib.util.find_spec(mod) is not None, mod
          print('entry-point surface OK')
          "

      - name: Generate CycloneDX SBOM
        env:
          SBOM_VERSION: ${{ steps.get-version.outputs.version }}
          SBOM_OUTPUT: dist/yadgar-${{ steps.get-version.outputs.version }}-sbom.cdx.json
        run: bash scripts/generate_sbom.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > CHECKSUMS.txt
          echo "==> Checksums:"
          cat CHECKSUMS.txt

      - name: Upload dist + sbom + checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-assets-${{ steps.get-version.outputs.version }}
          path: dist/
          retention-days: 30

  # ── Publish to PyPI ───────────────────────────────────────────────────────
  # Uses twine upload with an API token (same mechanism as the Forgejo source —
  # kept as the smaller faithful change over switching to PyPI Trusted
  # Publishing/OIDC, which would require reconfiguring the PyPI project itself).
  # PYPI_API_TOKEN must be configured in GitHub repo Settings → Secrets and
  # variables → Actions → Secrets.
  publish-pypi:
    needs: [changes, build-wheel]
    if: needs.changes.outputs.release == 'true'
    runs-on: [self-hosted, linux, x64, yadgar]
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trust workspace (container runs as a different UID than checkout)
        run: git config --global --add safe.directory '*'

      - name: Get version from pyproject.toml
        id: get-version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-${{ steps.get-version.outputs.version }}
          path: dist/

      - name: Install twine
        run: pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  # ── Create GitHub release + attach assets ─────────────────────────────────
  # GitHub-native replacement for the Forgejo source's manual `git push` tag +
  # curl-the-Forgejo-API release job. softprops/action-gh-release creates the
  # tag (at the current commit) AND the release AND uploads assets in one step,
  # idempotently (safe to re-run — it updates the existing release/assets).
  tag-and-release:
    needs: [changes, publish-pypi, build-images]
    if: needs.changes.outputs.release == 'true'
    runs-on: [self-hosted, linux, x64, yadgar]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get version
        id: get-version
        # Bare on the self-hosted runner host (no container:) — python3 here
        # isn't guaranteed to be 3.11+ (tomllib is stdlib-only from 3.11).
        # tomli is the same API as a pip package that works on any python3.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check tomli==2.4.1
          echo "version=$(python3 -c "import tomli as tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Determine prerelease flag
        id: prerelease
        env:
          RELEASE_VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          if [[ "$RELEASE_VERSION" == *alpha* || "$RELEASE_VERSION" == *beta* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-assets-${{ steps.get-version.outputs.version }}
          path: dist/

      - name: Create GitHub Release (tags HEAD + uploads assets)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          name: yadgar ${{ steps.get-version.outputs.version }}
          body: "Release ${{ steps.get-version.outputs.version }}. See CHANGELOG.md for details."
          prerelease: ${{ steps.prerelease.outputs.value }}
          fail_on_unmatched_files: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
