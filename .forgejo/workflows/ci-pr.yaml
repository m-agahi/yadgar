name: CI (PR)

on:
  pull_request:
    branches: [master]
    # Docs-only changes skip CI (docs go direct to master, no PR). Workflow-only
    # changes skip too — the test suite doesn't validate workflow YAML; validate.yaml
    # (yaml/actionlint) still runs on .forgejo edits as the safety net. Skips a run
    # only when EVERY changed path matches — mixed code+docs/ci PRs still run.
    paths-ignore:
      - 'benchmarks/**'
      - 'docs/**'
      - '.forgejo/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'flake.nix'
      - 'flake.lock'
      - 'MIGRATION_NOTES.md'
      - '.gitignore'
  # Master baseline — ON DEMAND ONLY. There is no cron here on purpose.
  #
  # A nightly `schedule:` used to live at this spot, mirrored from the GitHub
  # workflow. It was never asked for, and on the GitHub side the runner is the
  # OWNER'S LAPTOP: a single self-hosted box that the cron saturated during
  # working hours. Removed there; removed here too so the mirrors stay in
  # parity and the pattern does not creep back via this file.
  #
  # The baseline stays available on demand — trigger it from the Actions tab.
  #
  # Do not re-add `schedule:` without the repo owner explicitly asking.
  workflow_dispatch:

# Cancel superseded test runs on a fresh push to the same PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# YADGAR_TEST_SKIP_RUNTIME_CHECK: skip container-runtime detection in Makefile
# pre-setup target when podman/docker is absent in CI runner (P8 fix v5.46.7).
env:
  YADGAR_TEST_SKIP_RUNTIME_CHECK: "1"

jobs:
  # ── Test groups (Car J1: module groups, not a fake dependency chain) ─────────
  #
  # Mirror of .github/workflows/ci-pr.yml's `tests` job. See that file's header
  # knob block and this job's comments there for the full rationale; the short
  # version is that the `needs:` chain between test jobs was a RESOURCE cap
  # wearing a DEPENDENCY primitive's clothes, and the cap now lives on
  # max-parallel where it belongs.
  #
  # THIS MIRROR IS WHERE THE CAP ACTUALLY BITES. The GitHub side has exactly one
  # self-hosted runner, which takes one job at a time, so max-parallel is inert
  # there until a second runner is registered. The Forgejo runner's config.yaml
  # sets `capacity: 2` — two jobs genuinely run at once here, so this is the
  # mirror on which the 2026-07-09 ceiling (ADR-0073/0079) is being held.
  #
  # Group packing is identical to the GitHub mirror by construction: five
  # module-scoped groups plus a duration-sharded `core` (yadgar/tests/core/ is
  # a flat 242-file directory with no subpackages to split on).
  tests:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_XET: '1'
      HF_HOME: ${{ vars.HF_HOME }}
      YADGAR_OTLP_ENDPOINT: ''
    strategy:
      fail-fast: false
      # LITERAL ON PURPOSE — DO NOT turn this into ${{ vars.CI_MAX_PARALLEL }}.
      # The GitHub mirror drives this from a repo variable; Forgejo cannot.
      # act_runner's vendored act parses this key with a bare
      # `strconv.Atoi(s.MaxParallelString)` BEFORE any expression evaluation
      # (forgejo/act pkg/model/workflow.go GetMaxParallel; upstream
      # nektos/act#2619). An expression here does not fail loudly — Atoi errors,
      # the error is logged, and the value falls back to act's default of 4.
      # That is DOUBLE the ADR-0073 ceiling, on the one runner that actually
      # runs jobs concurrently (this runner's config.yaml sets capacity: 2), so
      # a silently-ignored expression here reproduces the 2026-07-09 OOM.
      # Consequence, stated plainly: raising concurrency is a Settings change on
      # GitHub but a PR on Forgejo. Keep this literal in step with the
      # CI_MAX_PARALLEL default in .github/workflows/ci-pr.yml's knob block.
      # test_ci_mirror_parity.py projects only job keys / needs / if — it does
      # NOT compare `strategy`, so nothing else will catch this drifting.
      max-parallel: 2
      matrix:
        include:
          - group: repo-guards
            paths: yadgar/tests/scripts/
          - group: server-api
            paths: yadgar/tests/server/
          - group: client-surfaces
            paths: yadgar/tests/hooks/ yadgar/tests/clients/ yadgar/tests/_meta/ yadgar/tests/restoration/
          - group: shared-storage
            paths: yadgar/tests/_shared/
          - group: backend-services
            paths: yadgar/tests/backend/
          - group: core-1
            paths: yadgar/tests/core/
            split: --splits 2 --group 1 --splitting-algorithm least_duration
          - group: core-2
            paths: yadgar/tests/core/
            split: --splits 2 --group 2 --splitting-algorithm least_duration
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-

      - name: Install dependencies
        # Deps are BAKED into yadgar-ci FROM uv.lock (lock parity — ADR-0089).
        # --no-deps installs only the yadgar package itself; nothing re-resolves
        # at run time, so CI cannot drift past the lock. Missing dep = rebuild
        # the image (fail-loud by design).
        run: |
          uv pip install --system --no-deps -e .

      - name: Assert this group selects tests (zero selection is a silent pass)
        # Two independent signals — pytest's exit code (5 = no tests collected,
        # 4 = path/usage error) AND the parsed summary count. See the GitHub
        # mirror's comment on this step for the verified summary-line shapes.
        run: |
          set -o pipefail
          rc=0
          python -m pytest ${{ matrix.paths }} ${{ matrix.split }} \
            -m 'not integration and not e2e and not perf' \
            -n 0 -q --collect-only > collect-${{ matrix.group }}.txt 2>&1 || rc=$?
          collected=$(sed -n 's/^\([0-9]\{1,\}\)[/0-9]* tests\{0,1\} collected.*/\1/p' \
            collect-${{ matrix.group }}.txt | tail -1)
          if [ "$rc" -ne 0 ] || [ -z "$collected" ] || [ "$collected" -eq 0 ]; then
            echo "group '${{ matrix.group }}' did not collect a usable test set" >&2
            echo "  paths        : ${{ matrix.paths }}" >&2
            echo "  split        : ${{ matrix.split }}" >&2
            echo "  pytest exit  : $rc (5 = no tests collected, 4 = path/usage error)" >&2
            echo "  parsed count : '${collected}'" >&2
            echo "A group that collects nothing passes for the wrong reason." >&2
            tail -30 collect-${{ matrix.group }}.txt >&2
            exit 1
          fi
          echo "group '${{ matrix.group }}' selects ${collected} tests"

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest ${{ matrix.paths }} ${{ matrix.split }} \
            -q -rs --tb=short \
            -n ${{ vars.CI_PYTEST_WORKERS || '4' }} --dist loadgroup \
            --reruns 2 --reruns-delay 2 \
            -m 'not integration and not e2e and not perf' \
            2>&1 | tee pytest-rs-${{ matrix.group }}.txt

      - name: Upload -rs output for skip gate
        if: ${{ always() }}
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: pytest-rs-${{ matrix.group }}
          path: pytest-rs-${{ matrix.group }}.txt
          retention-days: 1

  test-perf:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    # Serial perf-guard job: runs only @pytest.mark.perf tests without xdist
    # (-n 0 overrides addopts -n 4 while keeping the plugin loaded — avoids
    # "unrecognized arguments: -n" that -p no:xdist triggers against addopts).
    # ~3 tests, lightweight; dedicated job so timing is trustworthy.
    #
    # NO `needs:` (Car J1) — it used to chain behind the four test jobs with the
    # comment "scheduling throttle only", i.e. an admitted non-dependency. The
    # cap it faked now lives on the `tests` matrix's max-parallel.
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_XET: '1'
      HF_HOME: ${{ vars.HF_HOME }}
      YADGAR_OTLP_ENDPOINT: ''
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-

      - name: Install dependencies
        # Deps are BAKED into yadgar-ci FROM uv.lock (lock parity — ADR-0089).
        # --no-deps installs only the yadgar package itself; nothing re-resolves
        # at run time, so CI cannot drift past the lock. Missing dep = rebuild
        # the image (fail-loud by design).
        run: |
          uv pip install --system --no-deps -e .

      - name: Run perf guards (serial)
        run: |
          python -m pytest yadgar/tests/ \
            -m perf \
            -n 0 \
            -q --tb=short

  # engine #2 (MariaDB) integration — task #26; mirrors .github's job of the
  # same name. The engine-#2 tests carry the integration marker, and every
  # other job's marker filter excludes it, so this suite never ran in CI —
  # that is how a migration chain that cannot run under production's own
  # grants shipped and stayed broken for months.
  #
  # BARE ON THE RUNNER HOST — no `container:`. The yadgar-ci image the other
  # jobs use has no podman; this suite needs a real mariadb container, and
  # the runner host does have podman.
  #
  # A SKIPPED RUN IS NOT A PASS. The fixture calls pytest.skip when no
  # container runtime is found, and a job that skips everything exits 0 and
  # looks green — the runtime is asserted up front, and the run must have
  # COLLECTED tests and reported zero skips.
  test-engine2-integration:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Assert a WORKING container runtime is present (a skip here is a failure)
        # `command -v` (the original check) only proves a binary is on PATH.
        # On the GitHub mirror's runner that passed while the suite still
        # skipped everything: `podman` is on PATH but cannot actually start
        # anything there (car G5 — nested rootless podman fails "cannot
        # re-exec process" inside that runner's own docker:dind sidecar
        # container). Run a real throwaway container per candidate runtime
        # instead of just checking the binary exists — exercises the exact
        # capability the tests below need, on whichever runtime this mirror's
        # runner actually has working.
        run: |
          set -euo pipefail
          runtime=""
          for candidate in podman docker; do
            if command -v "$candidate" >/dev/null 2>&1 && \
               "$candidate" run --rm docker.io/library/alpine:3 true >/dev/null 2>&1; then
              runtime="$candidate"
              break
            fi
          done
          if [ -z "$runtime" ]; then
            echo "no WORKING container runtime on the runner host (podman/docker may be" >&2
            echo "on PATH but unable to actually start a container) — the engine-#2 suite" >&2
            echo "cannot run, and a silent skip is what let a broken migration ship." >&2
            echo "Failing loudly." >&2
            exit 1
          fi
          echo "using $runtime as the working container runtime"

      - name: Install mariadb client (mariadb-dump / mariadb — needed by the dump/restore arms)
        # Bare runner host, no image to inherit these from. Without this,
        # test_mariadb_dump_arm.py / test_mariadb_restore_arm.py skip via
        # their own `shutil.which("mariadb-dump")` / `shutil.which("mariadb")`
        # guards even once a working container runtime is found (car G5).
        # Package-manager-portable: this mirror's runner host is not
        # guaranteed to be the same distro as the GitHub mirror's.
        #
        # NOT THE DISTRO PACKAGE on apt hosts. The GitHub mirror's runner is
        # Ubuntu 20.04, whose `mariadb-client` is MariaDB 10.3 — old enough to
        # predate the `mysqldump` -> `mariadb-dump` rename (10.5). apt
        # SUCCEEDED there while `mariadb-dump` stayed absent, and every one of
        # the 15 skips left in GH run 31677402827 was that single cause.
        # Production resolves the binary by that exact name (`backup_sql.py`:
        # which("mariadb-dump")), so symlinking 10.3's `mysqldump` over it
        # would satisfy the guard with the wrong binary under a false name.
        # MariaDB's own repo publishes 11.4 for these codenames — the same
        # series as the server image the fixtures start. Alpine's own
        # `mariadb-client` is already new enough, so apk is left alone.
        run: |
          set -euo pipefail
          SUDO=""
          command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          if command -v apt-get >/dev/null 2>&1; then
            . /etc/os-release
            codename="${VERSION_CODENAME:-}"
            if [ -z "$codename" ]; then
              echo "/etc/os-release carries no VERSION_CODENAME; cannot pick a MariaDB repo" >&2
              exit 1
            fi
            $SUDO install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://mariadb.org/mariadb_release_signing_key.pgp \
              | $SUDO tee /etc/apt/keyrings/mariadb.pgp > /dev/null
            echo "deb [signed-by=/etc/apt/keyrings/mariadb.pgp] https://mirror.mariadb.org/repo/11.4/${ID} ${codename} main" \
              | $SUDO tee /etc/apt/sources.list.d/mariadb.list > /dev/null
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends mariadb-client
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache mariadb-client
          else
            echo "no known package manager (apt-get/apk) to install mariadb-client" >&2
            exit 1
          fi
          # Fail HERE rather than as a skip three minutes into the suite.
          for binary in mariadb-dump mariadb; do
            command -v "$binary" >/dev/null 2>&1 || {
              echo "$binary is STILL absent after installing mariadb-client" >&2
              exit 1
            }
          done
          mariadb-dump --version

      - name: Install uv (bare host, no container to inherit it from)
        # An earlier version of the .github mirror's twin job did
        # `python3 -m pip install uv`, which resolves through whatever
        # `python3` is on the runner's PATH and left `python3 -m uv` unable
        # to find the fetched binary (uv._find_uv.UvNotFound). The official
        # installer places a real `uv` binary at ~/.local/bin/uv directly.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Provision Python 3.14 (requires-python >=3.14; system python3 here is 3.8)
        run: uv python install 3.14

      - name: Sync the sql + test extras
        # The `sql` extra (sqlalchemy + asyncmy + alembic) is NOT baked into
        # yadgar-ci, and this job does not use that image anyway.
        run: uv sync --python 3.14 --extra sql --extra test

      - name: Run the engine-#2 integration suite
        # `-rf` (the original flag) reports FAILURES only — a skip reason is
        # never printed, so a run that skips everything leaves the artifact
        # with nothing to diagnose from but "s" characters (car G5: the
        # GitHub mirror's run showed 41 skipped in 2.31s, cause invisible
        # from the artifact alone). `-ra` reports every non-passing outcome,
        # including skip reasons.
        #
        # THE FILE LIST BELOW IS HAND-MAINTAINED AND WAS WRONG (task #77):
        # every file here carries `pytest.mark.xdist_group("engine2_mariadb")`
        # in addition to `integration`, but three siblings that carry the same
        # xdist_group tag were never added — test_cross_engine_invariants.py
        # said so in its own docstring, and the two newest files (Car B's
        # row-constructor fix, Car C2's NULL-clearing fix) landed marked
        # `integration` and were therefore silently EXCLUDED by every other
        # job's `-m 'not integration and not e2e and not perf'` — never run
        # anywhere. `yadgar/tests/scripts/test_engine2_integration_coverage.py`
        # now gates this list against the marker so a future omission fails
        # loudly instead of vanishing the same way.
        run: |
          set -o pipefail
          uv run --python 3.14 --extra sql --extra test python -m pytest \
            yadgar/tests/integration/test_mariadb_migrations.py \
            yadgar/tests/integration/test_mariadb_connection.py \
            yadgar/tests/integration/test_mariadb_dump_arm.py \
            yadgar/tests/integration/test_mariadb_restore_arm.py \
            yadgar/tests/integration/test_cross_engine_invariants.py \
            yadgar/tests/integration/test_task_list_status_filter.py \
            yadgar/tests/integration/test_task_write_clear_columns.py \
            yadgar/tests/integration/test_task_edges_and_paging.py \
            yadgar/tests/integration/test_adr_seed_ledger_ids.py \
            -m integration \
            -n 0 \
            -q -ra --tb=short \
            2>&1 | tee pytest-engine2.txt

      - name: Gate on tests having actually RUN
        # `0 passed` and `N skipped` both exit 0. Neither is evidence.
        run: |
          set -euo pipefail
          if grep -qE '[0-9]+ skipped' pytest-engine2.txt; then
            echo "the engine-#2 suite skipped tests — a skipped privilege test is not a pass:" >&2
            grep -E '[0-9]+ skipped' pytest-engine2.txt >&2
            exit 1
          fi
          grep -qE '[1-9][0-9]* passed' pytest-engine2.txt || {
            echo "the engine-#2 suite collected nothing" >&2
            exit 1
          }

      - name: Upload output
        if: ${{ always() }}
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: pytest-engine2
          path: pytest-engine2.txt
          retention-days: 1

      - name: Resolve a PULLABLE backend image for the vacuum e2e suite
        # Mirror of the .github/workflows/ci-pr.yml step — see its comment for
        # the full reasoning. Short version: server.json holds the PENDING
        # backend_version, images are published at RELEASE, so on a
        # version-bumping PR the derived tag does not exist and the fixture
        # SKIPS — which the gate below treats as a failure. Resolve a tag that
        # can actually be pulled, warn loudly when falling back, and fail hard
        # rather than skip when neither pulls.
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          PENDING=$(python3 -c "import json;print(json.load(open('server.json'))['backend_version'])")
          BASE=$(git show origin/master:server.json \
                   | python3 -c "import json,sys;print(json.load(sys.stdin)['backend_version'])")
          REPO=docker.io/openfantasy/yadgar-backend
          if docker manifest inspect "$REPO:$PENDING" >/dev/null 2>&1; then
            IMG="$REPO:$PENDING"
            echo "vacuum e2e: backend $PENDING is published — testing the pending image"
          else
            IMG="$REPO:$BASE"
            echo "::warning::vacuum e2e: backend $PENDING is not published yet; falling back to master's $BASE"
            echo "::warning::vacuum e2e: backend changes in THIS PR are NOT validated by this job"
          fi
          docker pull "$IMG" || {
            echo "neither $REPO:$PENDING nor $REPO:$BASE could be pulled" >&2
            exit 1
          }
          echo "YADGAR_TEST_BACKEND_IMAGE=$IMG" >> "$GITHUB_ENV"

      - name: Run the vacuum e2e integration suite (task 156 / car A3)
        # yadgar/tests/integration/test_vacuum_e2e.py and
        # yadgar/tests/integration/test_conftest_backend_pin.py were in NO CI
        # job at all — unlike the engine-#2 files above (excluded only by
        # every OTHER job's marker filter, and covered here), the whole
        # `yadgar/tests/integration/` directory is absent from the `tests`
        # matrix's `paths:` entries, so nothing ever passed either file to
        # pytest, marker or no marker. This job already asserted a WORKING
        # container runtime above, which is exactly what
        # `live_backend_container` (test_vacuum_e2e.py's fixture) needs;
        # test_conftest_backend_pin.py needs no container but lives beside it.
        #
        # `-o addopts='-n 0'` REPLACES pyproject's default addopts (which
        # excludes the integration and e2e marks) instead of appending to it,
        # so test_vacuum_e2e.py's `integration` marker does not deselect it —
        # deliberately no `-m` flag on this line at all: a quoted marker
        # string anywhere in this job's text would make
        # scripts/check_ci_local_parity.py's shape-based stray-job scan
        # misfile this job as an uncovered subsystem leg (see the comment
        # above `test-engine2-integration:` — same landmine, same reason it
        # writes no quoted marker either). `-n 0` because
        # `live_backend_container` is module-scoped and does docker
        # stop/start; xdist workers would race the same container.
        run: |
          set -o pipefail
          uv run --python 3.14 --extra sql --extra test python -m pytest \
            yadgar/tests/integration/test_vacuum_e2e.py \
            yadgar/tests/integration/test_conftest_backend_pin.py \
            -o addopts='-n 0' \
            -q -ra --tb=short \
            2>&1 | tee pytest-vacuum-e2e.txt

      - name: Gate on vacuum e2e tests having actually RUN
        # Same discipline as the engine-#2 gate above: a full skip (e.g. the
        # container runtime assertion above passed but the backend image
        # itself failed to pull/start) exits 0 and looks green. A real test
        # failure already fails the step above via pipefail; this step only
        # exists to catch the skip case that wouldn't.
        run: |
          set -euo pipefail
          if grep -qE '[0-9]+ skipped' pytest-vacuum-e2e.txt; then
            echo "the vacuum e2e suite skipped tests — a skip here is not a pass:" >&2
            grep -E '[0-9]+ skipped' pytest-vacuum-e2e.txt >&2
            exit 1
          fi
          grep -qE '[1-9][0-9]* (passed|failed)' pytest-vacuum-e2e.txt || {
            echo "the vacuum e2e suite collected nothing" >&2
            exit 1
          }

      - name: Upload vacuum e2e output
        if: ${{ always() }}
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: pytest-vacuum-e2e
          path: pytest-vacuum-e2e.txt
          retention-days: 1

  check-skip-inventory:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    # Validates every test group's pytest -rs skip summary WITHOUT re-running
    # any test.  The original Car 1 gate re-ran all the leg paths as an extra
    # full-suite run: doubled CI wall time, added another OOM-class load to the
    # co-hosted runner (ADR-0079), and its pipe buffered so the job looked hung
    # for 20+ minutes.  Now the groups tee their own -rs output to artifacts and
    # this job just parses the text — runtime is seconds.
    # No pip install: check_skip_inventory.py and ci_group_manifest.py are both
    # stdlib-only.
    #
    # This `needs:` IS a real dependency, unlike the ones Car J1 deleted: this
    # job consumes the artifacts those groups produce.
    needs: [tests]
    if: ${{ always() }}
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      # ONE STEP PER MATRIX GROUP — deliberately enumerated, unlike the GitHub
      # mirror's single `pattern: pytest-rs-*` download. Forgejo pins
      # download-artifact@v3.1.0, and `pattern:` / `merge-multiple:` are v4
      # inputs; v3 ignores unknown inputs, so a pattern here would download
      # NOTHING and the gate would fail confusingly rather than work.
      # A hand-enumerated list can go stale when a group is added — which is
      # exactly why the gate below derives its expected count from
      # scripts/ci_group_manifest.py instead of a literal: a group added to the
      # matrix without a download step here fails the count check loudly.
      - name: Download group -rs output (repo-guards)
        uses: https://data.forgejo.org/actions/download-artifact@v3.1.0
        with:
          name: pytest-rs-repo-guards
          path: rs-logs/
      - name: Download group -rs output (server-api)
        uses: https://data.forgejo.org/actions/download-artifact@v3.1.0
        with:
          name: pytest-rs-server-api
          path: rs-logs/
      - name: Download group -rs output (client-surfaces)
        uses: https://data.forgejo.org/actions/download-artifact@v3.1.0
        with:
          name: pytest-rs-client-surfaces
          path: rs-logs/
      - name: Download group -rs output (shared-storage)
        uses: https://data.forgejo.org/actions/download-artifact@v3.1.0
        with:
          name: pytest-rs-shared-storage
          path: rs-logs/
      - name: Download group -rs output (backend-services)
        uses: https://data.forgejo.org/actions/download-artifact@v3.1.0
        with:
          name: pytest-rs-backend-services
          path: rs-logs/
      - name: Download group -rs output (core-1)
        uses: https://data.forgejo.org/actions/download-artifact@v3.1.0
        with:
          name: pytest-rs-core-1
          path: rs-logs/
      - name: Download group -rs output (core-2)
        uses: https://data.forgejo.org/actions/download-artifact@v3.1.0
        with:
          name: pytest-rs-core-2
          path: rs-logs/

      - name: Gate skip inventory (parse group artifacts — no test execution)
        # EVERY group's output must be present — a missing artifact fails loudly
        # rather than silently narrowing the gate to whatever did upload.
        # The expected count is DERIVED from the matrix, never a literal: it was
        # `-ne 5`, and a hardcoded number stops discriminating the moment a
        # group is added.
        run: |
          set -o pipefail
          expected=$(python scripts/ci_group_manifest.py --count)
          if [ -z "$expected" ] || [ "$expected" -lt 1 ]; then
            echo "could not derive the expected group count from ci-pr.yml" >&2
            exit 1
          fi
          count=$(ls rs-logs/pytest-rs-*.txt 2>/dev/null | wc -l)
          if [ "$count" -ne "$expected" ]; then
            echo "expected $expected group -rs artifacts (one per matrix group), found $count:" >&2
            python scripts/ci_group_manifest.py --names >&2
            ls -la rs-logs/ >&2
            exit 1
          fi
          cat rs-logs/pytest-rs-*.txt | python scripts/check_skip_inventory.py

      - name: Validate inventory governance (ADR-0087 — stale entries, note length, wildcards)
        run: python scripts/check_skip_inventory.py --validate-inventory

  invariant-checks:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    container:
      image: docker.io/openfantasy/yadgar-ci:${{ vars.YADGAR_VERSION }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          # fetch-depth: 0 — check_test_weakening --ci needs the merge-base with
          # origin/master. A shallow checkout cannot reach it and the guard
          # fail-opens (the exact CI-inertness this job now closes).
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-

      - name: Install dependencies
        # Deps are BAKED into yadgar-ci FROM uv.lock (lock parity — ADR-0089).
        # --no-deps installs only the yadgar package itself; nothing re-resolves
        # at run time, so CI cannot drift past the lock. Missing dep = rebuild
        # the image (fail-loud by design).
        run: |
          uv pip install --system --no-deps -e .

      - name: Check I23 — declared metrics must have writers
        run: python scripts/check_metric_writers.py

      - name: Check I24 — public HTTP handlers must have @trace_span
        run: python scripts/check_trace_spans.py

      - name: Check I33 — tri-signal observe-coverage (HARD; MISSING=0 enforced, closes #8)
        run: python scripts/check_observe_coverage.py

      - name: Check I25 / I25b — config three-way-sync + default-value agreement
        # Both files, matching the check-config-three-way-sync pre-commit hook.
        # I25 compares PRESENCE across Settings/yaml/registry; I25b compares the
        # declared default against the code default it documents (task:0103).
        # Naming only the I25 file here would leave I25b enforced locally and
        # invisible in CI — the same gate-blindness class I25b exists to close.
        run: >-
          python -m pytest
          yadgar/tests/server/test_config_three_way_sync.py
          yadgar/tests/server/test_config_default_values.py
          -q --tb=short

      - name: Check I29 — edge dead-capability lint (produced ≡ contracted, no drop-still-produced)
        run: python scripts/check_dead_capability.py

      - name: Check I32 — capability-registry coverage (every setting/tool/migration/BC catalogued)
        run: python scripts/check_capability_coverage.py

      - name: Check I32 prose-liveness — registry must not cite dead identifiers
        # Companion to the I32 coverage lint above, NOT a replacement. That lint
        # covers four enumerable identifier surfaces and never reads explanation:/
        # wiring: prose — which is why it ran green on the PR that made
        # CAP-CODEGRAPH-001's prose false. This one gates the prose tokens.
        run: python scripts/check_registry_prose_liveness.py

      - name: Check model-id liveness — config default ↔ image bake ↔ code literal
        # Task 0121. Neither I32 lint sees this axis: coverage enumerates setting
        # NAMES and never reads a default, and prose-liveness measures identifier
        # death while every identifier here is alive. Both were green on the tree
        # whose CROSS_ENCODER_MODEL made two readers name the wrong reranker.
        run: python scripts/check_model_id_liveness.py

      - name: Check every bundled third-party binary is catalogued and shipped
        # SurrealDB (BUSL-1.1 — its own text says "not an Open Source license")
        # shipped in openfantasy/yadgar-backend and openfantasy/yadgar-ci for
        # many releases with no license anywhere in the image, because a
        # bare-binary `COPY --from` carries nothing but the binary and the
        # source image ships no license file at all. This gate keeps that from
        # recurring. Note the real gate is on the PUBLISH path in ci-release —
        # this step is the earlier, cheaper mirror of it.
        run: python scripts/check_third_party_licenses.py

      - name: Check internal route literals resolve to registered routes
        # core/vacuum POSTed /api/check_invariants for months with no route behind
        # it, and six tests mocked that URL to 200 — the mocks agreed with the
        # caller and nothing compared either against the route table.
        run: python scripts/check_route_literals.py

      - name: Check urllib HTTPError/response call sites close the file wrapper (Car 0036)
        # On py3.14 a caught urllib.error.HTTPError (or an unclosed successful
        # urlopen() response) leaks a tempfile wrapper / socket and fires a
        # spurious ResourceWarning at GC — fatal under the zero-warning gate
        # (ADR-0087). Anti-recurrence guard for the Car 0036 sweep.
        run: python scripts/check_urllib_httperror_close.py

      - name: Layer 4 — block silent test weakening across the branch (#52)
        # --ci --base origin/master: the pre-commit path reads `git diff --cached`,
        # which is ALWAYS empty in a CI checkout — so the guard ran, printed OK and
        # could never fail. This step evaluates the cumulative branch diff vs the
        # merge-base instead, which is the question a PR actually poses.
        # NO env: block here, and none may be added. A sanctioned deletion is
        # recorded per file in .test-weakening-allowlist.json, in the repo, in the
        # diff a reviewer reads — not in a label-gated environment variable that
        # silences every file at once from outside the repository.
        run: python scripts/check_test_weakening.py --ci --base origin/master

  # Gateway: aggregates the test matrix plus the auxiliary gating jobs.
  # if: always() is required — without it this job is SKIPPED (not failed)
  # when any gated job fails, which would leave the PR green incorrectly.
  #
  # `tests` is ONE entry for the whole matrix: a matrix job's `result` is the
  # aggregate over its groups, so with `fail-fast: false` a single failing group
  # still lands here as `failure` — the gate cannot go stale when a group is
  # added or removed.
  test-gate:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    needs: [tests, test-perf, test-engine2-integration, check-skip-inventory]
    if: ${{ always() }}
    steps:
      - name: Assert all gated jobs passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "tests matrix failed (result: ${{ needs.tests.result }})"
            exit 1
          fi
          if [ "${{ needs.test-perf.result }}" != "success" ]; then
            echo "test-perf failed (result: ${{ needs.test-perf.result }})"
            exit 1
          fi
          if [ "${{ needs.test-engine2-integration.result }}" != "success" ]; then
            echo "test-engine2-integration failed (result: ${{ needs.test-engine2-integration.result }})"
            exit 1
          fi
          if [ "${{ needs.check-skip-inventory.result }}" != "success" ]; then
            echo "check-skip-inventory failed (result: ${{ needs.check-skip-inventory.result }})"
            exit 1
          fi
          echo "All gated jobs passed."

  viz-tests:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    # Use yadgar-ci-viz which extends yadgar-ci with Playwright + Chromium pre-baked.
    # Saves ~75s vs inline apt-get install on every run (v5.46.9 CI speedup).
    container:
      image: docker.io/openfantasy/yadgar-ci-viz:${{ vars.YADGAR_VERSION }}
    steps:
      # Playwright + Chromium + SurrealDB + HF model pre-baked in yadgar-ci-viz.
      # No apt-get install or binary download steps needed.

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-viz-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-viz-

      - name: Cache npm (viz-tests)
        uses: actions/cache@v4
        with:
          path: viz-tests/node_modules
          key: npm-viz-${{ hashFiles('viz-tests/package-lock.json') }}
          restore-keys: npm-viz-

      - name: Install Python dependencies
        # uv: required by test_v5_46_10_wheel_bundle (uv build --wheel subprocess).
        # Deps are BAKED into yadgar-ci FROM uv.lock (lock parity — ADR-0089).
        # --no-deps installs only the yadgar package itself; nothing re-resolves
        # at run time, so CI cannot drift past the lock. Missing dep = rebuild
        # the image (fail-loud by design).
        run: |
          uv pip install --system --no-deps -e .

      - name: Layer 1 — API contract integrity (Python)
        run: |
          python -m pytest yadgar/tests/server/test_graph_api_contract.py \
            -v --tb=short -q --reruns 1

      - name: Layer 2 — Playwright headless smoke
        # System chromium path pre-set via PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
        # env in yadgar-ci-viz image. No extra env needed here.
        run: |
          python -m pytest yadgar/tests/integration/viz/ \
            -m integration -v --tb=short -q --reruns 1

      - name: Install Node.js deps (Layer 3)
        working-directory: viz-tests
        # Resilient install: npm registry socket timeouts are a recurring CI flake.
        # Bump fetch retries/timeouts and retry the whole `npm ci` up to 3x.
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          ok=0
          for attempt in 1 2 3; do
            if npm ci; then ok=1; break; fi
            echo "npm ci attempt ${attempt} failed; retrying in 10s..." >&2
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "npm ci failed after 3 attempts" >&2; exit 1; }

      - name: Layer 3 — JS unit tests (Vitest)
        working-directory: viz-tests
        run: npx vitest run

  verify-version-bump:
    # Skip the version-bump gate when the PR carries the 'no-release' label
    # (docs/chore PRs that touch yadgar/** — e.g. contract-doc path pins — but
    # intentionally ship no version bump). Absent/empty label list → contains()
    # is false → !false = true → the gate RUNS (safe default; never silently
    # skips an unlabeled PR). Referenced by the error string below since v?; the
    # label + this guard were wired 2026-07-14.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-release') }}
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    container:
      image: python:3.14-slim
    steps:
      - name: Install runtime deps (nodejs for actions, git, ca-certs)
        run: apt-get update -qq && apt-get install -y --no-install-recommends nodejs git ca-certificates
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify version bump vs latest tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          PYPROJECT_VER=$(grep -E '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "v${PYPROJECT_VER}" = "${LATEST_TAG}" ]; then
            if git diff --name-only origin/master...HEAD | grep -qE '^yadgar/'; then
              echo "::error::pyproject.toml version (${PYPROJECT_VER}) matches latest tag (${LATEST_TAG}). Bump or add 'no-release' label."
              exit 1
            fi
          fi

      - name: Verify backend_version bump when backend changed (#83)
        # Uses --ci --base origin/master to diff the PR branch vs the merge-base
        # so backend build input changes (yadgar/backend/**, Dockerfile.backend,
        # entrypoint-backend.sh) that lack a server.json backend_version bump
        # fail the PR — closes the gap that let PR #144 slip through pre-commit.
        run: python scripts/check_backend_bump.py --ci --base origin/master
