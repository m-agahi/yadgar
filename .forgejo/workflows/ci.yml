---
name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "yadgar/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "entrypoint.sh"
      - "server.json"
  pull_request:
    branches: [master]
    paths:
      - "yadgar/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "entrypoint.sh"
      - "server.json"
      - ".pre-commit-config.yaml"

jobs:
  validate:
    runs-on: docker
    container:
      image: python:3.14-slim
    if: github.event_name == 'pull_request'
    steps:
      - name: Install Node.js, git, and gitleaks
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends nodejs git curl ca-certificates
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    runs-on: docker
    container:
      image: python:3.14-slim
    if: github.event_name == 'push'
    steps:
      - name: Install system deps
        run: apt-get update -qq && apt-get install -y --no-install-recommends nodejs git curl ca-certificates

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install SurrealDB v2.0.4
        run: |
          curl -sSL "https://github.com/surrealdb/surrealdb/releases/download/v2.0.4/surreal-v2.0.4.linux-amd64.tgz" \
            | tar -xz -C /usr/local/bin surreal

      - name: Start SurrealDB
        run: |
          surreal start --no-banner --bind 127.0.0.1:8000 \
            --user root --pass root surrealkv:///tmp/test_db &
          sleep 2

      - name: Cache HuggingFace models
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: /root/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -e ".[test]"

      - name: Run tests
        env:
          YADGAR_DB_URL: ws://127.0.0.1:8000
        run: python -m pytest -q --tb=short

  docker:
    needs: test
    runs-on: docker
    container:
      image: debian:bookworm-slim
    if: github.event_name == 'push'
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
    steps:
      - name: Install Docker CLI + buildx
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git curl gnupg ca-certificates python3
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian bookworm stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update && apt-get install -y --no-install-recommends \
            docker-ce-cli docker-buildx-plugin

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Detect platforms
        run: |
          if docker run --rm --privileged tonistiigi/binfmt --install all 2>/dev/null; then
            echo "QEMU registered — creating multi-arch builder"
            docker buildx create --name multiarch --driver docker-container --use
            docker buildx inspect --bootstrap
            echo "PLATFORMS=linux/amd64,linux/arm64" >> "$GITHUB_ENV"
          else
            echo "QEMU not available — building amd64 only"
            echo "PLATFORMS=linux/amd64" >> "$GITHUB_ENV"
          fi

      - name: Extract version
        run: |
          VERSION=$(python3 -c "
          import re
          print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))
          ")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push (master — latest only)
        if: github.ref == 'refs/heads/master'
        run: |
          docker buildx build \
            --platform "${{ env.PLATFORMS }}" \
            --target prod \
            -t looseking/yadgar:latest \
            --push \
            .

      - name: Build and push (tag — latest + version)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx build \
            --platform "${{ env.PLATFORMS }}" \
            --target prod \
            -t looseking/yadgar:latest \
            -t looseking/yadgar:${{ env.VERSION }} \
            --push \
            .
