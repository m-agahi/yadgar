name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
    # Only run CI on PRs that touch code/build inputs — not workflow-only or
    # docs-only PRs.
    paths:
      - "yadgar/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "Dockerfile.backend"
      - "entrypoint.sh"
      - "entrypoint-backend.sh"
      - "server.json"
  workflow_dispatch:

# Cancel superseded test runs on a fresh push to the same ref. Saves
# runner-hours on rapid push storms (otherwise a 5-min test job blocks
# the queue while the next commit's job waits, all on stale code).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Run in the python:3.14-slim image rather than via actions/setup-python —
    # the self-hosted runner's tool cache doesn't reliably have a 3.14 build
    # ("Version '3.14' ... was not found for this operating system"). The slim
    # image pins the exact interpreter.
    container:
      image: python:3.14-slim
    # PRs (gates the merge) and version tags (gates the PyPI publish) only.
    # NOT on pushes to master (already tested on the PR) and NOT on
    # workflow_dispatch (manual dispatch is "rebuild from latest master" — the
    # code was tested when its PR merged, so dispatch runs `build` alone).
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install system deps
        # nodejs+git for the JS actions runtime; curl for the SurrealDB download.
        run: apt-get update -qq && apt-get install -y --no-install-recommends nodejs git curl ca-certificates

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /root/.cache/huggingface
          # Static key — model weights don't change with pyproject bumps.
          # Restore-keys give us LRU fallback if the act_cache evicts us.
          key: hf-models-v2
          restore-keys: |
            hf-models-v
            hf-models-

      - name: Cache SurrealDB binary
        id: cache-surreal
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/surreal
          key: surrealdb-v3.0.5

      - name: Install SurrealDB v3.0.5
        if: steps.cache-surreal.outputs.cache-hit != 'true'
        run: |
          SURREAL_VERSION="v3.0.5"
          SURREAL_SHA256="48dbeba4896765f33e07acc25224073f0850c190872052b917ebda1f7b4375cb"
          curl -fsSL "https://github.com/surrealdb/surrealdb/releases/download/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz" -o /tmp/surreal.tgz
          echo "${SURREAL_SHA256}  /tmp/surreal.tgz" | sha256sum -c -
          tar -xzf /tmp/surreal.tgz -C /usr/local/bin surreal
          chmod +x /usr/local/bin/surreal

      - name: Install dependencies
        # No --no-cache-dir: the actions/cache step above mounts a persistent
        # pip cache at /root/.cache/pip; bypassing it re-downloads torch +
        # sentence-transformers (~1 GB) on every run.
        run: pip install -e ".[test,ml]"

      - name: Run tests
        # -n auto parallelises across CPU cores via pytest-xdist (already
        # in the [test] extra). --reruns: the suite shares a session-scoped
        # SurrealDB across xdist workers; a few server-globals tests flake on
        # worker ordering. Retry twice before counting a failure.
        run: python -m pytest yadgar/tests/ -q --tb=short -n auto --reruns 2 --reruns-delay 2

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      core:    ${{ steps.check.outputs.core }}
      backend: ${{ steps.check.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Detect per-image changes
        id: check
        # Tags always rebuild both (release moment).
        # Otherwise: per-image file globs + server.json version-field diff.
        # workflow_dispatch falls through with both=false unless the ref is a
        # tag — manual dispatch users can force via re-tagging if they want.
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "core=true"    >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            # First commit on a fresh checkout — build both, safe default
            echo "core=true"    >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only HEAD~1 HEAD)

          core_changed=false
          backend_changed=false

          # Per-image file globs. ci.yaml is deliberately NOT in either
          # pattern — workflow edits change orchestration, not image content.
          # If a ci.yaml change does require rebuilding (e.g. build-arg flip),
          # bump the affected version field in pyproject.toml or
          # server.json to force the rebuild explicitly.
          if grep -qE '^(Dockerfile$|entrypoint\.sh$|yadgar/|pyproject\.toml$)' <<<"$changed"; then
            core_changed=true
          fi
          if grep -qE '^(Dockerfile\.backend$|entrypoint-backend\.sh$)' <<<"$changed"; then
            backend_changed=true
          fi

          # server.json — only the relevant version field counts
          if grep -q '^server\.json$' <<<"$changed"; then
            old_core=$(git show HEAD~1:server.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
            new_core=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
            [[ "$old_core" != "$new_core" ]] && core_changed=true
            old_be=$(git show HEAD~1:server.json | python3 -c "import json,sys; print(json.load(sys.stdin)['backend_version'])")
            new_be=$(python3 -c "import json; print(json.load(open('server.json'))['backend_version'])")
            [[ "$old_be" != "$new_be" ]] && backend_changed=true
          fi

          echo "core=$core_changed"       >> "$GITHUB_OUTPUT"
          echo "backend=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "core_changed=$core_changed backend_changed=$backend_changed"

  build:
    needs: [changes]
    runs-on: ubuntu-latest
    # The self-hosted runner host has no `docker` binary — run inside docker:cli
    # (alpine), then apk-install the bits the JS actions / scripts need.
    container:
      image: docker:cli
    # Skip the whole job if neither image needs rebuilding (saves Build Cloud
    # minutes). Tags always rebuild both via the changes job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (needs.changes.outputs.core == 'true' || needs.changes.outputs.backend == 'true'))
    steps:
      - name: Install minimal tools
        # docker:cli already has the docker CLI. bash for heredocs, python3 for
        # the version extraction, nodejs+git for the JS actions, curl for runtime.
        run: apk add --no-cache bash python3 nodejs git curl

      - uses: https://data.forgejo.org/actions/checkout@v6

      # Log in BEFORE setting up buildx: the `cloud` driver fetches a Docker Hub
      # token to reach the remote builder (openfantasy/builder), so credentials
      # must already be present.
      - name: Log in to Docker Hub
        uses: https://github.com/docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx (Build Cloud)
        uses: https://github.com/docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: openfantasy/builder

      - name: Get version from pyproject.toml
        id: get-version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Get backend version from server.json
        id: get-backend-version
        run: |
          echo "version=$(python3 -c "import json; print(json.load(open('server.json'))['backend_version'])")" >> "$GITHUB_OUTPUT"

      # Generate tags for core image: latest + exact version on master, semver on tags
      - name: Docker metadata (core)
        id: meta-core
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: openfantasy/yadgar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get-version.outputs.version }},enable={{is_default_branch}}

      # Generate tags for backend image — version read from server.json:backend_version
      # so core and backend can be bumped independently.
      - name: Docker metadata (backend)
        id: meta-backend
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: openfantasy/yadgar-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get-backend-version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push core image
        if: needs.changes.outputs.core == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          # Registry-based BuildKit cache on dockerhub. Reused across runs on
          # the same builder; survives runner restarts unlike actions/cache.
          cache-from: type=registry,ref=openfantasy/yadgar:buildcache
          cache-to: type=registry,ref=openfantasy/yadgar:buildcache,mode=max

      - name: Build and push backend image
        if: needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=openfantasy/yadgar-backend:buildcache
          cache-to: type=registry,ref=openfantasy/yadgar-backend:buildcache,mode=max
