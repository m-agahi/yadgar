# WORKFLOW STATE: GATED FOR INTERNAL DEV (v5.46.8 hotfix, 2026-06-06)
#
# Per anchors 490140 (2026-05-18) + 491179 (2026-05-19) + PD-45 (2026-06-06):
# Internal dev workflow = local amd64 build + nix bump + home-manager switch
# + manual `twine upload` to PyPI. Forgejo CI is for PRODUCTION ONLY.
#
# All push/tag triggers gated to workflow_dispatch — only manual UI clicks
# fire jobs. When going production, remove the workflow_dispatch-only `if:`
# gates from job definitions.
#
# Do NOT remove this gate without re-checking with anchored workflow rules.
name: Release

# Triggers on version tags (v*). Active jobs: build-wheel, build-sbom, attach-to-release.
# Note: open-brew-pr removed per PD-39 (brew lane retired 2026-06-05).
# Note: open-nix-pr removed per PD-40 (nix cross-repo PR retired 2026-06-05;
#       pre-commit hook now syncs flake.nix on pyproject.toml bump).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Cancel superseded runs on the same tag (re-push scenario).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel in-progress releases

# Workflow-level env: YADGAR_CI_BRANCH tells the yadgar daemon which branch
# context to use in the CI runner (B2 fix — CI runner paths are anonymised
# so git branch detection fails without this hint). See docs/DECISIONS.md PD-42.
# YADGAR_TEST_SKIP_RUNTIME_CHECK: skip container-runtime detection in Makefile
# pre-setup target when podman/docker is absent in CI runner (P8 fix v5.46.7).
env:
  YADGAR_CI_BRANCH: master
  YADGAR_TEST_SKIP_RUNTIME_CHECK: "1"

jobs:
  # ── ACTIVE: Build wheel sdist ──────────────────────────────────────────────
  build-wheel:
    runs-on: ubuntu-latest
    # GATED: only fire on manual workflow_dispatch (PD-45). Remove this gate
    # when going production and re-enable tag-push-triggered releases.
    if: github.event_name == 'workflow_dispatch'
    container:
      image: docker.io/openfantasy/yadgar-ci:5.46.3
    steps:
      # make, git, curl, ca-certificates, nodejs are pre-installed in yadgar-ci image.
      # No apt-get install step needed for these system deps.

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install build tools
        run: pip install build

      - name: Get version from pyproject.toml
        id: get-version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: dist-${{ steps.get-version.outputs.version }}
          path: dist/
          retention-days: 7

  # ── ACTIVE: Generate SBOM ─────────────────────────────────────────────────
  build-sbom:
    needs: build-wheel
    runs-on: ubuntu-latest
    # GATED: only fire on manual workflow_dispatch (PD-45).
    if: github.event_name == 'workflow_dispatch'
    container:
      image: docker.io/openfantasy/yadgar-ci:5.46.3
    steps:
      # make, git, nodejs are pre-installed in yadgar-ci image.

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Download dist artifacts
        uses: https://data.forgejo.org/actions/download-artifact@v3.1.0
        with:
          name: dist-${{ steps.get-version.outputs.version }}
          path: dist/

      - name: Install yadgar with sbom extra
        # Install from the local wheel built by build-wheel job (already in dist/).
        # This avoids a PyPI roundtrip and guarantees we test the exact artifact
        # being released. Wheel filename: yadgar-<version>-py3-none-any.whl.
        run: |
          pip install --upgrade pip
          pip install "dist/yadgar-${{ steps.get-version.outputs.version }}-py3-none-any.whl[sbom]"

      - name: Generate CycloneDX SBOM
        env:
          SBOM_VERSION: ${{ steps.get-version.outputs.version }}
          SBOM_OUTPUT: dist/yadgar-${{ steps.get-version.outputs.version }}-sbom.cdx.json
        run: bash scripts/generate_sbom.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > CHECKSUMS.txt
          echo "==> Checksums:"
          cat CHECKSUMS.txt

      - name: Upload dist + sbom + checksums
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: release-assets-${{ steps.get-version.outputs.version }}
          path: dist/
          retention-days: 30

  # ── ACTIVE: Attach release assets to Codeberg release ─────────────────────
  attach-to-release:
    needs: build-sbom
    runs-on: ubuntu-latest
    # GATED: only fire on manual workflow_dispatch (PD-45).
    if: github.event_name == 'workflow_dispatch'
    container:
      image: docker.io/openfantasy/yadgar-ci:5.46.3
    steps:
      - name: Install jq
        # curl, nodejs pre-installed in yadgar-ci; jq is not — install here.
        run: apt-get update -qq && apt-get install -y --no-install-recommends jq

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        uses: https://data.forgejo.org/actions/download-artifact@v3.1.0
        with:
          name: release-assets-${{ steps.get-version.outputs.version }}
          path: dist/

      - name: Create or update Codeberg release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
          REPO: maxagahi/yadgar
          API: https://codeberg.org/api/v1
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          # Check if release already exists
          RELEASE_ID=$(curl -sf -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${API}/repos/${REPO}/releases/tags/${TAG}" 2>/dev/null | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['id'])" 2>/dev/null || echo "")

          if [ -z "$RELEASE_ID" ]; then
            # Create new release
            RELEASE_ID=$(curl -sf -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              "${API}/repos/${REPO}/releases" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"yadgar ${VERSION}\",\"body\":\"Release ${VERSION}. See CHANGELOG.md for details.\",\"draft\":false,\"prerelease\":$(python3 -c "print('true' if 'alpha' in '${VERSION}' or 'beta' in '${VERSION}' else 'false')")}" | \
              python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            echo "Created release ${RELEASE_ID} for ${TAG}"
          else
            echo "Release ${RELEASE_ID} already exists for ${TAG}"
          fi

          # Upload all dist/ files as release assets
          for f in dist/*; do
            filename=$(basename "$f")
            echo "Uploading ${filename}..."
            curl -sf -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${f}" \
              "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${filename}" || \
              echo "WARN: Failed to upload ${filename} (may already exist)"
          done
          echo "==> Release assets attached."

  # ── ACTIVE: Publish to PyPI ───────────────────────────────────────────────
  # PyPI publish — GATED to workflow_dispatch (PD-45, v5.46.8). Internal dev
  # uses manual `twine upload` instead. When going production: change gate to
  # startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'.
  # PYPI_API_TOKEN must be configured in Forgejo Settings → Actions → Secrets.
  # Token scope: project-scoped to 'yadgar' on pypi.org (least-privilege).
  # Rotate before expiry; see docs/PLAN_V5_46_1_DISTRIBUTION_INFRA.md P7.
  publish-pypi:
    needs: build-wheel
    runs-on: ubuntu-latest
    # GATED: only fire on manual workflow_dispatch (PD-45).
    if: github.event_name == 'workflow_dispatch'
    container:
      image: docker.io/openfantasy/yadgar-ci:5.46.3
    steps:
      # make, git, nodejs are pre-installed in yadgar-ci image.

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Get version from pyproject.toml
        id: get-version
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Download dist artifacts
        uses: https://data.forgejo.org/actions/download-artifact@v3.1.0
        with:
          name: dist-${{ steps.get-version.outputs.version }}
          path: dist/

      - name: Install twine
        run: pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  # open-nix-pr stub REMOVED per PD-40 (2026-06-05).
  # Cross-repo nix PR auto-open retired; replaced by pre-commit hook:
  # scripts/sync_version.py auto-updates flake.nix line 41 on pyproject.toml bump.
  # scripts/check_versions.py verifies consistency on every commit.
  # Committed @53de97a. See docs/DECISIONS.md PD-40.
