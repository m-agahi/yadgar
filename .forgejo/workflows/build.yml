---
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "yadgar/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "Dockerfile.backend"
      - "entrypoint.sh"
      - "entrypoint-backend.sh"
      - "server.json"
  workflow_dispatch:

jobs:
  docker:
    runs-on: codeberg-small
    container:
      image: docker:cli
    steps:
      - name: Install minimal tools
        # docker:cli is alpine-based and already has the docker CLI.
        # We only need bash for shell heredocs, python3 for version
        # extraction, nodejs+git for actions, curl for the action runtime.
        run: apk add --no-cache bash python3 nodejs git curl

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Log in to Docker Hub
        uses: https://github.com/docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx (Build Cloud)
        # Installs a recent buildx (cloud driver requires v0.13+) AND creates
        # the cloud builder + sets it active in one step. Replaces our prior
        # manual buildx download + `docker buildx create --driver cloud`.
        uses: https://github.com/docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: openfantasy/builder

      - name: Extract version
        run: |
          VERSION=$(python3 -c "
          import re
          print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))
          ")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ── Core image (yadgar) ──────────────────────────────────────────────

      - name: Docker metadata (core)
        id: meta-core
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: openfantasy/yadgar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.VERSION }},enable={{is_default_branch}}

      - name: Build and push core
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=registry,ref=openfantasy/yadgar:buildcache
          cache-to: type=registry,ref=openfantasy/yadgar:buildcache,mode=max

      # ── Backend image (yadgar-backend) ───────────────────────────────────

      - name: Docker metadata (backend)
        id: meta-backend
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: openfantasy/yadgar-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.VERSION }},enable={{is_default_branch}}

      - name: Build and push backend
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=openfantasy/yadgar-backend:buildcache
          cache-to: type=registry,ref=openfantasy/yadgar-backend:buildcache,mode=max
