---
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "yadgar/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "Dockerfile.backend"
      - "entrypoint.sh"
      - "entrypoint-backend.sh"
      - "server.json"
  workflow_dispatch:

jobs:
  docker:
    runs-on: codeberg-small
    container:
      image: docker:cli
    steps:
      - name: Install minimal tools
        # docker:cli is alpine-based and already has docker + buildx.
        # We only need bash for the heredoc auth config and python for
        # version extraction.
        run: apk add --no-cache bash python3 nodejs git

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Configure Docker Hub credentials (no daemon needed)
        # Build Cloud uses the buildx cloud driver, which doesn't require
        # a local docker daemon. `docker login` queries the daemon for
        # credential storage, so we write ~/.docker/config.json directly
        # — buildx reads this for both Docker Hub pushes and cloud builder
        # authentication.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf "%s:%s" "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 -w0)
          cat > ~/.docker/config.json <<EOF
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "auth": "$AUTH"
              }
            }
          }
          EOF
          chmod 600 ~/.docker/config.json

      - name: Set up Docker Build Cloud builder
        # openfantasy/builder is the Build Cloud builder. Build steps run
        # remotely on Docker's infrastructure (multi-arch native, fast cache);
        # the codeberg-small runner only orchestrates.
        run: |
          docker buildx create --driver cloud openfantasy/builder --name cloud-builder
          docker buildx use cloud-builder
          docker buildx inspect --bootstrap

      - name: Extract version
        run: |
          VERSION=$(python3 -c "
          import re
          print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))
          ")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ── Core image (yadgar) ──────────────────────────────────────────────

      - name: Build and push core (master — latest only)
        if: github.ref == 'refs/heads/master'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target prod \
            --cache-from type=registry,ref=openfantasy/yadgar:buildcache \
            --cache-to   type=registry,ref=openfantasy/yadgar:buildcache,mode=max \
            -f Dockerfile \
            -t openfantasy/yadgar:latest \
            --push \
            .

      - name: Build and push core (tag — latest + version)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target prod \
            --cache-from type=registry,ref=openfantasy/yadgar:buildcache \
            --cache-to   type=registry,ref=openfantasy/yadgar:buildcache,mode=max \
            -f Dockerfile \
            -t openfantasy/yadgar:latest \
            -t openfantasy/yadgar:${{ env.VERSION }} \
            --push \
            .

      # ── Backend image (yadgar-backend) ───────────────────────────────────

      - name: Build and push backend (master — latest only)
        if: github.ref == 'refs/heads/master'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=openfantasy/yadgar-backend:buildcache \
            --cache-to   type=registry,ref=openfantasy/yadgar-backend:buildcache,mode=max \
            -f Dockerfile.backend \
            -t openfantasy/yadgar-backend:latest \
            --push \
            .

      - name: Build and push backend (tag — latest + version)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=openfantasy/yadgar-backend:buildcache \
            --cache-to   type=registry,ref=openfantasy/yadgar-backend:buildcache,mode=max \
            -f Dockerfile.backend \
            -t openfantasy/yadgar-backend:latest \
            -t openfantasy/yadgar-backend:${{ env.VERSION }} \
            --push \
            .
