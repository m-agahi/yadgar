---
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "yadgar/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "Dockerfile.backend"
      - "entrypoint.sh"
      - "entrypoint-backend.sh"
      - "server.json"
  workflow_dispatch:

jobs:
  docker:
    runs-on: codeberg-small
    container:
      image: debian:bookworm-slim
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
    steps:
      - name: Install Docker CLI + buildx
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            nodejs git curl gnupg ca-certificates python3
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian bookworm stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update && apt-get install -y --no-install-recommends \
            docker-ce-cli docker-buildx-plugin

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Set up Docker Build Cloud builder
        # openfantasy/builder is a Docker Build Cloud builder. Build steps run
        # remotely on Docker's infrastructure (multi-arch native, fast cache),
        # not on the codeberg-small runner.
        run: |
          docker buildx create --driver cloud openfantasy/builder --name cloud-builder
          docker buildx use cloud-builder
          docker buildx inspect --bootstrap

      - name: Extract version
        run: |
          VERSION=$(python3 -c "
          import re
          print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))
          ")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ── Core image (yadgar) ──────────────────────────────────────────────

      - name: Build and push core (master — latest only)
        if: github.ref == 'refs/heads/master'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target prod \
            --cache-from type=registry,ref=openfantasy/yadgar:buildcache \
            --cache-to   type=registry,ref=openfantasy/yadgar:buildcache,mode=max \
            -f Dockerfile \
            -t openfantasy/yadgar:latest \
            --push \
            .

      - name: Build and push core (tag — latest + version)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target prod \
            --cache-from type=registry,ref=openfantasy/yadgar:buildcache \
            --cache-to   type=registry,ref=openfantasy/yadgar:buildcache,mode=max \
            -f Dockerfile \
            -t openfantasy/yadgar:latest \
            -t openfantasy/yadgar:${{ env.VERSION }} \
            --push \
            .

      # ── Backend image (yadgar-backend) ───────────────────────────────────

      - name: Build and push backend (master — latest only)
        if: github.ref == 'refs/heads/master'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=openfantasy/yadgar-backend:buildcache \
            --cache-to   type=registry,ref=openfantasy/yadgar-backend:buildcache,mode=max \
            -f Dockerfile.backend \
            -t openfantasy/yadgar-backend:latest \
            --push \
            .

      - name: Build and push backend (tag — latest + version)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=openfantasy/yadgar-backend:buildcache \
            --cache-to   type=registry,ref=openfantasy/yadgar-backend:buildcache,mode=max \
            -f Dockerfile.backend \
            -t openfantasy/yadgar-backend:latest \
            -t openfantasy/yadgar-backend:${{ env.VERSION }} \
            --push \
            .
