---
name: Validate

on:
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: Install Node.js, git, gitleaks, and ruff
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends nodejs git curl ca-certificates
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          pip install --no-cache-dir ruff==0.15.10

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files
