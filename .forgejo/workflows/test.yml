---
name: Test

on:
  pull_request:
    branches: [master]
    paths:
      - "yadgar/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: Install system deps
        run: apt-get update -qq && apt-get install -y --no-install-recommends nodejs git curl ca-certificates

      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Cache pip
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-

      - name: Cache HuggingFace models
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: /root/.cache/huggingface
          key: hf-models-v1-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-models-v1-

      - name: Cache SurrealDB binary
        id: cache-surreal
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: /usr/local/bin/surreal
          key: surrealdb-v3.0.5

      - name: Install SurrealDB v3.0.5
        # yadgar v4.x requires SurrealDB v3 (type::record, <|K, EF|> KNN,
        # FULLTEXT ANALYZER syntax all need v3). v2.x rejects them.
        if: steps.cache-surreal.outputs.cache-hit != 'true'
        run: |
          SURREAL_VERSION="v3.0.5"
          SURREAL_SHA256="48dbeba4896765f33e07acc25224073f0850c190872052b917ebda1f7b4375cb"
          curl -fsSL "https://github.com/surrealdb/surrealdb/releases/download/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz" -o /tmp/surreal.tgz
          echo "${SURREAL_SHA256}  /tmp/surreal.tgz" | sha256sum -c -
          tar -xzf /tmp/surreal.tgz -C /usr/local/bin surreal
          chmod +x /usr/local/bin/surreal

      - name: Install dependencies
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -e ".[test,ml]"

      - name: Run tests
        # NOTE: conftest.py's session-scoped `surreal_server` fixture starts
        # and stops a SurrealDB process on a free port and sets YADGAR_DB_URL
        # itself — do not pre-start a server here, do not set YADGAR_DB_URL.
        # xdist worker count is capped via `addopts` in pyproject.toml.
        run: python -m pytest -q --tb=short
