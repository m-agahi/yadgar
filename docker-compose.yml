# Yadgar v4 — dev-only Docker Compose
# Production uses plain docker run via systemd (see: yadgar daemon install-service)
# Usage: docker compose up --build
#
# v5.6.7 PR-M — Log directory (YADGAR_LOG_DIR) notes:
#   Dev default (below): named volume `yadgar-backend-logs` mounted at /data/logs.
#   The Python layer defaults to ~/.yadgar/logs when YADGAR_LOG_DIR is unset, but
#   entrypoints default YADGAR_LOG_DIR to /data/logs so containers stay on /data/logs.
#
#   Production / Alloy integration: to let an external log shipper (e.g. Grafana Alloy
#   running as DynamicUser) read logs without home-dir 700 traversal issues, flip the
#   backend volume entry to a host bind-mount and set YADGAR_LOG_DIR accordingly:
#
#     # In the backend service, replace the named-volume line:
#     #   - yadgar-backend-logs:/data/logs
#     # with a host bind-mount (create the host dir first with tmpfiles or manually):
#     #   - /var/log/yadgar:/data/logs
#     # and add/set in environment:
#     #   YADGAR_LOG_DIR: /data/logs
#
#   The NixOS side (systemd.tmpfiles + Alloy __path__ glob) is a separate nix-repo change.
version: "3.9"

networks:
  yadgar-net:
    driver: bridge

volumes:
  yadgar-db-data:
  yadgar-dev-data:
  yadgar-queue-data:
  yadgar-backend-logs:
  # Engine #2 (ADR-0195) datadir. Production needs no equivalent entry: there
  # the whole data root is a single writable host bind-mount
  # (~/.local/share/yadgar -> /data), so /data/mariadb is already writable and
  # no unit renderer changes. Dev is the odd one out because it mounts
  # yadgar-db-data at /data READ-ONLY, hence this narrow rw volume.
  yadgar-mariadb-data:
  # Production bind-mount alternative (see comment block above):
  # To switch, remove the named volume entry above and use a host path in the
  # backend service volumes section: - /var/log/yadgar:/data/logs

services:
  backend:
    image: openfantasy/yadgar-backend:${BACKEND_VERSION:-5.72.31}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: yadgar-backend
    networks:
      - yadgar-net
    ports:
      - "127.0.0.1:8001:8001"   # embed service (localhost only)
    volumes:
      - yadgar-db-data:/data:ro
      - yadgar-backend-logs:/data/logs
      # Engine #2 datadir — WRITABLE, mounted over the :ro /data at exactly the
      # one path mariadbd owns (same nesting trick /data/logs already uses).
      # Chosen over flipping /data to rw: production's /data IS writable, so
      # this makes dev match production for the datadir path ONLY, without
      # widening the dev DB mount. `read_only: true` below is unaffected — it
      # hardens the container's own filesystem layers, not volume mounts.
      - yadgar-mariadb-data:/data/mariadb
      # R3: backend runs the queue drainer → needs the file queue r/w. Backend's /data is
      # the read-only DB, so mount the shared queue volume at a distinct path. Core mounts
      # the SAME volume at /data → both see volume-root/queue (see YADGAR_QUEUE_BASE below).
      - yadgar-queue-data:/queue-data
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      SURREAL_USER: ${SURREAL_USER:?must set SURREAL_USER}
      SURREAL_PASS: ${SURREAL_PASS:?must set SURREAL_PASS}
      YADGAR_BACKEND_LOG_LEVEL: ${YADGAR_BACKEND_LOG_LEVEL:-warn}
      # ADR-0180: the backend serves /admin/* and compares the presented bearer
      # against its own copy of this token. Unset → the gate fails closed and
      # every admin call is rejected. Required (`:?`) like SURREAL_* above, so
      # `compose up` fails loudly at start rather than 500-ing on first use.
      YADGAR_MCP_AUTH_TOKEN: ${YADGAR_MCP_AUTH_TOKEN:?must set YADGAR_MCP_AUTH_TOKEN}
      # R3: queue root for the backend drainer. Core omits this → falls back to YADGAR_DATA_DIR
      # (/data). Both resolve to <shared yadgar-queue-data volume>/queue.
      YADGAR_QUEUE_BASE: /queue-data
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s  # model load can take a while

  core:
    image: openfantasy/yadgar:${CORE_VERSION:-5.181.38}
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: yadgar-core
    networks:
      - yadgar-net
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - .:/app                             # source mount for editable install
      - yadgar-queue-data:/data            # persistent file queue + archive
    environment:
      YADGAR_DB_URL: http://yadgar-backend:8000
      YADGAR_EMBED_URL: http://yadgar-backend:8001
      YADGAR_HOST: "0.0.0.0"
      YADGAR_PORT: "8765"
      YADGAR_DATA_DIR: "/data"
      # ADR-0180: core CALLS the backend's /admin/* routes and must send this
      # bearer. Same token as the backend service above — one shared secret.
      YADGAR_MCP_AUTH_TOKEN: ${YADGAR_MCP_AUTH_TOKEN:?must set YADGAR_MCP_AUTH_TOKEN}
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/live', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
